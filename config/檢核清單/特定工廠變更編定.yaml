    規則編號: [SFA-3-2]
    名稱: 前三年無重大環保違規停工停業
    條號: 辦法§3②
    類型: inquiry
    機關: 臺南市政府環境保護局
    備註: 用地計畫申請前三年內未有因違反環保法規經認定情節重大命令停工或停業。

  - id: wastewater

    規則編號: [SFA-7-5]
    名稱: 廢（污）水排放計畫證明文件
    條號: 辦法§7Ⅴ
    類型: inquiry
    機關: 臺南市政府環境保護局／水利局
    備註: >-
      核定前必須完成：事業廢水→水污染防治法排放許可或簡易排放許可；
      生活污水→取得相關主管機關同意對外排放文件。文件不齊者準用補正、屆期駁回。

  - id: cluster_area

    規則編號: [SFA-2-1, SFA-7-6]
    名稱: 是否位於群聚地區（優先採新訂都計或產業園區）
    條號: 辦法§2Ⅰ、§7Ⅵ
    類型: inquiry
    機關: 臺南市政府經濟發展局／都市發展局
    備註: >-
