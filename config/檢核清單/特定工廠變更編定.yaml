      未登記工廠納管後取得）。無特登＝無法走本辦法，須先完成納管與特登。

  - id: low_pollution

    規則編號: [SFA-6-4, FMA-28-7]
    名稱: 低污染產業類別及主要產品認定
    條號: 辦法§6④、工輔法§28-7Ⅲ
    類型: inquiry
    機關: 經濟部／臺南市政府經濟發展局
    備註: 生產事業須屬低污染認定基準之產業類別及主要產品；增加或變更亦以低污染為限。

