    備註: 全部申請範圍土地皆須取得；非自有土地者為關鍵先決條件。

  # ══ 2026-11-12 補列：審查辦法與工作指引其餘條件 ══
  - id: sfa_scale_route
    規則編號: [SFA-2-3, GEN-044-8]
    名稱: 面積分流（<2／2～5／≥5 公頃）
    條號: 特定工廠申請變更編定為特定目的事業用地審查辦法§2Ⅲ；開發審議規範總編四十四之八
    類型: note
    級別: 參考
    備註: >-
      （2026-11-12 依知識庫建議補列，使用者定案「後續都加」）非群聚、都市計畫以外：未達 2 公頃→本辦法用地計畫＋變更編定；2～5 公頃→用地計畫核定後取得開發許可
      變更為特定專用區，適用總編四十四之八（排除三之一、十七、二十六等，改依兩條獨立聯絡道路其一 ≥8m、透水
      ≥30%、公設 ≥30% 且綠地 ≥10%、緩衝綠帶得酌減至 1.5m）；≥5 公頃→依產業創新條例變更為工業區，不適用本辦法。

