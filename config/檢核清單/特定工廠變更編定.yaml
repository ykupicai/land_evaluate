# 特定工廠（特登工廠）申請變更編定為特定目的事業用地 — 禁止事由與必備條件檢核清單
#
# 法源（皆已回官方資料庫逐條核對，2026-07-30 安定六塊寮段案建立）：
#   ① 特定工廠申請變更編定為特定目的事業用地審查辦法（J0030153，全國法規資料庫）
#   ② 工廠管理輔導法（J0030043）§28-1~§28-12（特定工廠登記制度、§28-10 授權訂定①）
#   ③ 農業主管機關同意農業用地變更使用審查作業要點（FL014304）→ 走 _共通_農業用地變更
#   ④ 非都市土地使用管制規則（D0060013）§52-1 第九款「取得特定工廠登記」得為建築使用
#
# ★ 使用方式：一律搭配 `_共通_農業用地變更` 一起跑
#   （辦法 §4①五明定「涉及農業用地變更者，應擬具農業用地變更使用說明書」，
#     所以特農區／養殖漁業生產區的不同意事由會實質進來，不因走特登工廠而豁免）
用途: 特定工廠申請變更編定為特定目的事業用地（非都市土地、都市計畫以外）
法源版本: 特定工廠申請變更編定為特定目的事業用地審查辦法（J0030153）
法源查核日期: 2026-07-30
搭配清單: [_共通_農業用地變更]

# ── 面積分流（辦法§2Ⅲ，非障礙但決定整條程序路徑，寫在此供出簡報引用）──────
#   未達 2 公頃          → 依本辦法提用地計畫，辦理使用地變更編定為特定目的事業用地
#   2 公頃以上未達 5 公頃 → 用地計畫核定後，另依管制規則與審議規範取得開發許可
#   5 公頃以上           → 依產業創新條例辦理分區變更為工業區，不適用本辦法
#   位於§28-10Ⅰ①群聚地區 → 優先採新訂都市計畫或開發產業園區處理（辦法§2Ⅰ、§7Ⅵ得駁回）
#
# ── 數值型必備條件（依基地面積實算，非圖資套疊，出簡報時逐項核對）──────────
#   隔離綠帶：未達2公頃者「寬度至少1.5公尺且面積不少於申請面積30%」（§6①(一)）
#             得使用毗連土地至多3公尺範圍納入申請範圍並編為特定目的事業用地（§6②）
#             相鄰農業用地已取得特定工廠登記者，於相鄰處得免留設（§6①但書）
#   強度：建蔽率 ≤70%、容積率 ≤180%（§6⑤）
#   屋頂光電：應設置屋頂型太陽光電，裝置面積 ≥屋頂水平投影面積50%（§5④，有例外免設）
#   申請期限：至遲民國121年3月19日前提出用地計畫申請（§3①，不可歸責者除外）

檢核項目:
  # ★★ 本清單最重要的一項：特定農業區在特登工廠案是「有路可走」，不是絕對禁止
  - id: sfa_guidance_plan
    規則編號: [SFA-GP-6, FMA-28-10]
    名稱: 特定農業區之輔導計畫路徑（農地變更要點§6但書第2款）
    條號: 工輔法§28-10Ⅳ、行政院110.09.14院臺經字第1100181578號核定輔導計畫§6
    類型: inquiry
    機關: 臺南市政府經濟發展局（受理）／農業局（同意）
    備註: >-
      行政院110年9月14日院臺經字第1100181578號核定「特定工廠申請利用非都市土地
      特定農業區用地變更輔導計畫」（依工輔法§28-10Ⅳ訂定，實施期程至民國129年3月19日，
      主辦機關為各直轄市、縣市主管機關）。該計畫第六點明定：符合適用對象之申請案件
      倘涉及特定農業區之農業用地變更使用時，主管機關**得依農業用地變更審查作業要點
      第6點但書第2款（經行政院核定之計畫之所需用地）規定受理申請**。
      經濟部「優化特定工廠用地計畫審核作業工作指引」（112年9月，適用非都市土地
      未達2公頃案件）第19頁審查要領並載明：該輔導計畫經行政院核定在案，
      「顯見特定工廠申請廠地範圍土地合法化經營具其必要性、合理性及無可替代性，
      與一般素地開發之性質有別」；第13頁「必要性」審查亦載明應予積極輔導。
      → 故 _共通_農業用地變更 的 sfa_zone（特農區）在特登工廠案應由 ╳ 改判 **△**：
      有法定受理依據，但仍須①無要點第五點各款情形（尤其§5②農業灌排）
      ②取得農業主管機關同意文件（隔離綠帶完成勘驗後才核發）③通過整體規劃考量。

  - id: no_consent_grounds

    規則編號: [AGR-005, SFA-4-1-5]
    名稱: 農地變更要點第五點各款（不同意變更之七款）
    條號: 農地變更要點§5
    類型: inquiry
    機關: 臺南市政府農業局／農業部農田水利署
    備註: >-
      走§6但書仍須「無第五點各款情形」，其中對本類案件最實質者：
      §5②使用具農業灌溉功能之系統作廢污水排放或妨礙上下游農業灌排水系統輸水能力。
      工作指引第18頁：用地計畫審查表第9項「是否影響鄰近農地灌溉排水設施」，
      得依申請人自行檢附**農業部農田水利署**審查意見判斷；未檢附者由工業主管機關
      平行分會時一併邀集農田水利署實地會勘。基地緊鄰灌排渠道者務必先取得該署意見。

  - id: post20160520_structures

    規則編號: [SFA-GL-13]
    名稱: 105年5月20日以後增建地上物之適法性
    條號: 工作指引第13頁
    類型: inquiry
    機關: 臺南市政府經濟發展局（工業主管機關）
    備註: >-
      用地計畫所附地形測量圖現況與特定工廠登記登載不符（取得臨時工廠登記後再增建之
      建築物、雨遮、停車棚等）為常見駁回原因。屬105年5月20日以後增建者，其適法性
      **屬工業主管機關審查權責**，主管機關得經農林航測所、國土測繪圖資服務雲查核；
      有此情形應通知業者30日內陳述意見，陳述無理由者依法駁回。
      ★申請前務必自行以正射影像逐年比對，確認現況與特登登載範圍一致。

  - id: overall_planning_veto

    規則編號: [SFA-GP-6, SFA-7-6]
    名稱: 整體規劃駁回權
    條號: 輔導計畫§3(二)2(3)、變更編定審查辦法§7Ⅵ
    類型: inquiry
    機關: 臺南市政府經濟發展局／都市發展局
    備註: >-
      未達2公頃者，「因整體規劃之需要，直轄市、縣(市)主管機關得駁回特定工廠申請
      使用地變更編定」；另位於群聚地區且經規劃採新訂都市計畫或開發產業園區區位者
      亦得駁回。這是本類案件無法以基地條件排除的程序風險，開案即應確認區位認定。

  - id: slope_land

    規則編號: [SFA-4-1-9]
    名稱: 山坡地（決定是否須水土保持計畫）
    條號: 辦法§4①九
    類型: overlay
    級別: △
    圖層: '環境敏感相關\第二級\2-06 山坡地 (1060531update)\BOUNDARY.shp'
    陳舊警告_年: 12
    備註: >-
      屬山坡地並經認定須擬具水土保持計畫者，應檢附水土保持完工證明文件。
      未觸及山坡地即不辦水土保持（總表寫明免辦依據，不為它做一頁）。

  - id: factory_registration

    規則編號: [SFA-4-1-2]
    名稱: 特定工廠登記文件
    條號: 辦法§4①二
    類型: inquiry
    機關: 臺南市政府經濟發展局
    備註: >-
