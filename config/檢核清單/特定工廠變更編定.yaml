    類型: note
    級別: 參考
    備註: （2026-11-12 依知識庫建議補列，使用者定案「後續都加」）至遲應於民國 121 年 3 月 19 日前提出用地計畫申請；逾期且無不可歸責事由者應予駁回（§7Ⅱ）。

