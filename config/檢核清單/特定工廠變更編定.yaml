  - id: sfa_greenbelt
    規則編號: [SFA-6-1]
    名稱: 隔離綠帶或設施（未達 2 公頃：寬 1.5m 且面積 ≥30%）
    條號: 審查辦法§6①②③
    類型: note
    級別: 參考
    備註: >-
