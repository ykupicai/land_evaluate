# 都市計畫農業區球場／運動訓練設施（臺南市）— 禁止事由檢核清單
# 法源：臺南市都市計畫保護區農業區土地使用審查要點（GL000316）第六點七款
# 沿革：由西港州海段案（2026-07-28）的逐款查證沉澱而來；
#   2026-11-12 依 115.08.31 修正版（府都管字第1151316013號函，知識庫回官方原文拆條 TNN-UPA-*）更正款次：
#   舊第④款建築法§47 與舊第⑥款土壤液化併入新第(六)款第1、2目；新第(四)款為自然地景、野生動物保護區。
用途: 戶外球類運動場與運動訓練設施（臺南市都市計畫農業區）
法源版本: 臺南市都市計畫保護區農業區土地使用審查要點（GL000316，115.08.31 修正）
法源查核日期: 2026-11-12

檢核項目:
  - id: land_consolidation
    規則編號: [TNN-UPA-6-1]
    名稱: 農地重劃區
    條號: 審查要點第六點(一)
    類型: overlay
    級別: ╳
    圖層: '農地重劃區\20230505農地重劃區.shp'
    陳舊警告_年: 4
    翻轉條件: 經市府農業局認定未影響該地區農田、農路與農業生產環境，且管理機關認定未影響水路、水利設施功能者，不在此限。

  - id: forest
    規則編號: [TNN-UPA-6-2]
    名稱: 保安林地
    條號: 審查要點第六點(二)
    類型: overlay
    級別: ╳
    圖層: '環境敏感相關\第一級\1-23-1 森林(國有林、保護林)(1050930update)\保安林(1050930update)\全台保安林分布概略圖1051_ALL.shp'
    陳舊警告_年: 12
    翻轉條件: 經林業主管機關同意者，不在此限。

  - id: military
    規則編號: [TNN-UPA-6-3]
    名稱: 軍事禁建區、都市計畫禁建區及其他依法公告之禁建區
    條號: 審查要點第六點(三)
    類型: inquiry
    機關: 國防部（軍事禁建區屬機密）；臺南市政府都市發展局（都市計畫禁建區）

  - id: wildlife_landscape
    規則編號: [TNN-UPA-6-4]
    名稱: 自然地景、野生動物保護區或野生動物重要棲息環境
    條號: 審查要點第六點(四)
    類型: note
    級別: ╳
    備註: >-
      （2026-11-12 依 115.08.31 修正版補列）以 ⓪b NGIS 環敏套疊（野生動物保護區、野生動物重要棲息環境、
      自然地景）判定；命中即不得設置。

  - id: water_protect
    規則編號: [TNN-UPA-6-5]
    名稱: 水質水量保護區、飲用水水源水質保護區或取水口一定距離內
    條號: 審查要點第六點(五)
    類型: overlay
    級別: ╳
    圖層: '環境敏感相關\第二級\2-20 自來水水質水量保護區(1060629update)\WaterQualityAndQuantityProtectionArea_Twd97_V3.0.shp'
    陳舊警告_年: 12
    翻轉條件: 為居民生活所必要，且經目的事業主管機關核准者，不在此限。

  - id: building_law_47
    規則編號: [TNN-UPA-6-6]
    名稱: 建築法第47條公告劃定之崩塌滑動危險地區
    條號: 審查要點第六點(六)1
    類型: inquiry
    機關: 臺南市政府工務局

  - id: liquefaction
    規則編號: [TNN-UPA-6-6]
    名稱: 都市計畫書載明不得開發之土壤液化潛在區（含山坡地、地質敏感區）
    條號: 審查要點第六點(六)2
    類型: overlay
    級別: △
    圖層:
      - '環境敏感相關\其他\土壤液化\{county}-低潛勢範圍圖.shp'
      - '環境敏感相關\其他\土壤液化\{county}-中潛勢範圍圖.shp'
      - '環境敏感相關\其他\土壤液化\{county}-高潛勢範圍圖.shp'
    陳舊警告_年: 12
    備註: >-
      （2026-11-12 依修正版更正，原判 ╳ 過嚴）新版只限「都市計畫主要計畫及細部計畫所列、並**載明不得開發**」
      之山坡地、地質敏感區或土壤液化潛在區。圖層命中只代表位於潛勢區，須再查該都市計畫書有無載明不得開發，
      有才是 ╳。第(六)款第3目另有已公告斷層帶。亦可用地質雲 API（GET /api/v1/zh-tw/liquefaction）交叉驗證。

  - id: other_ban
    規則編號: [TNN-UPA-6-7]
    名稱: 其他法令規定禁止或經主管機關認定不適宜使用之地區
    條號: 審查要點第六點(七)
    類型: inquiry
    機關: 臺南市政府都市發展局
