# 都市計畫「保護區」變更為住宅區 檢核（臺北市，個案變更）
# 2026-09-13 臺北市中山區北安段一小段＋內湖區西湖段二小段 15 筆案首次建立。
#
# ★與臺南市那份（住宅區_都市計畫_臺南市.yaml）的分界：
#   那份是**農業區**變更住宅區、母法是都市計畫農業區變更使用審議規範（FL003637）；
#   本份是**保護區**變更住宅區、臺北市的門檻母體是市府自訂的
#   **「全市性保護區處理原則」**（臺北市都委會 103.12.18 第 667 次會議報告）。
#   保護區不在 FL003637 的名稱裡（該規範名為「都市計畫農業區變更使用審議規範」），
#   **本案不套用它**；農業端的 FL014304 則兩者都要走（§2(三)、§8 明列保護區）。
#
# ★建清單前已逐條掃過法令檢核規則庫 20_規則庫 全表 181 列（2026-09-13）。
#   排除非都市土地／光電／漁電專用者後的 29 列逐條比對，適用者已收進本清單；
#   規則庫**無都市計畫法、無大眾捷運法、無民用航空法、無臺北市自治條例**條號，
#   該四項於本清單標明來源並註記「規則庫未載，交付前補查正式條號」。
用途: 都市計畫保護區變更住宅區
縣市: 臺北市
法源版本: >-
  全市性保護區處理原則（臺北市都委會103.12.18第667次會議報告）
  ＋臺北市土地使用分區管制自治條例114.07.09修正（FL003962）
  ＋農業主管機關同意農業用地變更使用審查作業要點（FL014304）
  ＋水土保持法§12／水利法§83-10／開發行為應實施環境影響評估細目及範圍認定標準§25
法源查核日期: 2026-09-13

檢核項目:

  # ── 一、臺北市全市性保護區處理原則（本案的門檻母體）────────────────
  - id: tp_prot_p2
    名稱: 保護區處理原則 原則二（鄰接非保護區邊界）
    條號: 全市性保護區處理原則 第二點
    類型: note
    級別: 參考
    備註: >-
      「保護區如需變更為非保護區者，以不影響國土保安、水土保持、生態保育、天然及
      文化資源維護，並以鄰接非保護區邊界地區為原則。」
      ★★**本點是複合要件，不可只判「鄰接非保護區邊界」就給○**（2026-09-13 使用者
      更正產線初判）：前段的「不影響國土保安、水土保持」與後段的鄰接要件**要一起看**。
      基地若涉山坡地或地質敏感區，縱使鄰接要件符合，仍須由主管機關認定是否不影響
      國土保安及水土保持 → 判 △ 而非 ○。
      實作：鄰接要件以基地與非保護區之**共同邊界長度**實算（含中間既有道路者另以
      容差計），並列基地占該塊保護區之比例佐證「屬邊緣而非核心」。
    查證: 臺北市政府都市發展局「全市性保護區處理原則」檢核結果補充資料

  - id: tp_prot_p4
    名稱: 保護區處理原則 原則四（既有合法建物或聚落＋坡度＋無山崩）
    條號: 全市性保護區處理原則 第四點
    類型: note
    級別: 關鍵
    備註: >-
      ★★**保護區變更為其他使用分區，實務上唯一的路徑**。四個要件：
      (a)**保護區內鄰接非保護區之既有合法建物或聚落** (b)平均原始坡度<30%
      (c)無歷史山崩 (d)無外圍邊坡崩塌及土石流影響。
      變更後另須：建築強度不得高於毗鄰住宅區、不得申請容積獎勵及容積移轉、
      應提完整之回饋計畫及開發計畫（含極端氣候調適、基地地質調查及地質安全評估報告、
      交通影響評估、景觀計畫、整地排水計畫），並經**都市設計及土地使用開發許可審議
      委員會**審議通過。
      ★★**(a) 是前提要件，不成立則後續各款不再檢核**——該處理原則所載唯一個案變更
      前例（變更北投區泉源段4小段771地號等7筆保護區為文教區）即因「現況實際為荒廢
      無使用狀態，且非屬既有合法聚落，非屬本項處理原則優先適用對象」被整串排除，
      連原則五都寫「非屬前項處理原則優先適用對象，不適用本原則」。
      → **開案第一步是證明既有建物之「合法性」**（建照、使用執照、門牌、稅籍、
      歷年航照），不是先去算坡度或環敏。
      ⚠ 「使用中」不等於「合法」：保護區依臺北市土地使用分區管制自治條例僅容許特定
      使用，若現況為零售批發、倉儲等，很可能本身即違規使用。
      ⚠ (c)「無歷史山崩」**基地內為 0 不等於沒事**——內湖案最近一處僅 1.9 公尺、
      緊貼基地北界，審查方調同一份山崩雲圖資即可見，須正面回應而非只寫「無」。
    查證: 同上；前例檢核情形逐字引自該補充資料

  - id: tp_prot_p5
    名稱: 保護區處理原則 原則五（基地及毗鄰50公尺無開發風險）
    條號: 全市性保護區處理原則 第五點
    類型: note
    級別: 關鍵
    備註: >-
      「該基地**及毗鄰地區 50 公尺範圍內**須確認無開發風險，且**不得位於環境敏感地區
      及中高、高之山崩潛感區**，並須經本府相關單位檢核確認。」
      ★★**「環境敏感地區」的認定口徑未明，是可行性的分水嶺，不可自行拍板**：
      ・**嚴格口徑**（NGIS 54 圖層任一命中）→ 臺北市山區保護區幾乎全數不通過，
        原則四形同具文，推定非原意；
      ・**開發風險口徑**（指山崩潛感、地質敏感等與開發風險直接相關者，或指第一級）
        → 尚有論述空間。
      → **一律列為「須向都發局查明認定口徑」的待確認項**，不得逕行判 ○ 或 ╳。
      ⚠ 本款要算的是**基地＋外擴 50 公尺**的環域，不是只算基地（內湖案地質敏感區
      基地內僅 1.59%、含毗鄰 50 公尺達 18.35%，差一個量級）。
      ⚠ **中高、高山崩潛感區**本機 `環境敏感相關/` **沒有這個圖層**（地質敏感區之
      山崩與地滑是不同圖層，不可互相替代），須洽臺北市政府工務局大地工程處或
      經濟部地質調查及礦業管理中心。
    查證: 同上

  - id: tp_prot_p1_3_6
    名稱: 保護區處理原則 原則一、三、六（本類案件不適用）
    條號: 全市性保護區處理原則 第一、三、六點
    類型: note
    級別: 參考
    備註: >-
      原則一係供各行政區**通盤檢討**時參考，個案變更不適用。
      原則三為政府於保護區內施作**公共設施**得變更為公共設施用地，變更為住宅區不適用。
      原則六為反向規定（久未開闢之公設用地得變更回保護區）。
      ⚠ 原則六對本類案件仍有**風險提示**價值：基地周邊之計畫道路若經認定無開闢必要，
      存在反向被檢討變更為保護區之可能。
      ⚠ 本處理原則於 103.12.18 第667次大會僅作**報告**，決議定位為「市府受理案件之
      檢核依據」與「都委會審議之**參考**」，**非法規命令**；個案仍以都委會審議決議為準。
    查證: 同上

  # ── 二、變更後強度 ───────────────────────────────────
  - id: tp_zoning_intensity
    名稱: 毗鄰住宅區之法定建蔽率與容積率（變更後強度上限的比較基準）
    條號: 臺北市土地使用分區管制自治條例 第十條（114.07.09 修正）
    類型: note
    級別: 參考
    備註: >-
      §10Ⅰ：第一種 30%／60%、**第二種 35%／120%**、**第三種 45%／225%**、第四種 50%／300%。
      §10Ⅱ：面臨 30 公尺以上道路、臨接或面前道路對側有河川並經都市計畫程序劃定者，
      容積率得酌予提高但不得超過——二之一 160%、二之二 225%、三之一 300%、
      三之二 400%、四之一 400%（**建蔽率不隨之提高，仍依第一項所屬「種」別**）。
      §10Ⅲ：已標示為二之一／二之二／三之一／三之二／四之一者，**建築基地臨接道路
      面寬在 16 公尺以下者，容積率仍依第一項辦理**。
      §10Ⅳ：依第一項建蔽率而無法依法定容積率之樓地板面積建築者，建蔽率放寬為
      第二種 40%、第三種 50%、第四種 60%。
      → 對應處理原則第四點「變更後建築強度不得高於毗鄰住宅區」，**以毗鄰各種別之
      實算共同邊界長度並陳**（最高者與最鄰近者可能不同，採何者為準屬都委會與
      都市設計審議之認定）。
      ⚠ **不要指望都發局圖台有值**：臺北市圖台該圖層之 `建蔽率`／`容積率` 欄位
      視地區而定，內湖案實測 75 筆全為 null。法定值一律查本自治條例。
      ⚠ 都市計畫書圖標示為「(特)」者（如第三種住宅區(特)、第三之二種住宅區(特)）
      **不在本條表內**，須查該都市計畫書，不可套用一般種別數值。
    查證: 臺北市法規查詢系統 FL003962 全文（2026-09-13 下載官方原文逐條核對）

  # ── 三、農業端（與內政部審議並行的獨立程序）──────────────────
  - id: agr_consent
    名稱: 農業主管機關同意（都市計畫保護區農業用地）
    條號: 農變要點 FL014304 §2(三)、§8；規則庫 AGR-002／AGR-008
    類型: note
    級別: 關鍵
    備註: >-
      §2(三)：「都市計畫農業區、**保護區**農業用地劃定或變更為非農業使用」應徵得
      農業主管機關同意。§8：「都市計畫農業區、**保護區**農業用地，除直轄市或縣（市）
      主管機關另定有限制條件外，應依本要點規定辦理。」
      → 與內政部（都委會）審議**並行的獨立程序**，實務上撰寫「農業用地變更使用
      說明書」（§3 九項，含**區位、面積之必要性、合理性及無可替代性**）送市府農業
      主管機關（臺北市為產業發展局）。
      ★**「都市計畫保護區內之土地」即屬農業用地，不必逐筆認定實際農作事實**
      （2026-09-14 使用者指正後查官方條文確認）：**農業發展條例 §3⑩**「農業用地：指
      非都市土地或**都市土地農業區、保護區範圍內**，依法供下列使用之土地…」；
      **同條例施行細則 §2④**「本條例第三條第十款所稱依法供該款第一目至第三目使用之
      農業用地，其法律依據及範圍如下：…四、**依都市計畫法劃定為農業區、保護區內之
      土地**。」→ 是**身分（所在分區）認定**，不是使用現況認定；故保護區變更案一律
      觸發本項，交付文件可直接寫「基地屬農業用地（農發條例§3⑩、施行細則§2④）」。
      ⚠ 先前本清單寫「須另行認定、認定前不可逕寫屬農業用地」是**過度保留**，已更正。
      ⚠ 既屬農業用地，§5 七款不同意事由、§9~§11 隔離綠帶義務一併適用，
      惟 §10 逐款未列「都市計畫保護區」，30% 面積比是否適用**須向農業主管機關查明**
      （與都市計畫農業區案同型的未定案問題，見 `_共通_農業用地變更.yaml`）。
    查證: 農業部主管法規共用系統 FL014304 全文

  # ── 四、環境與工程（規則庫逐條掃出）───────────────────────
  - id: swc_plan
    名稱: 水土保持計畫
    條號: 水土保持法 §12Ⅰ④；規則庫 SWC-012／SWCR-03
    類型: 套疊
    圖層: 山坡地
    級別: 關鍵
    備註: >-
      於**山坡地**或森林區內開發建築用地，應先擬具水土保持計畫送核定；
      §12Ⅱ計畫未經核定前，目的事業主管機關**不得逕行核發開發或利用之許可**。
      挖填方未達水土保持計畫審核監督辦法§3 規模（挖方及填方加計總和或堆積土石方
      分別未滿 2,000 立方公尺，共 12 款）者，得以**簡易水土保持申報書**代替。
      ⚠ 判定看基地是否落在山坡地範圍（NGIS 2-06），**不是看坡度數值**。
    查證: 全國法規資料庫 水土保持法、水土保持計畫審核監督辦法

  - id: wra_runoff
    名稱: 出流管制（規劃書／計畫書）與「併入水保計畫」之免辦
    條號: 出流管制辦法 §2-1、§3、§4；**水利法 §83-10Ⅰ①**；規則庫 WRA-002-1／003／004
    類型: note
    級別: 關鍵
    備註: >-
      本類案件會**同時**撞到兩條門檻：
      ・§2-1Ⅰ 新建造之建築物且基地**全部位於都市計畫區內**，面積達 **0.2 公頃**以上
        應提出流管制**計畫書**（都市計畫個案變更案必然全部位於都計區內，這條先撞到）；
      ・§3Ⅰ 面積達 **1 公頃**以上，且屬**新訂/擴大都市計畫、個案變更、通盤檢討涉
        農業區保護區公設變更為可建築用地**者，應提出流管制**規劃書**。
      ★★**但出流管制與水土保持同時觸發時，得僅辦水土保持**（2026-09-13 使用者指正
      後逐條查證）：**水利法§83-10Ⅰ①**——經所在地直轄市、縣（市）主管機關**認定**
      「**全部納入水土保持計畫內**，或未納入部分未達§83-7Ⅰ所定一定規模」者，
      **免依§83-7（規劃書）及§83-8（計畫書）辦理**；出流管制辦法§4Ⅱ明定該款所稱
      水土保持計畫**兼指水土保持規劃書**。
      ⚠⚠ **兩個條件不可省**：①**要「全部納入」**——山坡地只占一部分的基地，平地
      未納入部分若達一定規模，出流管制仍要辦；②**須經主管機關「認定」**，非自動
      生效，依同辦法§4Ⅲ應備妥水保計畫（或規劃書）及其**核定／審定函**供查核。
      → 交付寫法：山坡地案**不要並列兩條各判△**，改於「水土保持」一列載明
      「出流管制依水利法§83-10Ⅰ①得併入水保計畫辦理，惟須全部納入並經主管機關認定」。
      ⚠ 「免提計畫書」與「取得核定函」互斥，交付文字不可同時出現。
    查證: 全國法規資料庫 J0110108 全文、水利法 §83-10 全文（2026-09-13 逐條核對）

  - id: eia_new_town
    名稱: 環境影響評估（新市區建設）
    條號: 開發行為應實施環境影響評估細目及範圍認定標準 §25；環評法§5；規則庫 EIA-25
    類型: note
    級別: 關鍵
    備註: >-
      ★**本類案件最容易漏掉的一條**（2026-09-13 逐條掃規則庫才發現）：
      新市區建設之**三戶以上集合住宅或社區**興建或擴建，位於**山坡地或一般保護區**、
      特定農業區農業用地者，**面積達 1 公頃以上應實施環境影響評估**；
      非都市土地達 10 公頃以上；國家公園、重要濕地等另有更嚴門檻。
      ★**§25Ⅱ累積條款**：毗連土地合計逾 1 公頃，且二案以上建築物規劃連結或規劃
      使用相同之公共設施系統者，單案未達門檻仍應實施環評。
      → 保護區（本身即「一般保護區」）＋山坡地的住宅變更案，**1 公頃就是門檻**，
      不是非都市土地的 10 公頃。應函請環保主管機關認定，並向都發局查詢毗連土地
      在途開發案以排除第二項累積條款。
      ⚠ 應實施環評屬「需經後續作業／審議認定」→ 判 **△ 不判 ╳**（規則庫既定）。
    查證: 全國法規資料庫 O0090012 §25

  - id: state_land
    名稱: 國有非公用土地取得
    條號: 國有非公用土地提供申請開發案件處理要點 §3①(三)（112.09.15 台財產管字第11240009760號令）；國有財產法§53
    類型: 屬性
    欄位: 公私別
    級別: 關鍵
    備註: >-
      **國有非公用土地位於都市計畫範圍內者，不得同意提供申請開發**。
      都市計畫個案變更案的基地**必然位於都市計畫範圍內**，故基地內只要夾雜國有
      非公用土地，該筆即實質不可取得 → 建議剔除並**驗算剔除後面積是否仍過各門檻、
      幾何是否仍連通、有無內孔**。
      另國有財產法§53：非公用**空地**面積在 1,650 平方公尺以上者不得標售
      （未達此門檻者本條不構成限制，但§3①(三) 仍在）。
      ⚠ 公私別走 ⓪a `public_land.py`（MOI_API_039）；「未列＝私有」是**反面推論**，
      涉及取得方式之關鍵筆數仍應調閱謄本覆核。
    查證: skill parcel-briefing-deck 規則27（已載明函號）

  # ── 五、規則庫未收錄、但本類案件必觸及者 ─────────────────────
  - id: mrt_restrict
    名稱: 大眾捷運系統兩側禁建限建
    條號: 大眾捷運法及其禁建限建辦法（**規則庫未載條號，交付前補查**）
    類型: 套疊
    圖層: 大眾捷運系統兩側禁建限建地區
    級別: 參考
    備註: >-
      捷運系統兩側禁建限建地區內之建築及開挖行為應經主管機關（臺北市政府捷運工程局）
      核准。⚠ **面積要取聯集不可相加**：NGIS 對本圖層會逐面各回一列且彼此重疊
      （內湖案三面：環狀線、環北_二側限建範圍、NH-ALING限建線），相加高估四成。
      ⚠ **禁限建的成因不必然是現有營運路線**：內湖案文湖線雖通過基地南側，但禁限建
      範圍實來自**環狀線與環北段（規劃中路線）**，歸因寫錯會被審查抓。
    查證: NGIS 2-31 圖層屬性 Layer 欄

  - id: aviation_height
    名稱: 飛航安全高度管制
    條號: 民用航空法（禁止或限制建築地區、高度管制；**規則庫未載條號，交付前補查**）
    類型: 套疊
    圖層: 民用航空法之禁止或限制建築地區或高度管制範圍
    級別: 參考
    備註: >-
      範圍內之建築高度應符合飛航安全規定，須經交通部民用航空局審認。
      ⚠ **管制面別與限高值查本機圖資，不要只寫「涵蓋 100%」**：
      `環境敏感相關/第二級/2-27 …/機場禁限建圖資/<機場>禁限建.shp`（**Big5、無 .prj
      須 set_crs(3826)**）帶 `CODE`／`TYPE_`／`STARTHIGH` 等欄位，內湖案即由此查出
      基地 100% 落在松山機場「**轉接面（高距比 1:7、起算高程 3.98 公尺）**」。
      NGIS 只給範圍、無此屬性。
    查證: 本機圖資屬性（2026-09-13 讀取核對）

  - id: plan_area_span
    名稱: 基地是否橫跨兩個以上都市計畫
    條號: 都市計畫法（個案變更程序；**規則庫未載**）
    類型: note
    級別: 關鍵
    備註: >-
      ★**開案必查**（2026-09-13 內湖案首見）：基地橫跨兩個都市計畫時，可能須**同時
      辦理兩件個案變更**而非一件，直接改變整體路徑與時程。
      查法：臺北市都發局圖台的分區圖層**沒有計畫區名稱／範圍欄位**（`PLAN_AREA` 恆
      為 None、`PLAN_NO` 對到的是分區類別碼），須改查
      `UrbanPlan2/PlanTheme/MapServer/5 歷年計畫案索引範圍圖`（只有案號 PROJNUM 與
      年度 PERIOD、**無計畫名稱**，且歷年案件互相重疊）。
      ⚠ 該索引是**製圖尺度的索引圖、不是法定計畫區界**：內湖案兩案範圍於基地一帶
      互相重疊約 923 ㎡，**精度不足以逐筆判定歸屬**，只能呈現「基地橫跨兩個計畫案
      範圍」這個定性事實，逐筆歸屬與正式計畫名稱一律以都發局認定為準。
    查證: 2026-09-13 逐一實測該 ArcGIS 服務欄位

  - id: local_guideline
    名稱: 該都市計畫有無地方專屬變更指導原則
    條號: —
    類型: note
    級別: 關鍵
    備註: >-
      ★**開案先問使用者或洽都發局**（善化案定案之通則，於本類案件同樣適用）：
      個別都市計畫常另有配合通盤檢討／陳情訂定的地方專屬指導原則，門檻可能遠嚴於
      通用版。這類原則**查不到 pcode、不在全國法規資料庫**，衍古即使有同案型先例
      也不代表涵蓋地方專屬版本。查明前不可蓋牌硬套通用版就結案。
    查證: —
