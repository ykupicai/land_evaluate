# 非都市土地（農牧用地）變更編定為交通用地 檢核（變更編定路線，<2公頃）
# ★2026-08-10 潮州中山段20案首建。禁止事由（§5七款/§6特農/§7養殖生產區）在
#   _共通_農業用地變更.yaml，本清單只放「交通用地變更編定」的程序、隔離綠帶、目的事業、
#   在地法規等 note 型項目（無圖層可自動判定，須人工查證／函詢）。
# 直接對應先例＝臺南麻豆寮廍段1745「旗勝科技停車場」（農牧用地→交通用地、私法人、
#   0.414公頃、南市交停工字第1140097418號 2025-01-10 核准）——可整套沿用其辦案骨架。
# 條號一律取自法令檢核規則庫 v9（rule_id 附於各項），非憑印象。
用途: 非都市土地變更編定為交通用地
法源版本: 非都市土地使用管制規則D0060013§27/§28/§30/§30-1~3＋農業主管機關同意農業用地變更使用審查作業要點FL014304§2/§5/§6/§7/§8/§9~§11
法源查核日期: 2026-08-10

檢核項目:
  - id: enterprise_plan
    名稱: 興辦事業計畫（交通目的事業主管機關＝屏東縣政府交通旅遊處）
    條號: 管制規則§30（規則庫 LUR-030）；農變要點§5(規則庫 AGR-005，目的事業機關須表支持)；
      屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點(GL000685，109.05.26)
    類型: note
    級別: 參考
    備註: >-
      變更編定為交通用地須先擬具「興辦事業計畫」報請交通目的事業主管機關核准，並取得
      該機關同意變更編定文件（管制規則§28、§30）。★★屏東縣**有專屬審查要點 GL000685**，
      主管機關＝**屏東縣政府交通旅遊處**，其第二點明定非都市土地「交通用地」限二類：
      ①**汽車運輸業場站**＝「經監理機關同意立案之汽車運輸業」所設客運站/貨運站/停車場
      及其附屬設施（保養廠/辦公室等）——須有已立案汽車運輸業合作為前提；②**路外停車場**＝
      道路路面外供停放車輛之場所。目的事業別須落在此二類之一並向交通旅遊處提興辦事業計畫。
      農變要點§5列「目的事業主管機關未表支持」為不同意情形之一，故此核准為前提要件。
    查證: 屏東縣法規 GL000685 官方原文（ptlaw.pthg.gov.tw，2026-08-10 查核）；
      管制規則D0060013官方原文；旗勝科技停車場案（南市交停工字第1140097418號）

  - id: motor_transport_station
    名稱: 汽車運輸業場站（貨運站）設置規定
    條號: 汽車運輸業審核細則K0040004§4＋附件「汽車運輸業停車場設置規定」；停車場法§23
    類型: note
    級別: 參考
    備註: >-
      ★選擇「汽車運輸業場站（貨運站，供物流）」方向時適用（潮州中山段20案業主定調）。
      申請資格＝經監理機關同意立案之汽車運輸業（K0040004§4立案資格＋最低資本額）。附件
      《汽車運輸業停車場設置規定》之硬性條件：①**停車場出入口不得設於加油站十公尺內**
      （並列：交岔路口/圓環/平交道10m、消防隊/消防栓10m、學校/戲院門前兩側30m；但書＝經
      交通工程改善且縣市政府確認無妨礙交通安全者不在此限）；②**場內車道面積≥停車場總面積
      10%**（★此10%是場內通道，與農變要點§10隔離綠帶30%是兩回事，不可混）；③停車位尺寸
      **大型貨車長11m×寬3m以上**（大型客車12×3、小客貨5.25×2.5、曳引車6×3、拖車12×3）；
      ④應備停車位數＝營業車輛數1/8；⑤土地租/借約≥2年。非都市土地者仍應符合非都市土地
      使用管制規則（接回變更編定）；公路主管機關有疑義應函徵當地縣市政府審核同意。
    查證: 汽車運輸業審核細則 K0040004 及附件官方原文（law.moj.gov.tw，2026-08-10 逐條查核）

  - id: zone_change_table3
    名稱: 變更編定原則（附表三）
    條號: 管制規則§27（規則庫 LUR-027）
    類型: note
    級別: 參考
    備註: >-
      §27：非都市土地變更編定應在「原使用分區內」為之（本案一般農業區內農牧用地→交通
      用地，屬同分區內變更，符合）；變更編定原則見管制規則附表三。★71層核心法規筆記未
      展開附表三之「農牧用地→交通用地」欄，須回官方原文確認該變更在附表三是否須經核准、
      有無前提條件，查明前不逕自認定無條件可變。
    查證: 管制規則D0060013§27及附表三官方原文（待補逐條核對）

  - id: apply_docs
    名稱: 申請變更編定應附文件
    條號: 管制規則§28（規則庫 LUR-028）
    類型: note
    級別: 參考
    備註: >-
      §28：申請變更編定應檢附興辦事業計畫核准文件、變更編定同意書、土地權利證明文件、
      地籍圖謄本等。雙文件骨架（沿用旗勝案）：①興辦事業計畫（含交通需求量化、出入口
      視線依建築技術規則§136、交通維持與排水計畫）②農業用地變更使用說明書（送農業
      主管機關）。
    查證: 管制規則D0060013§28；旗勝案辦案骨架

  - id: env_route
    名稱: 環境敏感地區（變更編定路線）
    條號: 管制規則§30-1／§30-2／§30-3（規則庫 LUR-030-1~3）
    類型: note
    級別: 參考
    備註: >-
      變更編定之環敏認定走§30-1（第一級不得變更）／§30-2／§30-3，與開發許可的開發審議
      規範§9系列**不可互換**。本案 NGIS 初篩命中「水庫集水區」100%，相交圖徵之 NAME＝
      **鳳山水庫附屬設施（原東港溪攔河堰＝東港堰）**（本機 Reservoir_v10.0 shp）。
      ★★**一級/二級分類未定、且圖徵 STATE＝審查中**：本機第一級(1-21供家用)與第二級
      (2-19非供家用)為同一份 shp（dbf MD5 相同）靠 TYPE 欄分流，該筆 **TYPE＝「供家用或
      公共給水」→ 依本機屬性應歸第一級**；但 NGIS 初篩回二級。兩者矛盾。**若經認定為
      第一級（供家用），依管制規則§30-1 屬「不得變更」，本案將由 △ 反轉為 ╳**——
      故一級/二級**務必先向 eland／水庫主管機關取得正式認定**，再定可行性。
      ⚠ 圖資 UNIT（管理機關）欄為空，**管理機關未由圖資取得**；鳳山水庫/東港堰一般由
      經濟部水利署南區水資源局管理，須向該局查證，勿逕寫。變更前另須取得水庫管理機關
      之原則同意。**「供工業用水」係先前錯誤推論，已刪**（TYPE 欄實為供家用或公共給水）。
    查證: 環敏NGIS.csv；本機 Reservoir_v10.0 shp 屬性（NAME/TYPE/STATE，2026-08-10 讀取）；
      管制規則§30-1~3官方原文；一級/二級認定與管理機關均待 eland／水利署正式查復

  - id: greenbelt_30
    名稱: 隔離綠帶（面積比30%，其他用途）
    條號: 農變要點§9~§11（規則庫 AGR-010）
    類型: note
    級別: 參考
    備註: >-
      ★2026-09-09 起 `_共通_農業用地變更.yaml` 已有 `agr_greenbelt` 通則項（同源
      AGR-010），**本項是「交通用地」的用途別補充、不是重複**：通則講門檻與留設側
      的一般規則，本項補交通用地特有的兩點（交通用地本身不算農業用地→臨路側免留設、
      旗勝案實作值）。兩項會同時出現在檢核輸出，屬正常。
      非光電之其他用途（含交通用地）：隔離綠帶面積比≥申請面積30%，最小寬度1.5公尺
      （AGR-010；旗勝案實作 32.34%）。★僅對相鄰「農業用地」六類（農牧／養殖／水利／
      林業／生態保護／國土保安）留設，交通用地本身不算農業用地、臨路側免留設；30%對
      申請面積全部計算。實算走 greenbelt_ratio.py --only-on 農業用地 --ratio 0.30
      --min-width 1.5。
    查證: 農變要點FL014304§9~§11；旗勝案 32.34%

  - id: pingtung_local
    名稱: 屏東縣專屬審查要點（GL000685）＋§8在地限制
    條號: 屏東縣非都市土地申請變更編定為交通用地興辦事業計畫審查作業要點(GL000685，
      99.04.12發布/109.05.26修正)；農變要點§8（規則庫 AGR-008）
    類型: note
    級別: 參考
    備註: >-
      ★★**更正（2026-08-10）**：屏東縣**確有**專屬審查要點 GL000685（前一版清單誤寫
      「查無、須洽農業處」——錯，且對應機關是交通旅遊處不是農業處）。GL000685 第二點把
      非都市土地「交通用地」明確界定為**汽車運輸業場站及設施 暨 路外停車場**兩類，第三～
      六點規範申請書件、審查程序、會勘、核准期限。**該要點無面積/臨路/綠帶數值門檻**
      （數值走農變要點§9~11 隔離綠帶）。承辦＝屏東縣政府交通旅遊處。另農變要點§8保留縣市
      「另定限制條件」空間，除本要點外是否另有農業端在地限制，仍可洽屏東縣政府農業處確認。
    查證: 屏東縣法規 GL000685 官方原文（ptlaw.pthg.gov.tw，2026-08-10 逐條查核）

  - id: feedback
    名稱: 回饋（如涉）
    條號: 依核准之興辦事業計畫及目的事業法規
    類型: note
    級別: 參考
    備註: >-
      交通用地變更編定之回饋認定依目的事業計畫核定內容；旗勝案回饋金計算基準時點＝
      興辦事業計畫核准函發文日之公告土地現值。本案是否涉回饋依目的事業別與縣府規定，
      併時程規劃考量。
    查證: 旗勝案回饋基準；屏東縣府相關規定（待確認）
