  # 自治條例§18①3 原為單一 inquiry（無點位圖資→函詢五個機關）。2026-07-30 拆成三段：
  # 十戶以上聚落走門牌開放資料實算、醫療／文教走測繪中心環域 API，只剩社福與營區須函詢。
  - id: settlement_200m
    名稱: 十戶以上村莊或聚落200公尺
    條號: 自治條例§18①3
    類型: settlement
    級別: ╳
    距離_m: 200
    最少戶數: 10
    群聚門檻_m: [30, 50, 100]
    備註: >-
      判定法＝門牌點聚類→群內門牌數達 10 才算「村莊或聚落」→量基地到該聚落最短距離。
      ★不是數 200 公尺內幾個門牌（安南案實測兩種錯法會得出相反結論）。
      門牌坐標為戶政人工點位、官方聲明僅供參考，且門牌數≠戶數 → 屬篩選初判，
      臨界值（8~12）與法定認定仍須戶政事務所／區公所確認。

  - id: facility_api_200m
    名稱: 醫院／學校／文教設施200公尺
    條號: 自治條例§18①3
    類型: api_distance
    級別: ╳
    距離_m: 200
    端點: [med, edu]
    備註: >-
      國土測繪中心環域查詢 API（免認證）。距離為設施點到基地面實距，非 API 的圓心距離。
      API 查無≠現地沒有；私立幼兒園／補習班等收錄可能不全，必要時併同函詢教育局。

  - id: facility_dis_ref
    名稱: 周邊鄰避設施（參考）
    條號: 參考資訊
    類型: api_distance
    級別: 參考
    距離_m: 2000
    端點: [dis]
    備註: >-
      非本條款項目。公墓／焚化廠／掩埋場等既有鄰避設施的分布，是土資場區位合理性的
      正面論述材料（周邊已為鄰避設施聚集區），列為參考不計入障礙。

  - id: facility_200m
    名稱: 社福機構／營區200公尺
    條號: 自治條例§18①3
    類型: inquiry
    機關: 社會局／國防部
    備註: >-
      社會福利事業機構與營區無公開點位圖資（測繪中心環域 API 未涵蓋社福、營區屬機密），
      仍須函詢。可先以 scripts/osm_sensitive_poi.py --dist 200 初篩
      （先跑 --dist 1500 驗覆蓋率，OSM 查無≠沒有），法定認定仍須函詢。

  # ★★ 2026-07-30 結案回饋檢查（第2問）補：本清單原僅涵蓋 §18①1、§18①3、§19，
  # 漏了 §17Ⅱ、§21、§22——安南案的簡報反而比清單完整（有寫 §17Ⅱ 營運方式），
  # 但清單是可重用資產，漏了下一個土資場案就會漏。以下逐條補齊。
  - id: art17_no_excavate
    名稱: 都市計畫農業區／保護區不得開挖填埋
    條號: 自治條例§17Ⅱ
    類型: inquiry
    機關: 臺南市政府工務局
    備註: >-
      設置於都市計畫農業區或保護區者，**不得進行開挖填埋作業；但進行整地者，不在此限**。
      現況為水面／低窪地而須先填實者，該填土與「不得開挖填埋」之界線須向工務局釋疑
      （安南案 S001 現況 95.8% 為魚塭水面，即卡在此處）。
      §17Ⅱ但書走整地者，另須提整地之開挖填埋作業計畫書（§17Ⅲ）。

  - id: art22_facilities
    名稱: 應有設施六項（含3公尺以上綠帶隔離設施）
    條號: 自治條例§22Ⅰ
    類型: inquiry
    機關: 臺南市政府工務局
    備註: >-
      六項：①入口標示牌 ②**場址周圍1.8公尺以上圍牆＋寬度3公尺以上綠帶隔離設施**
      （以原有林木保留或種植樹木、植栽圍籬；圍牆可設於隔離設施上）
      ③防止塵土飛散、導水及排水設施 ④出入口清洗設施及沉澱池 ⑤遠端監控系統
      ⑥兼營營建混合物者設地磅。
      ★★**位於農業用地者，隔離綠帶或設施應依農業主管機關規定辦理**
      → 此時要疊加農地變更要點§9（最小寬度1.5m）與§10（特農區變更作其他使用者
      面積不少於申請面積30%），取兩者較嚴者；且**僅須與相鄰農業用地留設**
      （農業用地認定依要點§2②，不含交通用地）。
      可用 scripts/greenbelt_ratio.py 實算：
      `--min-width 3 --ratio 0.30 --only-on 農業用地`。

  - id: art22_intensity
    名稱: 辦公或相關作業場所建蔽率10%／容積率30%
    條號: 自治條例§22Ⅱ、§22Ⅲ
    類型: inquiry
    機關: 臺南市政府工務局／建管單位
    備註: >-
      ★ **建蔽率 ≤10%、容積率 ≤30%**（與特定工廠變更編定的 70%/180% 差很多，勿混用）。
      須取得營運許可後才能申請建築執照；建照**應加註**「本建築執照在土資場營運許可
      失效時一併失效」，申請人應自行拆除且不得要求補償（§22Ⅲ）。
      現況建蔽率可用 scripts/building_coverage.py --max-coverage 0.10 檢核。

  - id: art21_documents
    名稱: 申請應檢附文件12款
    條號: 自治條例§21
    類型: inquiry
    機關: 臺南市政府工務局
    備註: >-
      12 款文件；★第7~9款得於核准前補正。§21①8 另有特別規定。
      清單本身不影響區位可行性，但**時程規劃要納入**（補正期限會決定送件時點）。
