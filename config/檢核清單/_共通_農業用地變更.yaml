# 共通檢核：農業用地變更（劃定或變更）為非農業使用之案件一律先跑
# 法源：農業主管機關同意農業用地變更使用審查作業要點（FL014304，111.03.17）
# 對應法令檢核規則庫 AGR-006（§6 特農區）、AGR-007（§7 養殖漁業生產區）
#
# ★沉澱機制：新案發現本清單漏了哪一條 ╳ 級事由，加在這裡＝所有後案受惠。
用途: 農業用地變更共通（任何用途，含容許使用）
法源版本: 農業用地變更審查要點 111.03.17 農企字第1110012296號令

檢核項目:
  - id: breed_zone
    名稱: 養殖漁業生產區
    條號: 農業用地變更審查要點§7
    類型: overlay
    級別: ╳
    圖層: '\\192.168.1.134\Public-TN\3. 圖資\gis圖資\產業相關\一級產業\養殖漁業生產區\養殖漁業生產區_114_SHP\養殖漁業生產區.shp'
    編碼: big5
    陳舊警告_年: 2
    備註: >-
      經政府核定之養殖漁業生產區農業用地不同意變更使用；六款例外中第(四)款
      「政府機關興辦」取決於興辦主體身分（非基地條件），開案即須確認申請人。
      ⚠️同資料夾 BREED47.shp 為 2016 舊版僅 47 區，禁用（2026-07-29 安南案實錯，
      舊檔把「100%涉及」誤判為「未涉及」）。

  - id: sfa_zone
    名稱: 特定農業區農業用地
    條號: 農業用地變更審查要點§6
    類型: attribute
    級別: ╳
    欄位: [使用分區, 使分]   # tcdgis 匯出叫「使用分區」、match_parcels 產物叫「使分」
    含值: 特定農業
    備註: >-
      非都市土地特定農業區之農業用地不同意變更使用（七款例外）。
      都市土地「使分」為空屬正常（不觸及本項）。
      ★★2026-07-30 修正（安定六塊寮段案實錯）：**本項的 ╳ 是「一般情形」的預設，
      不是絕對**。第六點但書第（二）款「經行政院核定之計畫」是常被忽略的活門——
      凡該用途已有**行政院核定的輔導計畫／專案計畫**，主管機關即得據該款受理申請，
      本項應改判 △。已知案例：特定工廠（特登工廠）有行政院 110.09.14 院臺經字第
      1100181578 號核定「特定工廠申請利用非都市土地特定農業區用地變更輔導計畫」
      （實施至民國 129.03.19），見 特定工廠變更編定.yaml 的 sfa_guidance_plan 項。
      **開案時要順手問一句「這個用途有沒有行政院核定的計畫？」**——只查要點原文
      會漏掉這層，把可行案判成不可行。
