# 共通檢核：農業用地變更（劃定或變更）為非農業使用之案件一律先跑
# 法源：農業主管機關同意農業用地變更使用審查作業要點（FL014304，111.03.17）
# 對應法令檢核規則庫 AGR-006（§6 特農區）、AGR-007（§7 養殖漁業生產區）
#
# ⚠ 適用範圍（2026-08-06 新化王公廟小段1085-1加工廠案確立）：本清單法源§2(4)僅管
# 「非農業使用性質」之容許使用。若容許使用申請項目本身是申請農業用地作農業設施
# 容許使用審查辦法（M0020022）§3列名七類農業設施之一（農作產銷／林業／自然保育／
# 水產養殖／畜牧／休閒農業／綠能），性質仍屬農業使用，**不落入本清單適用範圍**，
# 不要套用本清單（含 sfa_zone/breed_zone 等 ╳/△ 判定，法源不適用會誤判）——
# 這類案子改建用途專屬 YAML（如 初級農產加工廠_臺南市.yaml），法源改引 M0020022。
#
# ★沉澱機制：新案發現本清單漏了哪一條 ╳ 級事由，加在這裡＝所有後案受惠。
用途: 農業用地變更共通（任何用途，含容許使用）
法源版本: 農業用地變更審查要點 111.03.17 農企字第1110012296號令
法源查核日期: 2026-07-30

檢核項目:
  - id: breed_zone
    名稱: 養殖漁業生產區
    條號: 農業用地變更審查要點§7
    類型: overlay
    級別: ╳
    圖層: '@breed_shp' # config/paths.yaml 的 114 年版養殖漁業生產區
    編碼: big5
    陳舊警告_年: 2
    備註: >-
      經政府核定之養殖漁業生產區農業用地不同意變更使用；六款例外中第(四)款
      「政府機關興辦」取決於興辦主體身分（非基地條件），開案即須確認申請人。
      ⚠️同資料夾 BREED47.shp 為 2016 舊版僅 47 區，禁用（2026-07-29 安南案實錯，
      舊檔把「100%涉及」誤判為「未涉及」）。

  - id: sfa_zone
    名稱: 特定農業區農業用地
    條號: 農業用地變更審查要點§6
    類型: attribute
    級別: ╳
    欄位: [使用分區, 使分]   # tcdgis 匯出叫「使用分區」、match_parcels 產物叫「使分」
    含值: 特定農業
    翻轉條件: >-
      該用途是否已有行政院核定之輔導計畫／專案計畫（§6 但書第（二）款）？
      有則本項應由 ╳ 改判 △，非直接不可行。已知案例：特定工廠見
      特定工廠變更編定.yaml 的 sfa_guidance_plan 項。
    備註: >-
      非都市土地特定農業區之農業用地不同意變更使用（七款例外）。
      都市土地「使分」為空屬正常（不觸及本項）。
      ★★2026-07-30 修正（安定六塊寮段案實錯）：**本項的 ╳ 是「一般情形」的預設，
      不是絕對**。第六點但書第（二）款「經行政院核定之計畫」是常被忽略的活門——
      凡該用途已有**行政院核定的輔導計畫／專案計畫**，主管機關即得據該款受理申請，
      本項應改判 △。已知案例：特定工廠（特登工廠）有行政院 110.09.14 院臺經字第
      1100181578 號核定「特定工廠申請利用非都市土地特定農業區用地變更輔導計畫」
      （實施至民國 129.03.19），見 特定工廠變更編定.yaml 的 sfa_guidance_plan 項。
      **開案時要順手問一句「這個用途有沒有行政院核定的計畫？」**——只查要點原文
      會漏掉這層，把可行案判成不可行。

  # ══ 2026-09-04 麻豆客子寮段社福案結案時補（三項，逐條掃法令檢核規則庫 AGR-* 全表後）══
  # 缺口成因：本清單原本只放了兩個 ╳ 級「不同意事由」（§6 特農、§7 生產區），
  # 卻沒放「這條路本身要做什麼」與「§5 的七款」。實務上每份簡報的總表都要寫這幾項，
  # 之前全靠人記得——與 2026-08-07 醫療專用區案漏掉「農業主管機關同意」是同一種洞。
  # 條號一律取自法令檢核規則庫 20_規則庫 分頁（AGR-002/003/004/005/010），不憑印象寫。

  - id: agr_consent
    名稱: 農業主管機關同意（含農業用地變更使用說明書）
    條號: 農地變更審查要點§2、§3、§4
    類型: inquiry
    級別: △
    機關: 各直轄市／縣（市）政府農業局（處）
    備註: >-
      **法定必要程序，不是加分項**（農業發展條例§10 授權）。規則庫 AGR-002 列四種
      應徵得同意之情形，凡農業用地變更作非農業使用幾乎必中其一：
      (一)特定農業區、一般農業區變更為其他分區；
      **(二)農牧／養殖／水利／林業／生態保護／國土保安用地變更為其他類別**（變更編定案最常見）；
      (三)都市計畫農業區、保護區農業用地劃定或變更為非農業使用（另見 AGR-008／§8）；
      (四)作非農業使用性質之容許使用或臨時使用。
      申請時應擬具**農業用地變更使用說明書**（§3，載明使用現況、分區編定面積、
      灌排水系統、隔離綠帶、農業環境影響、聯外道路、因應設施，以及
      ★**土地使用區位面積之必要性、合理性及無可替代性**共九項），送農業局審查同意，
      與目的事業主管機關之興辦事業計畫核准**並行辦理**。
      ⚠ §4：目的事業主管機關須就「事業設置必要性」與「區位、面積之必要性、合理性、
      無可替代性」提出評估意見——未提或未表支持，即落入§5(六)不同意事由。

  - id: agr_reject_7
    名稱: 不同意變更之七款事由（§5）
    條號: 農地變更審查要點§5
    類型: note
    級別: △
    備註: >-
      **每案都要逐款交代，這七款是農業局實際駁回的依據**（規則庫 AGR-005）：
      (一)未依規定規劃設置隔離綠帶或設施（→見 agr_greenbelt 項）；
      (二)使用具農業灌溉功能之系統作廢污水排放，或妨礙上下游農業灌排水系統輸水能力；
      (三)申請範圍內夾雜未申請變更之農業用地且妨礙農業經營；
      (四)妨礙原有區域性農路通行；
      (五)辦理部分土地分割致坵塊零碎不利農業經營（線狀公共建設除外）；
      (六)目的事業主管機關未提評估意見或未表支持意見（連動§4）；
      (七)其他依本要點規定不得同意變更使用之情形。
      ⚠ (二)(四) 與產線既有成果直接對得上：灌排走 2021全台農田水利灌排圖資與搭排
      查詢、農路走周邊使用地分析（緊鄰交通用地）；(三) 看申請範圍是否把他人農地
      圍在裡面或切成畸零；(五) 看分割方案。

  - id: agr_greenbelt
    名稱: 隔離綠帶或設施（毗鄰農業用地側）
    條號: 農地變更審查要點§9、§10、§11
    類型: note
    級別: △
    備註: >-
      規則庫 AGR-010。**留設義務只對「毗鄰農業用地」之側**（農業用地依§2②六類認定：
      農牧／養殖／水利／林業／生態保護／國土保安，**不含交通用地**）。
      §9 最小寬度至少 **1.5 公尺**（地方得訂更嚴）。
      §10 依【變更前分區】×【變更後用途】定門檻——
      特農區→工業區/科學園區≥30m、住宅社區性質/工商綜合區/廢棄物處理≥20m、
      **其他使用→面積≥30%**；一般農業區→工業區/科學園區≥20m、住宅社區/工商綜合區/
      砂石碎解洗選/礦石開採≥10m、**其他使用→面積≥30%**；
      (三)農村社區土地重劃→面積≥30%；(四)森林區/山坡地保育區/特定專用區→依各目的事業
      審查規範，未有規定者比照一般農業區；
      ★(五)**經行政院核定之輔導方案另有留設規定者從其規定**（太陽光電即走此款，
      依 AGR-FN01 農企字第1080013640號僅需作業規範§40 的 10 公尺緩衝綠帶、
      不受 30% 限制——**此豁免不可比照其他用途**）。
      §11 隔離設施＝通路／水路／空地／廣場／平面停車場／開放球場／蓄水池／滯洪池等
      非建築開放性設施；各目的事業計畫留設之綠地或保育地具隔離效果者得併入面積計算。
      **實算工具**：`scripts/greenbelt_ratio.py --only-on 農業用地`（面積比＋最小寬度
      雙門檻）；≥2 公頃走開發許可者改走緩衝綠帶，見 `_共通_開發許可.yaml` 與
      `.claude/rules/隔離綠帶與緩衝綠帶判準.md`。
