# 共通檢核：達開發許可規模（原則2公頃以上，各用途審查要點另有面積門檻，以該用途
# 本身的 YAML 為準）之案件，不論用途一律加跑本清單。
#
# ★ 建立緣由（2026-08-06 使用者定案）：隔離綠帶/緩衝綠帶/保育區/隔離設施判準確立後
#   回頭盤點發現，光電_山坡地_臺南市.yaml 已有 §16/§17/§26/§40 四項，但其他同樣會
#   走開發許可的用途別（如社福設施_臺南市）沒有對應項目——因為這四項法源
#   （非都市土地開發審議作業規範總編）本來就跟用途無關，只跟「是否走開發許可」有關，
#   應該抽成共通清單，不該每個用途別各自重寫一次（也才不會漏）。
#   後壁南海段社福案（5.4319公頃、開發許可）即實際踩到：法源清單裡有寫§16/§17，
#   但案件執行過程只做了§40緩衝綠帶，§17保育區從未實際計算或函詢，是本清單要補的洞。
#
# ⚠ 何時要跑本清單：案件依該用途本身審查要點的面積門檻認定須走「開發許可」時
#   （不同用途門檻可能不同，例如社福設施審查要點§5①是2公頃；請先查該用途的YAML
#   或母法確認門檻，不要直接套用2公頃）。確定案件未達開發許可規模、單純變更編定者，
#   不必跑本清單（該情境走「隔離綠帶」，見 _共通_農業用地變更.yaml 或用途別清單）。
#
# 詳細判準見 .claude/rules/隔離綠帶與緩衝綠帶判準.md。
用途: 開發許可共通（任何用途，達開發許可規模時加跑）
法源版本: 非都市土地開發審議作業規範 111.05.20（總編）；太陽光電第十四編 106.03.09 僅光電適用
法源查核日期: 2026-08-06

檢核項目:
  - id: no_dev_zone
    名稱: 不可開發區（坡度）
    條號: 開發審議規範總編§16
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      坵塊圖平均坡度 ≥40%：其 80% 土地應維持原始地形地貌，列為不可開發區；
      30%～40%：僅得作開放性公共設施或必要性服務設施，不得作為建築基地。
      平地案（無坡度資料異常）通常不觸發，仍建議留一句「基地地勢平坦、非山坡地，
      不涉本條」交代過，不要整條略過不提。需 DEM／實測地形圖才能實算，
      山坡地案見 scripts/slope_check.py。

  - id: conservation_zone
    名稱: 保育區
    條號: 開發審議規範總編§17
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    翻轉條件: >-
      本案用途是否有專屬豁免章節（目前唯一已知案例：太陽光電第十四編§2 明文豁免
      本條）？有查到專屬豁免才不受 30% 比例限制；沒查到專屬豁免章節，一律假定
      本條 30% 仍適用，**不可比照光電案的待遇**。
    備註: >-
      ★★保育區面積不得小於扣除不可開發區後剩餘基地面積 30%。**§40緩衝綠帶可納入
      §17保育區的30%計算，不是外加**（使用者2026-08-06定案）——緩衝綠帶是保育區的
      最小基礎配置，量緩衝綠帶占比：已達30%即滿足；未達30%則有缺口，缺口＝
      30%×(基地面積−不可開發區面積)−緩衝綠帶面積，補法（加寬緩衝綠帶或另劃保育區）
      待個案確認。詳見 .claude/rules/隔離綠帶與緩衝綠帶判準.md。
      ⚠ 平地／無坡度林相之案件（如一般農業區社福、儲能案）如何具體補足缺口，
      本產線尚無實算前例——**開案務必先函詢區委會或參考同類已核定案的作法**，
      不可逕自略過不處理。

  - id: access_road
    名稱: 聯絡道路
    條號: 開發審議規範總編§26
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      應有 2 條獨立聯絡道路，其一路寬 ≥8 公尺（不足者光電案曾援引「太陽光電設施
      開發案基地聯絡道路審議原則」區委會第461次會議111.10.13附件1之操作化但書，
      其他用途是否可比照援引須個案確認，不可逕自類推）。
      路寬認定取 road_access.py 的「鄰接路寬中位數_m」（見 CLAUDE.md 通則④）。

  - id: buffer_greenbelt
    名稱: 緩衝綠帶
    條號: 開發審議規範總編§40
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      達開發許可規模者一律依開發審議作業規範留設緩衝綠帶，預設 ≥10 公尺。
      作法：skill buffer-greenbelt 或 scripts/make_greenbelt.py（等寬內縮），
      **不是** greenbelt_ratio.py（那是變更編定的隔離綠帶，面積比＋最小寬度雙門檻，
      僅適用未達開發許可規模的案件）。評估階段一律全部畫緩衝綠帶，不做隔離設施細分。
