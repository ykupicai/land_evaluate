# 地面型太陽光電設施（山坡地、走開發許可／變更使用分區）— 禁止事由與設置條件檢核清單
#
# 建立緣由（2026-08-02 龍崎番社段案）：現有 5 份清單皆不適用——本案基地為
#   **工業區／特定目的事業用地**（非農業用地），故農業用地變更審查作業要點不適用；
#   非土資場、非特定工廠。依衍古前例（2019-004 番社段121，同段同分區同用途）
#   本類案件之執行方式為**變更使用分區（走開發許可）**，適用管制規則§11。
#
# 法源與版本（條號一律以衍古 71 層重點筆記為準，該層已逐條核對官方原文）：
#   ・非都市土地使用管制規則（FL003635）§11／§13／§30Ⅳ／§52-1
#   ・非都市土地開發審議作業規範（111.05.20 內政部 glrs 全文）
#       總編§16 不可開發區、§18 應劃保育區之情形、§26 聯絡道路、§40 緩衝綠帶
#       **第十四編 太陽光電設施（106.3.9 台內營字第1060802034號令增訂，8點）優先適用**
#       ★第十四編§2 豁免總編 14、17、28、35、39、42、43 → **保育區(§17)已豁免**，
#         但**§18 情形者仍應劃保育區**；緩衝綠帶無專編規定 → **回總編§40（≥10公尺）**
#   ・環境影響評估法（O0090001，114.11.28）§5Ⅲ⑨、§5Ⅲ⑤
#       ⚠ 太陽光電環評門檻**已由認定標準§29 移入母法§5Ⅲ**；110~112 年案件援引之
#         §29 舊門檻已不適用（前例 2019 判「尚不需環評」即為舊法結論，不可照抄）
#   ・水土保持法（M0110001）§12
#
用途: 地面型太陽光電設施（山坡地／開發許可）
法源版本: 開發審議規範 111.05.20＋第十四編 106.03.09；環評法 114.11.28

檢核項目:
  # ── 面積與規模門檻 ───────────────────────────────
  - id: slope_min_area
    名稱: 山坡地興辦事業計畫面積下限
    條號: 管制規則§52-1
    類型: area
    級別: ╳
    非山坡地_公頃: 0
    山坡地_公頃: 10
    山坡地圖層: '環境敏感相關\第二級\2-06 山坡地 (1060531update)\BOUNDARY.shp'
    備註: >-
      山坡地興辦事業計畫面積**不得少於10公頃**（§52-1 本文），十款例外另計。
      ★注意此門檻對大面積案「有利」：達標即符合，未達 10 公頃才需援引例外
      （光電案爭點在第三款「公用事業經審議規範核准」，另見光電興辦事業計畫審查
      作業要點 FL060265 第七點之明文授權）。

  - id: eia_area
    名稱: 環境影響評估面積門檻
    條號: 環評法§5Ⅲ⑨
    類型: area
    級別: △
    非山坡地_公頃: 40
    山坡地_公頃: 40
    山坡地圖層: '環境敏感相關\第二級\2-06 山坡地 (1060531update)\BOUNDARY.shp'
    反向: true
    備註: >-
      **面積 40 公頃或裝置容量 4 萬瓩以上應實施環評**，且「累積」計算、切小案無法規避。
      使用者定案（2026-07-26）：設置面積一律**以基地面積視為設置面積**、從嚴認定。
      ⚠ 逾門檻＝**環評必辦**（非疑慮）；時程須與開發許可審議併計。
      另 §5Ⅲ⑤「位於特定農業區之農業用地」無面積門檻——非農業用地案不觸發。

  # ── 第一級環境敏感地 ─────────────────────────────
  - id: national_forest
    名稱: 國有林事業區
    條號: 國有林林產物處分規則§14／管制規則§30-1
    類型: overlay
    級別: ╳
    圖層: '環境敏感相關\第一級\1-23-1 森林(國有林、保護林)(1050930update)\國有林事業區(1050630update)\AMA0101000011051.shp'
    陳舊警告_年: 8
    備註: >-
      前例（2019-004 番社段121）指出**基地南側恐涉國有林事業區**：依國有林林產物
      處分規則§14，專案核准採取林產物者**尚無適用太陽能發電設施** → 該範圍恐難設置。
      涉及時應退縮或剔除該部分，並回林業及自然保育署確認。

  - id: protection_forest
    名稱: 保安林
    條號: 保安林經營準則§8／管制規則§30-1
    類型: overlay
    級別: ╳
    圖層: '環境敏感相關\第一級\1-23-1 森林(國有林、保護林)(1050930update)\保安林(1050930update)\全台保安林分布概略圖1051_ALL.shp'
    陳舊警告_年: 8
    備註: >-
      保安林之開發應**先解除保安林**，且依保安林經營準則§8 得核准伐採之情形
      **尚無適用太陽能發電設施**（前例同一結論）。⚠ 圖資名為「分布概略圖」，
      屬概略範圍，觸及時務必函詢主管機關確認實際界線。

  - id: nature_reserve
    名稱: 自然保留區
    條號: 文化資產保存法§81、§84／開發審議規範總編（第一級環境敏感地）
    類型: overlay
    級別: △
    圖層: '環境敏感相關\第一級\1-07 自然保留區 (1152_115年第2版)\自然保留區1152.shp'
    陳舊警告_年: 3
    備註: >-
      **⚠ 圖資版本是這一項的成敗關鍵**：本機原有 106 年版僅 23 筆（NR01~NR21），
      **不含 110.07.30 公告的 NR23 龍崎牛埔惡地自然保留區**（149.02 公頃、臺南市政府
      管理），2026-08-04 龍崎案用舊版算出「最近 13,089 公尺、未涉及」，與 TCDGIS
      平台回報「套疊 8.88 ㎡」方向相反；換上 TGOS 115年第2版後本機重算 8.88 ㎡，
      與平台一字不差。**這是「有／沒有」的差異，不是邊界誤差**（與 BREED47 同型）。
      判定（使用者 2026-08-04 定案）：重疊屬圖資鋸齒等級者，建議以範圍退縮／剔除
      解除並驗算剔除後面積仍過門檻，但**「緊鄰第一級環境敏感地」解不掉** → 判 **△
      需經審議認定**，並寫出翻轉條件及是否在申請人控制範圍內。
      ⚠ 本項亦須查「緊鄰距離與共同邊界長度」，不可只看重疊面積：龍崎案重疊僅
      8.88 ㎡，但最短距離 0 公尺、共同邊界 51.7 公尺，實質是緊鄰 149 公頃保留區。

  # ── 第二級環境敏感地 ─────────────────────────────
  - id: slope_land
    名稱: 山坡地（水土保持）
    條號: 水土保持法§12
    類型: overlay
    級別: △
    圖層: '環境敏感相關\第二級\2-06 山坡地 (1060531update)\BOUNDARY.shp'
    陳舊警告_年: 8
    備註: >-
      位於山坡地者應擬具**水土保持計畫**並取得**水土保持完工證明書**；
      §12Ⅱ 水保計畫未核定前目的事業主管機關不得逕行核發許可（★時序硬約束）。
      另水利法§83-10：經直轄市／縣（市）主管機關認定全部納入水保計畫者，
      **得免依§83-7、§83-8 辦理出流管制規劃**。

  - id: landslide
    名稱: 山崩與地滑（地質敏感區）
    條號: 地質法／地質敏感區基地地質調查及地質安全評估作業準則
    類型: overlay
    級別: △
    圖層: '環境敏感相關\第二級\2-01 地質敏感區(活動斷層、山崩與地滑、土石流)(1051221update)\地質敏感區山崩與地滑.shp'
    陳舊警告_年: 8
    備註: >-
      涉及者須辦區域調查、細部調查與加強地質鑽探（增加鑽探經費）。
      ★**與第十四編§8 的簡化規定衝突要注意**：第十四編§8 允許地形測量與地質剖面
      簡化（五千分之一像片基本圖或臺灣通用電子地圖、**免鑽探**），
      但**地質敏感區除外** → 本類案件若涉山崩與地滑，**不得援用免鑽探**。

  - id: fault
    名稱: 活動斷層（地質敏感地區）
    條號: 山坡地開發建築管理辦法§5
    類型: overlay
    級別: ╳
    圖層: '環境敏感相關\第二級\2-01 地質敏感區(活動斷層、山崩與地滑、土石流)(1051221update)\地質敏感地區活動斷層.shp'
    陳舊警告_年: 12
    備註: 山坡地有地質結構不良、地層破碎、活動斷層或順向坡有滑動之虞者，不得建築開發。

  # ── 規劃配置條件（開發審議規範）───────────────────
  - id: buffer_greenbelt
    名稱: 緩衝綠帶
    條號: 開發審議規範總編§40
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      ★**2 公頃以上之開發許可案一律依開發審議作業規範留設緩衝綠帶**
      （使用者 2026-08-02 定案）。第十四編（太陽光電）**無緩衝綠帶專編規定
      → 回總編§40，預設 ≥10 公尺**。
      作法：`buffer-greenbelt` skill 或 `scripts/buffer_greenbelt`（等寬內縮），
      **不是** `greenbelt_ratio`（那是農業用地變更的隔離綠帶，面積比＋最小寬度雙門檻）。
      ⚠ 兩套制度不可混用：農地變更＝隔離綠帶（要點§9~§11）；
      開發許可＝緩衝綠帶（審議規範總編§40，工業區另有第八編§7 之 20／30／60 公尺）。

  - id: no_dev_zone
    名稱: 不可開發區（坡度）
    條號: 開發審議規範總編§16
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      **坵塊圖平均坡度 ≥40%：其 80% 土地應維持原始地形地貌，列為不可開發區**；
      **30%～40%：僅得作開放性公共設施或必要性服務設施，不得作為建築基地**。
      ⚠ 第十四編§2 的豁免清單**不含§16** → 不可開發區規定完整適用。
      需 DEM／實測地形圖才能計算。**本產線已可實算**：`scripts/slope_check.py`
      以 20 公尺 DTM（NAS `3. 圖資\gis圖資\dem地形資料\20公尺\全國DTM-20`）跑
      gdal.DEMProcessing（percent／Horn）分三段統計，逐案結果寫入該案 STATE.md。
      ⚠ 面積不可用「像元數 × 像元面積」交付（ALL_TOUCHED 邊界溢出約 17%），
      一律以「占比 × 權威面積」回推。★NLSC 坡度圖 WMTS（MOI_SLOPEP_GT30_2）僅可
      用於 GT30 二值交叉驗證，**LV7 色階反推分級未通過驗證、不得用來出數字**。
      前例（2019 番社段121）以 10 公尺間距等高線推估**坡度 30% 以上占 80% 以上**。

  - id: conservation_zone
    名稱: 保育區
    條號: 開發審議規範總編§17（已豁免）、§18（仍適用）
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      ★**第十四編§2 已豁免總編§17**（保育區面積不得小於扣除不可開發區後剩餘基地
      面積 30%），故光電案不受該比例限制；**但§18「應優先列為保育區之情形」未豁免**，
      基地有§18 情形（含特殊地質地形資源）者**仍應劃為保育區**。
      實務文件常把 17、18 混填同一格，須分清。

  - id: access_road
    名稱: 聯絡道路
    條號: 開發審議規範總編§26
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      第十四編無聯絡道路專編規定 → 適用總編§26：**2 條獨立聯絡道路、其一 ≥8 公尺**。
      不足者可援引「太陽光電設施開發案基地聯絡道路審議原則」（區委會第461次會議
      111.10.13 附件1）之操作化但書：寬度應至少可供施工、維修車輛及消防車通行
      （施工維修車輛原則≥4公尺），並承諾施工期間交通管制。

  # ── 須函詢 ───────────────────────────────────
  - id: zone_change
    名稱: 應變更使用分區之規模
    條號: 管制規則§11
    類型: inquiry
    機關: 臺南市政府／內政部區域計畫委員會
    備註: >-
      非都市土地達本條所定規模者**應變更使用分區**（＝走開發許可，非單純容許使用）。
      前例（2019-004）即以「變更分區為執行方式」進行評估。
      執行流程：臺南市政府受理 → 中央審查，**約 2～4 年**（前例實績），
      本案另須併計環評時程。

  - id: local_opinion
    名稱: 地方民意與民眾參與
    條號: 開發審議規範總編（民眾參與）
    類型: inquiry
    機關: 當地里辦公處／說明會
    備註: >-
      前例明載：基地**北側緊鄰牛埔泥岩水土保持教學園區**，自然環境良好；
      **前因設立廢棄物綜合處理中心遭當地民眾強烈反彈、開發計畫中止**。
      本類案件辦理興辦事業計畫及開發計畫時恐須辦說明會或座談會，應列為時程風險。
