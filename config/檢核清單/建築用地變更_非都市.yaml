# 非都市土地農業用地（農牧等）變更為建築用地／私人住宅 — 檢核清單
#
# 建立：2026-10-03 高雄彌陀安港段587（＋495）案結案沉澱。
# 法源（皆於 2026-10-02～03 回官方原文逐條核對；對應法令檢核規則庫 rule_id）：
#   非都市土地使用管制規則 D0060013（115.05.27）§27 附表三（LUR-027）、§35（LUR-035）、§35-1（LUR-035-1）
#   農地變更審查要點 FL014304 第十四點（AGR-014）
#   地籍測量實施規則 D0060053 §224（CAD-224）
#   農業用地興建農舍辦法 M0110013 §2、§9、§12（FARM-002、FARM-009）
#   農業發展條例 M0020001 §18Ⅲ（ADA-018-3）
#   實施區域計畫地區建築管理辦法 D0070123 §5、§11（RBM-005、RBM-011）
#
# ★ 本案型的關鍵事實（先讀）：
#   附表三：一般農業區、特定農業區**不允許**以一般興辦事業計畫（§30）變更為甲～丁種建築用地，
#   只能循規則「另有規定」——私人實務上只剩 §35、§35-1 兩條零星土地；其餘（§40、§42、§42-1、§45）
#   限公共工程拆遷、政府住宅、災民安置、離島原保地。兩條都不成立時，**私人住宅改走興建農舍**
#   （農牧用地容許使用，不必變更編定）。
#
# ★ 使用方式：一律搭配 `_共通_農業用地變更` 一起跑（養殖漁業生產區、特農區等仍要檢）。
用途: 非都市農業用地變更為建築用地（私人住宅）／替代方案興建農舍
法源版本: 非都市土地使用管制規則 115.05.27；農業用地興建農舍辦法 111.11.01
法源查核日期: 2026-10-03
搭配清單: [_共通_農業用地變更]

檢核項目:
  - id: annex3
    名稱: 使用地變更原則（附表三）
    條號: 管制規則§27 附表三
    類型: note
    級別: ╳
    備註: >-
      一般農業區、特定農業區之土地變更編定為甲、乙、丙、丁種建築用地均為「×」；
      說明一「但本規則另有規定者，得依其規定辦理」→ 只能循 §35、§35-1、§40、§42、§42-1、§45。
      鄉村區變更為乙種建築用地為「＋」（另依§28Ⅱ③免附興辦事業計畫）。
      附表三官方 PDF 為 CID 字型無法抽字，判讀以官方附表影像為準（勿憑印象）。

  - id: sporadic_35
    名稱: 零星或狹小土地（§35）
    條號: 管制規則§35
    類型: note
    級別: △
    備註: >-
      前提是**毗鄰甲種、丙種建築用地**（或國民住宅等特目用地）——只毗鄰鄉村區**乙種**建築用地者
      前提即不成立（彌陀案實例）。再合於五款之一：建築用地包圍／道路水溝包圍／凹入（缺口≤20m）
      三款面積≤0.12公頃；狹長平均寬度≤10m；≤0.012公頃且鄰接無相同使用地類別。
      ①～③⑤得因地形坵塊完整增加10%。道路水溝平均寬≥4m，且須78.04.03前編定（政府興建、既成道路除外）。
      ★數筆個別申請時市府就整體認定（§35Ⅴ）。
      工具：`python -X utf8 scripts/sporadic_land_check.py --case outputs/<案>`
      （緊鄰宗地使類＋共同邊界、平均寬度＝面積／最小外接矩形長邊、§35／§35-1 逐款初判）。

  - id: sporadic_35_1
    名稱: 鄉村區邊緣畸零不整土地（§35-1）
    條號: 管制規則§35-1
    類型: note
    級別: △
    備註: >-
      毗鄰或凹入鄉村區、經市府認定非作為隔離必要。五款：①毗鄰、外圍有道路水溝或建築用地隔絕、
      ≤0.12公頃 ②三面連接鄉村區、≤0.12公頃 ③凹入、外圍有道路水溝機關學校軍事用地或明顯自然界線
      隔絕、≤0.5公頃 ④狹長平均寬度≤10m ⑤≤0.012公頃。
      ★第三款以「**所在連續農業用地整塊**」判斷（準用§35Ⅴ整體認定）：彌陀案基地 0.118／0.347 公頃
      本身都在 0.5 公頃內，但所在連續農牧用地**至少 4.38 公頃**（250m 框內 49 筆，為下限；
      2026-10-04 重查外擴 500m 已達 9.05 公頃且仍未封閉）、外圍仍緊鄰農牧用地，判不符。
      聚合法：周邊框查宗地中，非鄉村區且使類屬六類農業用地者，以 0.3m buffer 相接建連通分量；
      ⚠ 分量碰到查詢框邊即代表被截斷，只能寫「至少」。
      工具：`python -X utf8 scripts/sporadic_land_check.py --case outputs/<案>`。
      ⚠ 都市計畫農業區不是隔絕要素（第一款隔絕要素是都市計畫住宅、商業、工業區）。

  - id: agr_exempt_link
    名稱: 零星土地之農業同意（免依要點審查）
    條號: 農地變更審查要點§14、管制規則§30Ⅶ
    類型: note
    級別: ○
    備註: >-
      符合 §35／§35-1 者屬「合法建築用地包圍、夾雜之零星農業用地」，免依要點審查
      （免說明書、免§9～§11 隔離綠帶），但仍須徵詢農業主管機關審核同意。詳 _共通_農業用地變更 的 agr_exempt_14。

  - id: farmhouse_area
    名稱: 替代方案：個別農舍面積與土地合併
    條號: 農舍辦法§2Ⅰ③、地籍測量實施規則§224
    類型: note
    級別: △
    備註: >-
      個別農舍要求「**該筆**」農業用地≥0.25公頃——是單筆，不是同一申請人多筆合計。
      不足者可與相鄰土地合併：同一地段、地界相連、使用性質相同；所有權人不同附全體協議書、
      有抵押權附抵押權人協議書。⚠ 合併後「土地取得滿二年」如何起算法規未明定，須洽縣市農業局。

  - id: farmhouse_pre89
    名稱: 替代方案：89.01.04 前取得農地之農舍
    條號: 農業發展條例§18Ⅲ
    類型: inquiry
    級別: △
    機關: 地政事務所（調閱登記謄本）
    備註: >-
      89年1月4日修正施行前取得農業用地且無自用農舍者，依相關土地使用管制及建築法令申請，
      不受0.25公頃與取得／戶籍滿二年限制；⚠ 申請人**仍須為農民**並符合無自用農舍、確供農業使用
      （農舍辦法§3 準用§2Ⅰ④⑤）。⚠ 地籍資料（getLandInfo／框查）的「登記日期」常是**地籍圖重測**
      （登記原因碼03），不是所有權取得日，一律以謄本所有權部為準。

  - id: farmhouse_existing
    名稱: 既有建物與套繪管制
    條號: 農舍辦法§9Ⅱ⑥、§12
    類型: note
    級別: △
    備註: >-
      同一筆農業用地僅能申請興建一棟農舍；已申請興建農舍之農業用地套繪管制。
      基地內國土利用調查有建物類（純住宅等）或正射可見建物者，先查是否為已套繪之農舍或合法建物——
      若為既有農舍，合併後亦不得再申請。

  - id: farmhouse_scale
    名稱: 農舍建築規模
    條號: 實施區域計畫地區建築管理辦法§5、農舍辦法§9Ⅱ③
    類型: note
    級別: ○
    備註: >-
      建築面積≤耕地10%、最大基層≤330㎡、總樓地板≤495㎡、≤3層且≤10.5m；
      農舍用地≤10%、農業經營用地為完整區塊且≥90%。面積約 0.33 公頃以上時 10% 即超過 330㎡，取 330㎡。

  - id: road_link
    名稱: 臨路與建築線
    條號: 實施區域計畫地區建築管理辦法§11
    類型: inquiry
    級別: △
    機關: 直轄市、縣（市）主管建築機關（工務局）
    備註: >-
      臨接寬6m以下道路應自中心線退讓3m；以私設通路連接道路者寬度依長度 2／3／5m（總樓地板≥1,000㎡為6m）。
      ⚠ road_access.py 的「直接臨路」只代表與國土利用調查道路面相接——彌陀案「文安路寺巷」坐落私有
      鄉村區乙建與農牧用地、非交通用地，能否指定建築線須主管建築機關認定。交付前查緊鄰道路面坐落哪些地號。

  - id: groundwater
    名稱: 地下水管制區（取代原嚴重地層下陷地區）
    條號: 地下水管制辦法§4（WRA-005）
    類型: note
    級別: ○
    備註: >-
      嚴重地層下陷地區已由地下水管制區取代（使用者 2026-10-03 指正）；NGIS 2-03 嚴重地層下陷地區為舊圖層，
      0 命中不足為據，一律以本機 環境敏感相關/其他/地下水管制區/ 判定：gwconare＝第一級（原則禁止新鑿井），
      gwconare2 圖資未載級別（推定含第二級，鑿井須經核准）。級別以水利主管機關查詢為準。
