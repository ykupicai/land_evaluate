# 地面型太陽光電設施（山坡地、未達 2 公頃、使用地變更編定）— 禁止事由與設置條件檢核清單
#
# 建立緣由（2026-11-12 使用者定案「拆成兩份」）：原 `光電_山坡地_臺南市.yaml` 依龍崎番社段（51.4 公頃、
#   工業區／特目用地）建立，走開發許可、大量引用開發審議規範。衍古實際案例（白河糞箕湖段南河一號、
#   昕億築 0.35 公頃）山坡地光電多為 **2 公頃以下、使用分區不變、只變更使用地類別**（管制規則§27），
#   不適用開發審議規範（GEN-*／第十四編）。本清單即該路徑；達 2 公頃者改用 `光電_山坡地_臺南市.yaml`。
#
# 規則來源：衍古知識庫法令檢核規則庫（本專案唯讀快取 config/規則庫快取/），知識庫 2026-11-12 建議清單：
#   LUR-052-1＋PVIND-07、LUR-049-1、BTR-262、LUR-030／030-1／030-2／030-3、PVIND-02/03/05-5～05-8、
#   GEO-5-5、GEO-8、SWC-012、SWCR-03、AGR-007-1（農變要點其餘 AGR-002/005/006/010 由共通清單負責）。
#
# 用法：基地含農業用地（農牧／林業／養殖等）時一律與共通清單同跑：
#   check_zones --joined <基地.shp> --checklist _共通_農業用地變更 光電_山坡地_變更編定
# ⚠ 第一道門檻是 pv_agri_under2ha（AGR-007-1）：農牧、林業、養殖用地變更作光電未達 2 公頃原則不同意。
用途: 地面型太陽光電設施（山坡地／未達2公頃變更編定）
法源版本: 管制規則 115.05.27；光電興辦事業計畫審查作業要點 FL060265；農變要點 FL014304；地質法 114.11.28
法源查核日期: 2026-11-12
搭配清單: [_共通_農業用地變更]

檢核項目:
  # ── 路徑與規模 ────────────────────────────────────
  - id: pv_scale_2ha
    規則編號: [PVIND-05-8, LUR-011]
    名稱: 達 2 公頃改走開發許可（本清單不適用）
    條號: 光電審查作業要點第五點(八)；管制規則§11
    類型: note
    級別: 參考
    備註: >-
      申請變更編定面積（以相連之申請範圍登記面積計，含與鄰近同一興辦事業累計，見 pv_cumulative）
      達 2 公頃以上者，土地使用計畫依開發審議作業規範辦理 → 改用 `光電_山坡地_臺南市.yaml`（開發許可版）。

  - id: pv_cumulative
    規則編號: [PVIND-05-7]
    名稱: 與鄰近興辦事業具關聯性者面積累計計算
    條號: 光電審查作業要點第五點(七)
    類型: note
    級別: 參考
    備註: 經審認屬原有興辦事業之擴增者，新舊申請變更面積應累計計算（切小案規避 2 公頃無效）。

  - id: pv_prereq
    規則編號: [PVIND-02]
    名稱: 須先取得電業籌備創設許可
    條號: 光電審查作業要點第二點
    類型: note
    級別: 參考
    備註: 已取得經濟部核發太陽光電發電廠電業籌備創設者，始得依本要點申請興辦事業計畫審查。

  - id: pv_slope_10ha
    規則編號: [LUR-052-1, PVIND-07]
    名稱: 山坡地 10 公頃下限（光電得免受限）
    條號: 管制規則§52-1；光電審查作業要點第七點
    類型: area
    級別: △
    非山坡地_公頃: 0
    山坡地_公頃: 10
    山坡地圖層: '環境敏感相關\第二級\2-06 山坡地 (1060531update)\BOUNDARY.shp'
    翻轉條件: >-
      光電要點第七點：位於山坡地且經縣市政府依本要點審查符合變更規定者，依再生能源發展條例§15Ⅰ得認定適用
      §52-1 第三款公用事業，免受 10 公頃限制 → 未達 10 公頃不直接判 ╳，待縣市審查認定。

  # ── 農業用地與使用地類別 ─────────────────────────
  - id: pv_agri_under2ha
    規則編號: [AGR-007-1]
    名稱: 農牧、林業、養殖用地變更作光電未達 2 公頃不同意
    條號: 農變要點第七點之一
    類型: attribute
    級別: ╳
    欄位: [使用地類別, 使類]
    含值: 農牧用地|林業用地|養殖用地
    翻轉條件: >-
      無第五點各款情形且符合之一者得申請：(一)為自然地形或其他非農業用地所包圍、夾雜之零星農業用地；
      (二)屬 109.07.31 前經台電核准併聯審查意見書，或「109 年太陽光電 6.5GW 達標計畫」列管之專案推動區域。
      → 命中先查這兩款，都不符即不可行。

  - id: pv_sfa
    規則編號: [PVIND-05-5, PVIND-03]
    名稱: 不得使用特定農業區農業用地
    條號: 光電審查作業要點第五點(五)、第三點附表
    類型: attribute
    級別: ╳
    欄位: [使用分區, 使分]
    含值: 特定農業
    備註: 其他分區之農業用地依農變要點辦理並繳農業用地變更回饋金（農發條例§12）。

  - id: pv_forest_landtype
    規則編號: [PVIND-03]
    名稱: 林業用地不得申請變更編定為光電使用
    條號: 光電審查作業要點第三點附表
    類型: attribute
    級別: ╳
    欄位: [使用地類別, 使類]
    含值: 林業用地
    備註: 附表受理原則：林業用地於 9 個使用分區皆為 ×（不得申請變更編定）。暫未編定之山坡地依管制規則§7 適用林業用地管制。

  # ── 地質與山坡地建築限制 ─────────────────────────
  - id: landslide
    規則編號: [GEO-5-5, GEO-8]
    名稱: 山崩與地滑、地質遺跡地質敏感區
    條號: 地質法§5Ⅴ、Ⅵ（114.11.28 修正新增）、§8
    類型: overlay
    級別: ╳
    圖層: '環境敏感相關\第二級\2-01 地質敏感區(活動斷層、山崩與地滑、土石流)(1051221update)\地質敏感區山崩與地滑.shp'
    陳舊警告_年: 8
    翻轉條件: 經環評審查通過且於敏感區內設置（含累積）面積 1 公頃以下者不在此限；屋頂型或 100㎡以下自用不適用。
    備註: 地質遺跡地質敏感區同受§5Ⅴ限制（本機無圖層，以 NGIS 套疊查）。仍設置者依§8 辦基地地質調查及地質安全評估。

  - id: fault
    規則編號: [GEO-8, BTR-262, LUR-049-1]
    名稱: 活動斷層（地質敏感區）
    條號: 地質法§8；建築技術規則建築設計施工編§262Ⅰ③；管制規則§49-1
    類型: overlay
    級別: △
    圖層: '環境敏感相關\第二級\2-01 地質敏感區(活動斷層、山崩與地滑、土石流)(1051221update)\地質敏感地區活動斷層.shp'
    陳舊警告_年: 12
    備註: >-
      山坡地依歷史最大地震規模，斷層帶兩外側 100／50／30 公尺內不得開發建築（§262）；
      變電站、管理室等建築物落在範圍內＝╳，可避開維持 △，另辦基地地質調查。

  - id: pv_project_team
    規則編號: [LUR-049-1, BTR-262]
    名稱: 山坡地變更編定專案小組審查、特定情形不得規劃建築
    條號: 管制規則§49-1；建築技術規則建築設計施工編§262
    類型: note
    級別: 參考
    備註: >-
      山坡地變更編定案一律組專案小組審查；範圍內經建築法令認定坡度陡峭、地質不良／活動斷層／順向坡、
      礦坑廢土堆、河岸侵蝕、崩塌洪患等者不得規劃作建築使用 → 以坡度分析（slope_check）與地質敏感區
      套疊標出不可建築範圍，變電站等建築物須避開。

  - id: slope_land
    規則編號: [SWC-012, SWCR-03]
    名稱: 山坡地（水土保持）
    條號: 水土保持法§12；水土保持計畫審核監督辦法§3
    類型: overlay
    級別: △
    圖層: '環境敏感相關\第二級\2-06 山坡地 (1060531update)\BOUNDARY.shp'
    陳舊警告_年: 8
    備註: >-
      位於山坡地應擬具水土保持計畫（挖填方合計未滿 2,000 立方公尺者得以簡易水保申報書代之），
      水保計畫未核定前目的事業主管機關不得逕行核發許可。

  # ── 環境敏感地區 ──────────────────────────────────
  - id: env_level1
    規則編號: [LUR-030-1, LUR-030-2]
    名稱: 第一級環境敏感地區
    條號: 管制規則§30-1、§30-2
    類型: note
    級別: 參考
    備註: >-
      興辦事業計畫不得位於第一級環境敏感地區（以 ⓪b NGIS 一級圖層判定；含國有林事業區、保安林、
      自然保留區等）。夾雜之零星一級土地須符合§30-2 四款（面積不超過基地 10% 等）始得納入。

  - id: env_level2
    規則編號: [LUR-030-3]
    名稱: 第二級環境敏感地區
    條號: 管制規則§30-3
    類型: inquiry
    機關: 各該中央目的事業主管機關
    級別: △
    備註: 位於第二級者應於興辦事業計畫說明防範措施並徵詢主管機關意見。

  - id: eia_location
    規則編號: [EIA-05-3]
    名稱: 環境影響評估（太陽光電特定區位）
    條號: 環境影響評估法§5Ⅲ
    類型: note
    級別: 參考
    備註: >-
      太陽光電應實施環評之九款含特定區位（如山崩與地滑地質敏感區等），小面積也可能觸發；
      以 NGIS 套疊結果逐款對照。

  # ── 臨路 ──────────────────────────────────────────
  - id: pv_road
    規則編號: [PVIND-05-6, BTR-2]
    名稱: 應臨接道路
    條號: 光電審查作業要點第五點(六)；建築技術規則建築設計施工編§2
    類型: note
    級別: 參考
    備註: >-
      變更編定路徑之臨路依實施區域計畫地區建築管理辦法及建築技術規則（與開發許可路徑的審議規範§26
      標準不同）。以臨路評估初判，路寬與道路坐落地號須人工覆核。
