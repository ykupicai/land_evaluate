# 都市計畫學校用地(文小)配合專案通盤檢討解編變更為住宅區 檢核（2026-08-20 全文核對後大幅改寫）
# ★★ 本檔第一版（今日稍早）誤判本案為「配合既定方向做陳情」，讀完官方計畫書全文
#   （使用者提供 變更仁德文賢(公設專通)計畫書(浮水印).pdf，103頁，臺南市政府110年7月
#   報部審議版）後發現：計畫書自己對這塊地的處理方向是「解編為農業區」，不是住宅區。
#   本案委託人要做的陳情，實質是「爭取推翻已進入市都委會審議通過、報部審議中的
#   農業區結論，改列住宅區」——難度遠高於「順著既定方向陳情」，本版依此重寫。

用途: 都市計畫學校用地(文小)配合專案通盤檢討_爭取推翻農業區改列住宅區
法源版本: 都市計畫法§26/§42~§47；都市計畫定期通盤檢討實施辦法§10/§14①4款/§21；
  內政部102.11.29函頒「都市計畫公共設施保留地檢討變更作業原則」
法源查核日期: 2026-08-20（已取得計畫書全文逐頁核對，非僅摘要）

檢核項目:
  - id: plan_disposition_conflict
    名稱: ★核心矛盾：計畫書本身的處理方向是農業區，非住宅區
    條號: 「變更仁德(文賢地區)都市計畫(公共設施用地專案通盤檢討)案」計畫書表5-1編號6、圖5-18
    類型: note
    級別: 障礙（非法定禁止，但為現況既定結論）
    備註: >-
      計畫書（臺南市政府110年7月，報部審議版）第5-11頁表5-1「變更內容明細表」
      編號6：「大甲國小西側　文小用地(文小2)　0.63公頃　→　農業區」，理由：
      ①文小2尚有部分私有地未取得，現況為農業使用 ②該私有地位屬學校圍牆外，
      解編後尚不影響校地完整性，故併同鄰近分區變更為農業區。圖5-2「私有公共
      設施用地檢討原則(解編)示意圖」把此地歸入「免予回饋」欄（判準：已無使用
      需求、周邊發展程度不高，併鄰近分區解編為農業區或保護區，免予回饋）——
      即市府評估周邊發展程度不足以支撐住宅區，只給比照周邊現況降編為農業區，
      且因非升編不必回饋。
      ★使用者確認：委託人保甲段333/334/335/336/340（合計登記5,358.32㎡，
      圖面積5,358.31㎡）與計畫書編號6之0.63公頃（6,300㎡）為同一塊地或高度
      重疊（面積比對85%，位置描述「大甲國小西側」與地籍位置一致）；精確地籍
      邊界與圖5-18示意圖之逐宗地對應，尚待地政圖資疊圖精確核對，非逐坪確認。
      → 本案陳情的實質是「主張推翻市都委會已審議通過、報部審議中的農業區
      結論，改列住宅區」，難度遠高於單純配合既定方向陳情，且無法定禁止事由
      可援引使力，純屬「說服主管機關改變已作成之行政判斷」之攻防。
    查證: 計畫書全文逐頁讀取核對（Google Drive使用者提供PDF，2026-08-20）

  - id: procedure_status_unclear
    名稱: ★程序現況不明：內政部審核結果欄空白，逾5年未見核定，須先查清
    條號: 計畫書第3頁「臺南市變更都市計畫審核摘要表」
    類型: note
    級別: 待確認（影響陳情管道與時機）
    備註: >-
      摘要表「本案提交各級都市計畫委員會審核結果」欄：市級已載明「民國110年
      4月15日臺南市都市計畫委員會第100次會議審議通過」，惟「內政部」欄**空白
      未填**。本文件標註為「報部審議版」，理論上110年7月即已報請內政部審議，
      距今（115年8月）逾5年仍無核定紀錄——不排除是使用者提供之PDF版本較舊
      （尚未更新審核結果之早期版本），也不排除案件於內政部審議中程序有延宕或
      補件。★兩種情境陳情管道完全不同：①若尚未核定——委託人可在內政部審議
      過程中提出意見/陳情，主張改列住宅區，屬程序內攻防；②若已核定發布實施
      （5年時間足夠走完程序）——本案已成定局，要改須另闢個案變更(§27)蹊徑，
      是完全獨立的新程序，非本輪陳情。
      → 開案第一步務必向臺南市政府都市發展局查明：本案內政部審議進度、是否
      已核定發布實施、目前文小2現況登記是否已依此變更為農業區。查明前一律
      標「待確認」，不可假定任一情境已成立。

  - id: reversal_argument_basis
    名稱: 可主張推翻之論證基礎（僅為可用素材，非保證成立）
    條號: 計畫書第4-3~4-5頁（表4-1/4-2 人口與公設用地需求檢討）
    類型: note
    級別: 參考（陳情攻防素材）
    備註: >-
      計畫書自己的需求檢核（表4-2）顯示：文小用地現行計畫面積6.27公頃，依教育部
      國民中小學設備基準（每位學生13.8㎡）核算需求僅2.00公頃，**超過需求4.27
      公頃**（文中用地同樣超過需求3.96公頃）——文小用地整體確有大幅過剩，這點
      對委託人有利，可作為「此塊校地確無保留必要」的論證起點。
      ★但「過剩、應解編」與「應解編為住宅區」是兩件事——計畫書的邏輯是過剩地
      比照周邊現況處理（周邊是農業使用即解編為農業區），要主張改列住宅區，
      需另外論證「周邊已達住宅區發展程度」，而非僅重複計畫書已承認的「過剩」
      這一點（那只會導向維持農業區解編的結論，對委託人無益）。
      → 陳情論述須聚焦：本筆土地及周邊實際發展現況是否已具備比照住宅區之
      條件（鄰近已有建物、聯外道路、公共設施可及性等），而非僅主張「用不到了」。

  - id: surrounding_development_evidence
    名稱: 周邊發展現況佐證（需實地/圖資查核，非計畫書逐字記載）
    條號: —
    類型: note
    級別: 待補查
    備註: >-
      計畫書圖5-18顯示本筆西北側緊鄰既有「農」（農業區）；本案要主張住宅區，
      關鍵在於能否提出東側/南側緊鄰已發展街廓、既有聯外道路可及性等事實，
      與計畫書「周邊發展程度不高」之判斷相佐證或反駁。此部分計畫書未逐字
      交代（非其論述重點），需另外用①出圖之區位圖／使用分區圖圖面判讀
      ②現地照片 ③臨路評估成果，自行整理佐證資料，不可憑印象寫入交付文件。

  - id: agri_authority_consent
    名稱: 農業主管機關同意（如成功改列住宅區，是否觸發農地變更同意）
    條號: 農變要點FL014304§2(三)
    類型: note
    級別: 參考（條件式）
    備註: >-
      §2(三)適用對象為「都市計畫農業區、保護區農業用地劃定或變更為非農業
      使用」。本筆現況為「文小用地(公共設施保留地)」非「農業區」，若维持
      計畫書方向解編為農業區後，將來才可能再談變更為非農業使用而觸及本項；
      若本次陳情成功、直接由文小用地改列住宅區（略過農業區這個中間態），
      則本項是否適用尚待進一步推敲，非可逕行套用或逕行排除。

  - id: aviation_restriction
    名稱: 航空站禁限建範圍（高度管制）
    條號: 民用航空法第32條/第33條及公告禁止或限制建築地區或高度管制範圍
    類型: overlay
    級別: 參考
    備註: >-
      NGIS環境敏感套疊（2026-08-20）：基地5,358.31㎡中1,476.62㎡（27.56%）
      落於「2-27民用航空法之禁止或限制建築地區或高度管制範圍」（二級環境
      敏感）。仁德區鄰近臺南航空站（軍民合用），此範圍限制建築物「高度」，
      非禁止住宅使用本身；若本次陳情成功改列住宅區，設計階段須依該公告
      高度上限規劃棟距與樓層數。
    查證: scripts/ngis_sensitive.py 實測（2026-08-20，環敏NGIS.csv/.json）

  - id: road_access
    名稱: 臨路條件
    條號: 建築技術規則建築設計施工編相關規定
    類型: note
    級別: 參考
    備註: >-
      ②c臨路評估（2026-08-20）：案場直接臨路，惟②c算出之鄰接路寬中位數僅
      3.95公尺，屬相當狹窄的巷道等級——這點對「主張周邊已具住宅區發展條件」
      的論述**不利**，宜如實揭露並提出因應（如爭取條件式核定、後續退縮建築等），
      不可迴避不提。LUIMAP路寬僅供初判，交付前應另以都市計畫道路劃設寬度
      ＋實景判讀並陳。

  - id: ownership_consent
    名稱: 土地使用同意書／陳情人適格
    條號: 都市計畫法相關陳情程序規定
    類型: note
    級別: 參考
    備註: >-
      5筆權屬本機快照皆推論私有（未列於公有土地名冊），關鍵筆數建議以土地
      登記謄本或TCDGIS覆核。陳情如非全體共有人具名提出，應確認委託人是否
      取得其餘共有人（如有）同意或授權。
