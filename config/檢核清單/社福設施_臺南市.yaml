# 社會福利設施（非都市土地一般農業區農牧用地 → 變更編定為特定目的事業用地）
# 臺南市 — 禁止／不同意事由檢核清單（2026-08-05 建，後壁南海段測試案）
#
# 法源鏈（以衍古 71 層重點筆記為準，見查詢結果；★條款細節須回規則庫/71層核對）：
#   路徑＝變更編定為「特定目的事業用地」（非容許使用、非開發許可，除非達管制規則§11規模）
#   - 非都市土地使用管制規則 §27（原使用分區內申請）／§28（申請文件）／§30（擬興辦事業計畫報核）
#   - §30-1 興辦事業計畫不得位於第一級環境敏感地區（僅五類例外）
#   - §30-2 夾雜第一級環敏零星土地之四款／§30-3 位於第二級環敏須說明防範並徵詢
#   - 農業主管機關同意農業用地變更使用審查作業要點 §5/§6/§7（§6特農、§7養殖＝走 _共通_農業用地變更）
#   前例：臺南大內段-嘉品國際長照特目（已核定，10_變更編定）
#
# ⚠ 用法：一律與 `_共通_農業用地變更` 同跑（養殖漁業生產區/特農＝該共通清單）：
#     check_zones --joined <joined.shp> --checklist _共通_農業用地變更 社福設施_臺南市
# ⚠★2026-08-06 補：本清單 sw_scale_over_2ha 項判定案件達2公頃時，另需加跑
#   `_共通_開發許可`（總編§16/§17/§26/§40，含保育區/緩衝綠帶/聯絡道路）——這幾項
#   跟用途無關、只跟「是否走開發許可」有關，後壁南海段社福案（5.4319公頃）當時
#   漏了§17保育區的實際查核就是這個洞，詳見該案 STATE.md「待確認項」。
#   案件確定未達2公頃、單純變更編定者不必加跑。
# ⚠ 社福專屬提醒（衍古 2026-08-05）：
#   ①「社會福利設施」身分須由社會局（社政主管機關）正式認定，非計畫書自稱即可。
#   ② 200 公尺聚落／醫療／文教／社福距離條款**不適用本案**——該條在土資場自治條例，是
#      「土資場需距社福機構 >200m」，社福在此是被保護受體、非申請人，勿誤植為本案禁止事由。
#   ③ 山坡地才有管制規則§52-1（面積下限10公頃），社福可依第三款＋衛福部108-08-22函經
#      社會局認定免受10公頃限制；本案後壁為平地一般農業區、不觸及。
用途: 社會福利設施（非都市土地變更編定為特定目的事業用地）
法源版本: 非都市土地使用管制規則§27/28/30/30-1~3；農業用地變更審查要點111.03.17
法源查核日期: 2026-08-05
搭配清單: [_共通_農業用地變更]

# ══ FL053363 社福設施審查要點專屬（2026-08-05 補，後壁南海段案查證）══
# 法源：非都市土地申請變更作為社會福利設施使用其事業計畫審查作業要點（FL053363，93.01.12）
檢核項目:
  - id: sw_scale_over_2ha
    名稱: 面積達2公頃須先經區域計畫擬定機關許可
    條號: 社福設施審查要點§5①
    類型: note
    級別: △
    備註: >-
      申請變更編定使用土地面積達2公頃以上者，核准興辦事業計畫前，土地使用計畫應先
      徵得區域計畫擬定機關（內政部）之許可（＝走開發許可程序）。本案圖面積5.44公頃
      （登記面積待persite_stats）逾2公頃 → **應走開發許可**，非單純變更編定。

  - id: land_consolidation
    名稱: 經農地重劃之農牧用地
    條號: 社福設施審查要點§5②
    類型: overlay
    級別: △
    圖層: '農地重劃區\20230505農地重劃區.shp'
    陳舊警告_年: 4
    備註: >-
      原則不得使用經農地重劃之農牧用地（「原則」＝有但書空間，故列△非╳）。命中則
      須於興辦事業計畫說明無法迴避之理由並徵得農業主管機關同意。

  - id: forest_grade_56
    名稱: 五級宜林地及六級加強保育地
    條號: 社福設施審查要點§5①
    類型: note
    級別: △
    備註: >-
      不得使用五級宜林地及六級加強保育地（山坡地坡度/土地可利用限度分類）。本案後壁
      為平地一般農業區、非山坡地 → 不涉及；若為山坡地案則須查土地可利用限度分類。

  - id: setup_deadline_3y
    名稱: 3年內設立期限
    條號: 社福設施審查要點§5⑦
    類型: note
    備註: 許可後3年內須設立，逾期未設立廢止許可並回復原編定（時程約束，交付須提醒業主）。

  - id: env_level1
    名稱: 第一級環境敏感地區（管制規則§30-1）
    條號: 非都市土地使用管制規則§30-1
    類型: inquiry
    機關: 內政部國土管理署（環境敏感地區單一窗口平台）
    備註: >-
      興辦事業計畫不得位於第一級環境敏感地區（僅五類例外）。**已由 ⓪b 環敏初篩查核**：
      本案第一級各項均無涉及（見 環境敏感初篩.csv）。⚠ 變更編定分割出新地號後，
      仍須以新地號至平台重查一次（§30-1 以核准時之範圍認定）。

  - id: env_level2
    名稱: 第二級環境敏感地區（管制規則§30-3）
    條號: 非都市土地使用管制規則§30-3
    類型: inquiry
    機關: 各中央目的事業主管機關
    備註: >-
      位於第二級環敏者非不得辦理，但須於興辦事業計畫說明防範措施並徵詢各中央目的事業
      主管機關意見（非 ╳、屬 △）。本案初篩第二級亦多無交集，僅屬一般農業區農地本身。

  - id: aborigine_land
    名稱: 原住民保留地
    條號: 送件前置四查詢①
    類型: overlay
    級別: ╳
    圖層: '環境敏感相關\其他\原住民保留地\原住民保留地.shp'
    陳舊警告_年: 6
    備註: 前置查詢四連發之一；命中則涉原基法、辦理路徑不同。查無圖資時改函詢原民會。

  - id: social_welfare_recognition
    名稱: 社會福利設施身分認定
    條號: 興辦事業計畫核准（社政主管機關）
    類型: inquiry
    機關: 臺南市政府社會局
    備註: >-
      須由社會局正式認定為「社會福利設施」並核准興辦事業計畫，方能據以辦理變更編定
      （管制規則§30）。此為程序要件，非基地條件——光看圖資查不出，開案即須確認。

  - id: irrigation_drainage
    名稱: 農田水利灌排／搭排
    條號: 送件前置四查詢③
    類型: inquiry
    機關: 農業部農田水利署（臺南管理處）
    備註: >-
      基地內或緊鄰灌排渠道者，變更使用不得妨礙灌排；需搭排者另申請。前置四查詢之一。
      （交通用地 96 地號可能為農路，出圖時一併檢視。）

  - id: outflow_control
    名稱: 出流管制
    條號: 出流管制計畫書免辦認定辦法§2-1
    類型: note
    級別: △
    備註: >-
      基地達 1 公頃即觸發出流管制（增技師簽證、費用、時程）。本案圖面積約 5.4 公頃
      （登記面積合計待 persite_stats 實算）**逾 1 公頃 → 觸發**，須納入水土保持/出流管制規劃。
