# 營建剩餘土石方臨時暫置場（全國）— 設置條件檢核清單
# 法源：非都市土地設置營建剩餘土石方臨時暫置場作業規定（內政部 GL001768，115.07.24 台內國字第1150808491號令）
#       依非都市土地使用管制規則§6Ⅰ「重大政策」核定之臨時使用；設置 3 年、得展延 2 年一次。
# 沿革：2026-11-26 左鎮光和段案（申請人＝臺南市營建混合物分類處理商業同業公會）建立。
#       第4、5點已回內政部法規共用系統原文核對；其餘點依衍古 71 層筆記
#       〔非都市土地設置營建剩餘土石方臨時暫置場作業規定-重點〕。
# ⚠ 規則庫尚無本作業規定之規則編號（2026-11-26），「規則編號」一律留空，待知識庫建入並轉正後再補。
# ⚠ 與縣市土資場自治條例是兩條路徑（長期營運許可 vs 政策性臨時使用），不可混用；
#   但地方自治條例的「土資場」定義可能涵蓋暫屯、轉運（臺南市自治條例§3），見 local_ordinance 項。
用途: 營建剩餘土石方臨時暫置場（全國，非都市土地）
法源版本: 非都市土地設置營建剩餘土石方臨時暫置場作業規定 115.07.24
法源查核日期: 2026-11-26
搭配清單: []

檢核項目:
  - id: applicant
    名稱: 申請人資格
    條號: 暫置作業規定第4點
    類型: inquiry
    機關: 申請人自行確認
    級別: ╳
    備註: >-
      申請人限①直轄市、縣（市）政府 ②工程主辦（管）機關 ③依法登記之公會，三擇一。
      民間業者不得直接申請，須由工程主辦機關或公會出面。開案先問申請人身分。

  - id: zone_ban
    名稱: 不得位於特定農業區、森林區、河川區
    條號: 暫置作業規定第5點Ⅰ(一)
    類型: attribute
    級別: ╳
    欄位: [使用分區, 使分]
    含值: 特定農業|森林|河川

  - id: env_level1
    名稱: 不得位於第一級環境敏感區
    條號: 暫置作業規定第5點Ⅰ(一)
    類型: inquiry
    機關: 以 scripts/ngis_sensitive.py 一級命中判定（法定認定以 eland／主管機關為準）
    級別: ╳
    備註: >-
      跑 ngis_sensitive.py --case <案>，環敏NGIS.json 中 level＝「一級」任一命中即不得設置（全域條件，
      剔除土地無法排除者判 ╳）。左鎮光和段案：玉峰堰水庫集水區（1-21，供家用或公共給水）100% → ╳。
      NGIS 有涵蓋落差（0 命中≠無涉及），重大項目與本機圖資交叉核對。

  - id: school_hospital_1km
    名稱: 距學校、幼兒園或醫院 1 公里以上
    條號: 暫置作業規定第5點Ⅰ(二)、Ⅱ
    類型: api_distance
    級別: ╳
    距離_m: 1000
    端點: [med, edu]
    備註: >-
      以申請範圍界線與建築基地境界線最近二點直線測量。環域 API 的 med／edu 為醫療、文教設施，
      不等於條文的「學校、幼兒園、醫院」——衛生所、診所、化石園區等須逐一判讀；幼兒園收錄可能不全，
      必要時函詢教育局。

  - id: soil_b5
    名稱: 磚塊、混凝土塊（B5類）僅限特定專用區或工業區
    條號: 暫置作業規定第6點Ⅱ(五)1
    類型: note
    級別: 參考
    備註: >-
      非特定專用區、工業區者只能暫置砂石類、黏土及粉土類。申請人為營建混合物分類業者時，
      先問暫置土質是否含 B5 類。

  - id: greenbelt_agri
    名稱: 位於農業用地者 1.5 公尺隔離綠帶且面積 ≥30%
    條號: 暫置作業規定第6點Ⅱ(六)1
    類型: note
    級別: 參考
    備註: >-
      另須設 1.8 公尺以上圍籬。農業用地依農變要點§2② 認定（不含交通用地）；非農業用地（如丁種建築用地）
      不適用綠帶。可用 scripts/greenbelt_ratio.py --min-width 1.5 --ratio 0.30 --only-on 農業用地 實算。
      是否仍需農業主管機關同意，作業規定未明文，須洽該管機關。

  - id: deposit
    名稱: 保證金
    條號: 暫置作業規定第8點(三)
    類型: note
    級別: 參考
    備註: >-
      5 公頃以下新臺幣 30 萬元；超過 5 公頃每增 1 公頃加收 6 萬元，不足 1 公頃以 1 公頃計。
      內政部通知後 1 個月內繳納，逾期不予核准。

  - id: term
    名稱: 設置期限 3 年、展延 2 年以一次為限
    條號: 暫置作業規定第7點
    類型: note
    級別: 參考
    備註: 屆滿 3 個月前申請展延或提送場地復原申請；期滿須恢復原有地形地貌。

  - id: water_protection
    名稱: 自來水水質水量保護區
    條號: 自來水法§11
    類型: inquiry
    機關: 自來水法主管機關（經濟部）／自來水事業
    備註: >-
      保護區內禁止或限制傾倒、施放或棄置土石等足以污染水源水質物品（§11Ⅰ⑥），為居民生活或地方公共
      建設所必要且經主管機關核准者不在此限（§11Ⅱ）。以 ngis_sensitive.py 的 2-20 命中判定是否位於保護區。

  - id: local_ordinance
    名稱: 地方土資場自治條例是否另須申請
    條號: 各縣市土資場自治條例（臺南市：自治條例§3）
    類型: inquiry
    機關: 縣市營建剩餘土石方主管機關（臺南市工務局）
    備註: >-
      臺南市自治條例§3 定義土資場為「供營建餘土暫屯、堆置、填埋、轉運…之場所」，暫置場可能落入；
      須洽地方主管機關確認是否另依自治條例申請。如須依自治條例，該條例§19 禁止設置地區同樣適用。
