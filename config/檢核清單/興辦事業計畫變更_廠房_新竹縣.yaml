# 既核定「特定目的事業用地」擴建廠房 — 興辦事業計畫變更檢核清單（新竹縣）
#
# 案型（第六種，五格案型表未涵蓋）：土地**已編定為特定目的事業用地**（原核准興辦
#   事業計畫在案），於既有特目地上「新增廠房」擴建同一目的事業 → 走**興辦事業計畫
#   內容變更**，由目的事業主管機關同意（多以備查結案），**非再次農地變更編定**。
#   ★ 定性以主管機關函文為準（衍古臺東關山中華電信案教材：「案名寫的辦理方式≠法定
#     上該辦的方式」）。開案第一件事＝查現行編定與歷次核准函（本案已查，見下）。
#
# 首建案（2026-08-19）：新竹縣湖口鄉祥湖段41…65等12筆，新普科技股份有限公司，
#   289 其他電力設備製造業（電池組組裝）。原核准：新竹縣政府102/09/04府產商字第
#   1020126196號（興辦事業計畫核准，用途「新建營運總部」）；經濟部工業局營運總部
#   認定函100/5/26工知字第10000505540號。原案建蔽30%/容積145%（法規上限60%/180%）。
#
# 法源（皆已回官方資料庫／規則庫逐條核對，2026-08-19 掃法令檢核規則庫v9全表 181條建立）：
#   ・非都市土地使用管制規則 D0060013 §6（特目容許使用附表一）、§9附表（強度）、
#     §28/§30（變更編定應擬具興辦事業計畫）、§30-1（不得位一級環敏）、
#     §30-3（位二級環敏須說明並徵詢主管機關意見）
#   ・公路法 K0040001 §59（公路兩側禁建限建）、§30（公路用地/出入口使用許可）
#   ・出流管制計畫書與規劃書審核監督及免辦辦法 J0110108 §2
#   ・水土保持法 M0110001 §12（山坡地/森林區始須水保）
#   ・工廠管理輔導法 J0030043（工廠設立登記）
#   ・空氣污染防制法（VOCs 空污費，原核准函說明三(一)已載）
#
# ★ 與「特定工廠變更編定.yaml」區別：那條是特登工廠（105/5/20前既存未登記工廠）
#   合法化、要走農地變更＋隔離綠帶30%；本案土地2013年即合法變更為特目、非農業用地，
#   **不再觸發農地變更(FL014304§2)、不觸發新的隔離綠帶留設**。勿混用。

用途: 既核定特定目的事業用地擴建廠房（興辦事業計畫內容變更；非都市土地）
法源版本: 非都市土地使用管制規則（D0060013，115Apr現行）
法源查核日期: 2026-08-19
搭配清單: []

檢核項目:
  - id: case_definition
    名稱: 辦理定性（內容變更備查 vs 重辦變更編定）
    條號: 管制規則§28、§30；非都市土地變更編定執行要點
    類型: note
    機關: 新竹縣政府國際產業發展處（工商發展科／目的事業主管機關）
    備註: >-
      土地已編定為特定目的事業用地、原興辦事業計畫在案，新增廠房屬同一目的事業
      （289其他電力設備製造業）擴建者，原則走興辦事業計畫「內容變更」，由目的事業
      主管機關審認同意（多以備查結案，不必再辦農地變更編定）。★是否僅需備查、或
      因新增建築量體/配置變動而須重辦興辦事業計畫核准，**定性以主管機關函文為準**，
      不可憑圖資推論（衍古臺東中華電信案教訓）。開案即應向國際產業發展處確認本次
      辦理程序與所需文件。

  - id: special_purpose_use
    名稱: 特定目的事業用地容許使用相容性
    條號: 管制規則§6附表一
    類型: note
    機關: 新竹縣政府國際產業發展處
    備註: >-
      特目容許使用項目依核定之興辦事業計畫個案認定。新增廠房須落在原核定目的事業
      （289其他電力設備製造業）之使用範圍內；若廠房用途或產品類別超出原核定範圍，
      屬「原用途不同」情形，須另案重辦興辦事業計畫／變更編定，不適用內容變更備查。

  - id: intensity
    名稱: 使用強度（建蔽率／容積率）
    條號: 管制規則§9附表；原核准函府產商字第1020126196號
    類型: note
    機關: 新竹縣政府
    備註: >-
      特定目的事業用地法規上限建蔽率60%、容積率180%（原核准函載明）。原核定案僅
      建蔽30%、容積145%，尚有餘裕供新增廠房。新增後全案建蔽／容積須重新核算並仍在
      上限內，以實際配置圖與各棟樓地板面積計算為準。

  - id: env2_highway
    名稱: 第二級環境敏感地—高速公路兩側禁建限建
    條號: 管制規則§30-3；公路法§59、§30
    類型: overlay
    級別: △
    圖層: '環境敏感相關\第二級\2-30 公路兩側禁建限建地區\高速公路兩側禁建限建地區.shp'
    陳舊警告_年: 8
    機關: 交通部高速公路局／公路主管機關
    備註: >-
      基地緊鄰國道1號、經NGIS套疊100%落在高速公路兩側禁建限建地區（二級環敏）。
      依管制規則§30-3，興辦事業計畫位於第二級環境敏感地區者，應於計畫書說明並徵詢
      公路主管機關意見；新增廠房之建築位置、高度、退縮與基地出入口／側溝搭排須符合
      公路法§59禁限建範圍規定並依§30取得公路用地使用許可。★非「不可行」，屬須依
      禁限建規定設計並徵詢／取得主管機關同意之後續作業（△）。禁限建實際範圍與管制
      內容以公路主管機關公告及查復為準。

  - id: outflow_control
    名稱: 出流管制
    條號: 出流管制辦法 J0110108 §2
    類型: note
    機關: 新竹縣政府水利／建管主管機關
    備註: >-
      基地面積1.8524公頃（≥1公頃）。依§2，屬該條所列21類開發樣態且面積達1公頃以上者，
      應提出流管制計畫書。廠房興建是否落入該21類開發樣態，須依核定用途對照認定；
      落入者於建造執照核發前完成出流管制計畫書核定（或依§2但書未增加逕流量並經技師
      簽證者免提）。§2-1（新建築且全部位於都市計畫區、0.2公頃）不適用（本案非都市土地）。

  - id: eia
    名稱: 環境影響評估
    條號: 開發行為應實施環評細目及範圍 O0090012
    類型: note
    機關: 新竹縣政府環境保護局／目的事業主管機關
    備註: >-
      工廠／廠房是否應實施環評，依開發行為應實施環評細目及範圍之工業類門檻（面積、
      區位、產業別、有害物質使用等）認定。本案為既有特目地內同一產業擴建、面積
      1.85公頃，須就新增廠房之製程（電池組裝、上膠VOCs）與規模對照環評門檻確認；
      未達門檻者免環評，達門檻或位特定區位者須辦環評。→ 依規模與製程認定（△）。

  - id: air_pollution
    名稱: 空氣污染防制（VOCs 空污費）
    條號: 空氣污染防制法；原核准函說明三(一)
    類型: note
    機關: 新竹縣政府環境保護局
    備註: >-
      原核准函已載明：上膠製程涉揮發性有機物之使用，應向環保局申繳空污費。新增廠房
      同屬電池組裝製程者，比照辦理；固定污染源設置／操作許可依實際製程設備認定。

  - id: soil_water
    名稱: 水土保持（是否須水保計畫）
    條號: 水土保持法 §12
    類型: overlay
    級別: 免辦
    圖層: '環境敏感相關\第二級\2-06 山坡地 (1060531update)\BOUNDARY.shp'
    陳舊警告_年: 12
    機關: 新竹縣政府（水保主管機關）
    備註: >-
      水保法§12之對象為山坡地或森林區內土地。經NGIS與本機山坡地圖層交叉核對，
      基地不在山坡地範圍內（NGIS 0命中、本機0套疊）→ 免辦水土保持計畫。總表載明
      免辦依據即可，不為它做一頁。（基地邊界距山坡地圖層甚近，最終以鑑界為準。）

  - id: road_access
    名稱: 臨路條件
    條號: 建築技術規則、實施區域計畫地區建築管理辦法
    類型: note
    機關: 新竹縣政府建管主管機關
    備註: >-
      臨路評估（road_access LUIMAP）判為「直接臨路」，惟基地緊鄰國道1號，量得鄰接
      路寬中位數28.09m並帶「路寬量測離散(須人工覆核)」旗標——係國道路面與側車道合併
      造成之高估，不可當交付路寬。實際聯外道路寬度與已開闢情形以都市計畫圖／地籍圖
      劃設寬度＋實景判讀為準，交付一律加註「以測量及地籍鑑界結果為準」。

  - id: factory_registration
    名稱: 工廠設立登記
    條號: 工廠管理輔導法 J0030043
    類型: note
    機關: 新竹縣政府國際產業發展處
    備註: >-
      新增廠房建築完成後，其工廠之設立／變更須依工廠管理輔導法辦理工廠登記，屬興辦
      事業計畫變更核定後之後續作業（非本次障礙）。

  - id: no_agri_reconsent
    名稱: 農業主管機關同意（本案不再觸發，載明備查）
    條號: 農業主管機關同意農業用地變更使用審查作業要點 FL014304 §2
    類型: note
    機關: —
    備註: >-
      FL014304§2觸發要件為「農業用地變更為其他分區或其他用地」。本案土地已於102年
      完成農牧用地→特定目的事業用地之變更編定（原案已徵得農業主管機關同意），現況
      非農業用地，本次新增廠房不構成再次農地變更，**不再觸發農業同意**。此點與都市
      計畫農業區變更案（土地仍為農業用地、須另辦農業同意）不同，勿誤加為現行義務。
