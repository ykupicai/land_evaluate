# 寵物生命紀念設施（非都市土地 → 變更編定為特定目的事業用地；達 2 公頃者辦開發許可）
# 全國通用 — 禁止／不同意事由檢核清單（2026-10-22 建，新北萬里加投段 128-1 等 4 筆案）
#
# 法源鏈（2026-10-22 官方原文核對，存案件 法規佐證/）：
#   - 農業部 GL001615《非都市土地申請變更為寵物生命紀念設施使用興辦事業計畫審查作業要點》
#     112.07.11 訂定、115.06.15 農護字第1150072522號令修正；附件一《設置基準》以 115 修正版為準。
#     ★ 這是**中央要點**（依管制規則§30Ⅳ），全國適用；特定農業區或跨縣市由農業部審查，
#       其餘由直轄市、縣（市）政府「參照本要點」審查（第二點）。
#       衍古《縣市自治條例…》筆記曾把它記成屏東縣法規，有誤（屏東潮州案只是在屏東引用它）。
#   - 管制規則 附表一：無「寵物生命紀念設施」項目名稱，走特定目的事業用地「按特定目的事業計畫使用」；
#     殯葬用地下只有「寵物骨灰灑葬區」（≤2,500 ㎡、須與殯葬設施明顯區隔）。
#   - 管制規則 附表三：山坡地保育區、一般農業區等 → 特定目的事業用地「＋」（與原使用地類別無關）。
#   - 管制規則 §11Ⅰ⑦：達 2 公頃 → 變更為特定專用區（開發許可）；GL001615 第四點第二項同旨。
#   - 管制規則 §52-1：山坡地 ≥10 公頃（GL001615 第四點第一項第一款亦同）。
#   - 縣市專屬規定：申請前一律查該縣市是否另訂自治條例（附件一第七點「其他法律或自治條例另有規定者，
#     從其規定」）。新北市 2026-10-22 查官方法規系統無；新聞稱自治條例草案審議中，效力未明。
#
# 用法：check_zones --joined <基地.shp> --checklist _共通_農業用地變更 寵物生命紀念設施 [_共通_開發許可]
#   達 2 公頃者加跑 `_共通_開發許可`（總編§16 坡度、§17 保育區、§40 緩衝綠帶…）。
# 前例：臺南新化知母義段（評估）、臺南山上大新段（評估，剔除山坡地 3 筆降至 1.22ha 免水保）、
#       新化三子寵物天堂（都市計畫農業區容許，非本清單路徑）。
用途: 寵物生命紀念設施（非都市土地變更為特定目的事業用地）
法源版本: GL001615 115.06.15；非都市土地使用管制規則 115.05.27
法源查核日期: 2026-10-22
搭配清單: [_共通_農業用地變更]

檢核項目:
  - id: pet_zone_excluded
    名稱: 設置地點不得位於特定農業區、森林區、鄉村區
    條號: GL001615 附件一第五點
    類型: attribute
    級別: ╳
    欄位: [使分, 使用分區]
    含值: 特定農業區|森林區|鄉村區      # str.contains 正規式
    備註: >-
      115 修正版：特定農業區之殯葬用地除外。山坡地保育區、一般農業區不在排除之列。

  - id: pet_area
    名稱: 面積門檻（非山坡地 0.2 公頃／山坡地 10 公頃）
    條號: GL001615 第四點第一項第一款；管制規則§52-1
    類型: area
    級別: ╳
    非山坡地_公頃: 0.2
    山坡地_公頃: 10
    山坡地圖層: '環境敏感相關\第二級\2-06 山坡地 (1060531update)\BOUNDARY.shp'
    備註: >-
      山坡地免 10 公頃者只有：政府興辦公共設施；民間使用**殯葬用地**且經縣市政府認定具公益性。
      面積以**相連**之申請範圍登記面積計（總編§14；不相連者分塊重算）。

  - id: pet_devpermit_2ha
    名稱: 達 2 公頃須辦開發許可（使用分區變更為特定專用區）
    條號: GL001615 第四點第二項；管制規則§11Ⅰ⑦
    類型: note
    級別: △
    備註: >-
      申請面積累計達 2 公頃以上，依管制規則第三章及開發審議作業規範辦理分區變更，加跑 `_共通_開發許可`。
      開發審議作業規範無寵物專編；是否準用第六編殯葬設施須函詢內政部國土管理署。

  - id: pet_hazard_500m
    名稱: 距爆裂物、易燃氣體油料場所 500 公尺
    條號: GL001615 附件一第七點
    類型: api_distance
    級別: △
    距離_m: 500
    端點: [dis]
    備註: >-
      「設置地點」距儲存或製造爆裂物、易燃氣體油料之場所（加油站、加氣站、瓦斯行等）不得少於 500 公尺，
      自治條例另有規定者從其規定。判讀：若基地僅部分在 500 公尺內，屬**個別條件**——寵物屍體存放及
      處理設施配置於 500 公尺外即可，列 △ 並附 500 公尺外可用面積；全基地都在內才是 ╳。
      API 鄰避設施只收加油站等，瓦斯行／工廠危險物品場所須函詢消防局。

  - id: pet_school_distance
    名稱: 與學校、醫院、幼兒園保持適當距離
    條號: GL001615 附件一第六點
    類型: api_distance
    級別: 參考
    距離_m: 500
    端點: [med, edu]
    備註: >-
      要點未訂公尺數，審查口徑須函詢縣市動物保護主管單位；500 公尺僅作參考尺度（臺南市都計農業區
      作業要點草案用 500 公尺）。

  - id: pet_water_intake_1000m
    名稱: 樹葬、灑葬區距飲用水／自來水取水口 1,000 公尺
    條號: GL001615 附件一第十一、十二點
    類型: inquiry
    機關: 自來水事業機構、縣市環保局
    備註: 有規劃樹葬、灑葬區才適用；取水口點位無公開圖資，須函詢。

  - id: pet_green_20pct
    名稱: 留設綠地 ≥20%；建蔽率 ≤60%、容積率 ≤180%
    條號: GL001615 第四點第一項第二、三款
    類型: note
    備註: >-
      綠地以申請變更編定面積計；山坡地之樹葬灑葬區僅種植喬木之區域可計入。另依農變要點須留隔離綠帶
      （見 _共通_農業用地變更），開發許可另有總編§17 保育區 30%、§40 緩衝綠帶 10 公尺——三者口徑不同，
      不可互相抵充，除非審查機關同意。

  - id: pet_local_need
    名稱: 山坡地個案須評估確有地方性需求
    條號: GL001615 第八點
    類型: note
    備註: 縣市政府會勘審查時評估；計畫書須論述服務範圍內需求（寵物登記數、既有設施量）。

  - id: pet_geology
    名稱: 位於地質敏感區者須辦基地地質調查及地質安全評估
    條號: GL001615 第八點；地質法§8
    類型: note
    備註: 以 ⓪b NGIS 地質敏感區命中與否判斷；未命中免辦。

  - id: pet_road
    名稱: 應臨接道路
    條號: GL001615 第八點
    類型: note
    備註: 以臨路評估初判，路寬與是否為可指定建築線之道路須人工覆核。

  - id: pet_competent
    名稱: 主辦機關與會勘
    條號: GL001615 第二點、第八點
    類型: inquiry
    機關: 縣市政府動物保護主管單位（新北市＝農業局／動物保護防疫處，待確認）
    備註: >-
      主辦單位會同農政、建設、城鄉、地政、環保、水利、水保、民政實地會勘。縣市得調整附件三審查表
      並報農業部備查——開案先問有無調整版與自治條例。

  - id: pet_nuclear_lpz
    名稱: 核子反應器設施禁制區／低密度人口區
    條號: 核子反應器設施管制法§4
    類型: note
    備註: >-
      禁制區內禁止與核子反應器設施運轉、維護或保安無關之人員居住及影響設施安全之活動（╳）；
      低密度人口區得供民眾居住，僅新設學校、工廠、監獄、醫院、長照、老人養護安養機構須先研提配合方案
      （寵物生命紀念設施未列名；含火化爐是否被認定為「工廠」須函詢核能安全委員會）。以 NGIS 2-29＋本機
      `反應器禁制低密度人口區.shp`（TYPE 欄分禁制區／低密度人口）判定落在哪一區。
