# 養生村（私人開發；老人住宅 vs 老人福利／長照機構 兩種定位）
# 基隆市 — 山坡地保育區開發許可檢核清單（2026-10-13 建，基隆七堵自強段養生村案結案沉澱）
#
# ★ 建立前已逐條掃過法令檢核規則庫 20_規則庫 全表（195 列），本清單各項條號皆取自規則庫 rule_id。
#
# ★★ 開案第一件事＝問業主定位，兩種定位的法律路徑完全不同：
#   ┌──────────────┬────────────────────────────┬─────────────────────────────┐
#   │              │ 老人住宅（住宅社區）            │ 老人福利／長照機構（社福設施）    │
#   ├──────────────┼────────────────────────────┼─────────────────────────────┤
#   │ 分區變更門檻    │ §11 鄉村區 50 戶或 1 公頃        │ §11 其他開發 2 公頃（特定專用區） │
#   │ 山坡地十公頃     │ §52-1 無例外，須 ≥10 公頃         │ §52-1③ 經審議規範核准可免         │
#   │ 審議規範        │ 總編＋第一編住宅社區專編          │ 總編（無專編）                  │
#   │ 環評           │ 細目§25 山坡地 1 公頃即須環評     │ 規則庫未載，須函詢              │
#   └──────────────┴────────────────────────────┴─────────────────────────────┘
#   前例：基隆七堵自強段（2026-10-06，兩定位皆△，建議走老人福利／長照）；
#        衍古 004 社福機構：瑞芳九份社福（坡度、斷層）、頭重溪養生村（坡度、8 m 道路）。
#
# ⚠ 用法：與 _共通_開發許可（總編§14/§16/§17/§18/§24/§26/§40）同跑；基地含農牧、林業或
#   暫未編定（§7 比照林業）等農業用地者，再加 _共通_農業用地變更：
#     check_zones --joined <基地.shp> --checklist _共通_開發許可 _共通_農業用地變更 養生村_基隆市
# ⚠ 縣市專屬：基隆市尚無地方自訂審查規定之紀錄；他縣市沿用時改檔名並先查 LOCAL 層。
用途: 養生村（老人住宅／老人福利或長照機構）
法源版本: 非都市土地使用管制規則（現行）§7/§11/§52-1；開發審議規範 111.05.20 總編＋第一編；環評細目§25
法源查核日期: 2026-10-13
搭配清單: [_共通_開發許可]

檢核項目:
  - id: positioning
    名稱: 開發定位（老人住宅或老人福利／長照）
    條號: 管制規則§11（LUR-011）
    類型: note
    級別: △
    備註: >-
      老人住宅屬住宅社區，達 50 戶或 1 公頃須變更為鄉村區；老人福利／長照機構屬
      「其他開發」，達 2 公頃須變更為特定專用區。兩者適用的審議規範、十公頃例外、
      環評門檻皆不同（見檔頭表），簡報應分兩張總表各自判定，不可混寫成一張。
      社福身分須由社會局（社政主管機關）正式認定，計畫書自稱不算。

  - id: slope_10ha
    名稱: 山坡地開發面積不得少於十公頃
    條號: 管制規則§52-1（LUR-052-1）
    類型: note
    級別: △
    備註: >-
      興辦事業計畫土地位屬山坡地者面積不得少於 10 公頃。老人住宅定位無例外；
      老人福利／長照定位得依第三款（社會福利設施，經中央目的事業主管機關訂定之審議
      規範核准）免受限制。★面積以「相連的那一塊」計，不是清冊合計（見 _共通_開發許可
      site_contiguity）；達 10 公頃以上時，總編§16 坡度 30% 以下占比門檻改由區委會裁量。

  - id: unclassified_as_forest
    名稱: 暫未編定土地比照林業用地管制
    條號: 管制規則§7（LUR-007）
    類型: attribute
    級別: △
    欄位: [使類]
    含值: 暫未編定
    備註: >-
      山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地類別前適用林業
      用地之管制。命中者以林業用地的容許使用與變更原則判斷，且屬農變要點§2② 之農業
      用地，須加跑 _共通_農業用地變更。

  - id: housing_location
    名稱: 住宅社區開發區位五原則（僅老人住宅定位）
    條號: 審議規範第一編第一點之二（SP01-01B）
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      ①軌道或大眾運輸車站、轉運站道路距離 3 公里內 ②中小學道路距離 2 公里內 ③警察
      及消防服務範圍內 ④自來水供應範圍內 ⑤污水下水道涵蓋範圍內；申請人提出因應措施
      經區委會同意者不在此限。nlsc_facility.py 只給直線距離，**道路距離另以路網量測**
      （基隆案八堵站直線約 1.7 公里，道路距離未查）。自來水與污水須函詢事業單位。

  - id: housing_conservation_40
    名稱: 住宅社區保育區 40%（僅老人住宅定位）
    條號: 審議規範第一編第二點（SP01-02）
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      山坡地住宅社區之保育區不得小於扣除不可開發區後剩餘基地面積之 40%（嚴於總編
      §17 的 30%），且保育區 70% 以上應維持原始地形面貌。老人福利／長照定位適用總編
      §17 的 30%（見 _共通_開發許可 conservation_zone）。

  - id: housing_slope_30
    名稱: 坡度 30% 以下土地占 30% 或 3 公頃以上（僅老人住宅定位）
    條號: 審議規範第一編第三點（SP01-03）
    類型: inquiry
    機關: 內政部區域計畫委員會（審議）
    備註: >-
      坵塊圖平均坡度 30% 以下之土地應占全區 30% 以上或 3 公頃以上。評估階段以
      slope_check.py（DEM 20 m）初估，須註明「以 DEM 替代坵塊法、以實測坵塊圖為準」。
      基隆案全區 25.32%／2.91 公頃，兩條件皆未達 → 住宅定位 △。

  - id: eia_housing
    名稱: 環境影響評估（老人住宅定位）
    條號: 環評細目§25（EIA-25）
    類型: note
    級別: △
    備註: >-
      三戶以上集合住宅或社區，位於山坡地者達 1 公頃以上應實施環評；毗連土地合計逾
      1 公頃且共用公共設施系統者適用第二項累積條款。老人福利／長照機構之環評門檻
      規則庫未載，列入函詢。

  - id: eia_welfare
    名稱: 老人福利／長照機構之環評門檻與目的事業主管機關
    條號: （規則庫未載）
    類型: inquiry
    機關: 基隆市政府社會處（目的事業）；環境部（環評細目適用）
    備註: >-
      確認目的事業主管機關與適用之興辦事業計畫審查規定，並函詢環評細目適用條次。
      查得後補進法令檢核規則庫再回寫本項。
