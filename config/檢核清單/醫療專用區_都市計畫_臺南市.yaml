# 都市計畫農業區變更為醫療專用區 檢核（個案變更，非非都市土地案）
# ★與本專案先前所有案子（含容許使用案）都不同：這是「都市計畫」個案變更，
#   法規骨架不是非都市土地使用管制規則／農業用地變更審查作業要點，而是：
#   ①都市計畫農業區變更使用審議規範（FL003637，基地門檻＋規劃標準＋附帶條件母法）
#   ②都市計畫農業區保護區變更為醫療專用區回饋處理原則（FL003631，醫療專用區的
#     回饋內容細則：服務設施30%＋公益空間10%＋道路捐贈；FL003637§2「另有專門
#     變更用途審議規範者從其規定」，故本案回饋內容以FL003631為準，FL003637補其未規定事項）
#   ③★農業主管機關同意農業用地變更使用審查作業要點（FL014304，農業部）——
#     **2026-08-07 補列**：初版清單完全漏了這部。§2(三)明文「都市計畫農業區、保護區
#     農業用地劃定或變更為非農業使用」須徵得農業主管機關同意，§8「都市計畫農業區、
#     保護區農業用地，除直轄市或縣（市）主管機關另定有限制條件外，應依本要點規定
#     辦理」。**都市計畫個案變更不是只走內政部那條線**，農業端另有獨立的同意程序。
#   （2026-08-06 安南公塭段303-1等4筆案首次建立；2026-08-07 依該案人工修正版回頭
#   補正，補列項目均已於官方資料庫逐條查證，見各項「查證」欄）
用途: 都市計畫農業區變更醫療專用區
法源版本: 都市計畫農業區變更使用審議規範107.01.25修正＋都市計畫農業區保護區變更為醫療專用區回饋處理原則93.02.19修正＋農業主管機關同意農業用地變更使用審查作業要點
法源查核日期: 2026-08-07

檢核項目:
  - id: moa_consent
    名稱: 農業主管機關同意（農業用地變更）
    條號: 農變要點FL014304§2(三)、§8
    類型: note
    級別: 參考
    備註: >-
      ★本項為2026-08-07補列，初版清單漏列。要點§2：「農業用地變更使用，屬下列情形
      之一者，應徵得農業主管機關同意：……(三)都市計畫農業區、保護區農業用地劃定或
      變更為非農業使用。」§8：「都市計畫農業區、保護區農業用地，除直轄市或縣（市）
      主管機關另定有限制條件外，應依本要點規定辦理。」→ 都市計畫農業區變更案除了走
      內政部審議規範，**另須向農業主管機關（臺南市政府農業局）取得同意**，實務上以
      撰寫「農業用地變更使用說明書」提出。此為與內政部審議並行的獨立程序，不可省略。
    查證: 農業部主管法規共用系統 FL014304 全文（2026-08-07 下載原文逐條核對）

  - id: moa_greenbelt
    名稱: 隔離綠帶或設施（農變要點側）
    條號: 農變要點FL014304§9、§10、§11；與審議規範FL003637§26併存
    類型: note
    級別: 參考
    備註: >-
      ★2026-08-07補列，**且適用性尚待使用者定案，不可逕行認定有或沒有**。
      要點§8既已把都市計畫農業區納入本要點適用範圍，§9「變更農業用地作與農業生產
      性質不相容之目的事業使用者，應配置適當寬度之隔離綠帶或設施」原則上及於本類
      案件，最小寬度1.5公尺（地方另定較大者從其規定）。
      ⚠ 但§10「各不同使用分區於毗鄰農業用地之區位應配置之隔離綠帶或設施寬度」
      逐款列舉者為（一）特定農業區（二）一般農業區（三）農村社區土地重劃
      （四）森林區、山坡地保育區、特定專用區（五）經行政院核定之輔導方案——
      **未列都市計畫農業區**，故「面積不得少於申請事業面積30%」該款無對應款次可套用，
      是否適用有解釋空間。
      另審議規範FL003637§26另有「毗鄰外側土地應設置隔離綠地或退縮建築10公尺以上」
      之規定，與本項屬**兩套併存**要求，理論上取較嚴者。
      → **開案時應向臺南市政府農業局查明30%面積比是否適用**，不要自行假定。
    查證: FL014304§9/§10/§11 全文（2026-08-07 下載原文逐字核對，§10確認未列都市計畫農業區）

  - id: urgent_change
    名稱: 變更程序（都市計畫法§27）
    條號: 都市計畫法§27；審議規範FL003637§3
    類型: note
    級別: 參考
    備註: >-
      ★2026-08-07補列。審議規範§3明文「申請人應檢具土地使用同意書及變更都市計畫
      書圖，報請政府查核無誤後**依都市計畫法第27條辦理**」——個案變更的程序容器就是
      都計法§27。§27Ⅰ③「為配合中央、直轄市或縣（市）興建之重大設施時」得迅行變更，
      是醫療等公益設施案常走的論述路徑。實務建議：申請變更前先取得目的事業主管機關
      （衛生局）同意文件，並同步向市府函詢取得重大建設認定之可行性。
    查證: 內政部主管法規共用系統 FL003637§3 原文（2026-08-07）

  - id: eia_threshold
    名稱: 環境影響評估
    條號: 開發行為應實施環境影響評估細目及範圍認定標準（O0090012）§24
    類型: note
    級別: 參考
    備註: >-
      ★2026-08-07補列。§24：醫院之興建或擴建，位於下列特定區位之一者應實施環評——
      國家公園／野生動物保護區或重要棲息環境／重要濕地／臺灣沿海地區自然環境保護
      計畫核定公告之自然保護區／自來水水質水量保護區／海拔1,500公尺以上／山坡地或
      沿海保護區且面積達1公頃以上／特定農業區農業用地且面積達1公頃以上；**或申請
      開發（含累積開發）面積達5公頃以上者**。護理機構等準用部分款次。
      → 本類案件務必與 prohibited_zones／water_source_zone 兩項一併判斷：那兩項的
      區位命中同時也是環評觸發條件，不是各自獨立的檢核。
    查證: 全國法規資料庫 O0090012§24（2026-08-07）

  - id: runoff_control
    名稱: 出流管制（★都市計畫區有第二條門檻，不可只查用途別）
    條號: 出流管制計畫書與規劃書審核監督及免辦認定辦法（J0110108）§2Ⅰ⑬、§2-1
    類型: note
    級別: 參考
    備註: >-
      ★2026-08-07補列。**兩條門檻擇一觸發即為義務人，都市計畫案最常漏掉後者**：
      ①§2Ⅰ⑬：「醫院、護理機構、老人福利機構及長期照顧服務機構之開發」面積達
      **1公頃**以上者，應提出出流管制計畫書並取得核定函後始得開工。
      ②§2-1Ⅰ：土地開發利用屬建築法§9①前段所稱**新建造之建築物且基地全部位於
      都市計畫區內，面積達0.2公頃**以上者，同樣應提出計畫書並取得核定函。
      → 都市計畫個案變更案基地幾乎必然「全部位於都市計畫區內」，只要新建建築且
      基地達0.2公頃就落入§2-1，**不能因為未達§2的1公頃就寫「免辦」**。
      §2-1Ⅱ：面積未達1公頃且已辦理（一）雨水流出抑制措施或（二）貯滯（留）容量
      每公頃≥675立方公尺者，**得免提出流管制計畫書**，但須於建造執照核發前備妥
      證明文件供市府備查——是「有條件免提計畫書」，不是「無事可辦」。
      ⚠ 「免提計畫書」與「取得核定函」互斥，交付文字不可同時出現。
    查證: 全國法規資料庫 J0110108§2、§2-1 全文（2026-08-07 下載原文逐字核對）
  - id: min_area
    名稱: 最小面積門檻
    條號: FL003637§12Ⅰ
    類型: note
    級別: 參考
    備註: >-
      直轄市計畫最小面積3公頃（30,000㎡）。本案4筆合計登記面積僅5,477.14㎡
      （0.5477公頃），為門檻之18.3%，遠低於一般門檻。須靠下列兩條例外路徑之一：
      ①§2-1③目的事業主管機關（衛生主管機關）同意興辦醫療照顧服務，都委會得不受
      本規範全部或一部限制（含面積門檻）；②§12Ⅱ面積例外之「已發展或規劃為發展區
      所包圍」——本案基地緊鄰主要計畫道路用地(0公尺)、19.7公尺內為住宅區、周邊另有
      公園、兒童遊樂場用地，具備已發展地區包圍之事實基礎。兩條路徑均需都委會個案
      審決，非申請人單方可確定，是本案最大不確定性來源。

  - id: connecting_width
    名稱: 連接寬度
    條號: FL003637§13
    類型: note
    級別: 參考
    備註: 應完整連接，連接部分最小寬度≥30公尺；為既成道路或都市計畫道路分隔者視同完整連接。4筆地號相互關係與連接寬度待圖面確認。

  - id: access_road
    名稱: 聯外道路8公尺
    條號: FL003637§14；回饋處理原則貳
    類型: note
    級別: 參考
    備註: >-
      應臨接或設置8公尺以上聯外道路。都市計畫圖顯示基地緊鄰「主要計畫道路用地」
      （0公尺），但國土利用調查(LUIMAP)現況判讀為「不臨路」——研判該計畫道路屬
      **已規劃但尚未闢建**之道路儲備用地。依回饋處理原則貳：「聯外出入道路應劃設
      為都市計畫道路用地，完成後捐贈予當地政府」，即本類案件慣例由申請人自行闢建
      並捐贈，非現況須已具備。須查明該計畫道路之規劃寬度是否≥8公尺。

  - id: prohibited_zones
    名稱: 禁止開發區位
    條號: FL003637§15、§19
    類型: note
    級別: 參考
    備註: >-
      不得位於重要水庫集水區（供民生用水或集水區>50平方公里）；海岸管制區/山地
      管制區/重要軍事設施管制區/要塞堡壘地帶者審議時應先徵詢主管機關意見。安南區
      為臺南市市郊平地聚落，初判不涉重要水庫集水區；軍事管制區等待查證。

  - id: water_source_zone
    名稱: 自來水水質水量保護區
    條號: FL003637§16、§18
    類型: note
    級別: 參考
    備註: >-
      承受水體未達公告水質標準、或超過管制總量、或水利機關認為河防安全堪虞者不得
      開發；未公告保護區者距豐水期水體1,000公尺內原則禁止開發。基地緊鄰河川區
      （68.6公尺，經濟部水利署第六河川局管理），須查明鹿耳門溪或附近水系是否屬
      自來水水質水量保護區範圍。

  - id: greenbelt_setback
    名稱: 隔離綠地或退縮建築10公尺
    條號: FL003637§26
    類型: note
    級別: 參考
    備註: >-
      範圍毗鄰外側土地除面臨具隔離功能之公共水域或永久性公共綠地外，應設置隔離
      綠地或退縮建築，距離須在10公尺以上。★使用者指定本案評估不出綠帶圖，本項僅
      列文字提醒，不產圖層；正式送審階段仍須落實。

  - id: drainage_detention
    名稱: 排水滯洪
    條號: FL003637§22-1
    類型: note
    級別: 參考
    備註: 開發後25年重現期暴雨對外逕流量不得超出開發前，並以100年重現期暴雨強度提供滯洪設施；逕流量計算應經技師簽證。

  - id: public_facility_ratio
    名稱: 公共設施與回饋比例（醫療專用區専則優先適用）
    條號: 回饋處理原則參、肆；FL003637§34、§36作為未規定事項之補充
    類型: note
    級別: 參考
    備註: >-
      依回饋處理原則（醫療專用區専則，優先於FL003637同類規定）：①必要性服務設施
      面積≥申請變更土地總面積30%；②聯外道路劃設為都市計畫道路用地並於完成後捐贈；
      ③公園/體育場所/綠地等合計≥申請變更總面積10%；④室內公益性空間≥建物總樓地板
      面積10%，供地方政府作公共衛生/教育/文化活動使用。FL003637§34（公設+代用地
      ≥40%）、§36（公園綠地≥10%）於回饋處理原則未規定事項範圍內仍可能補充適用，
      實際比例組合待都委會審議定案。

  - id: building_intensity
    名稱: 建蔽率容積率上限
    條號: FL003637§39
    類型: note
    級別: 參考
    備註: 原始地形平均坡度≥15%者建蔽率≤40%、容積率≤100%；其餘（本案安南區平地應屬此類）建蔽率≤50%、容積率≤200%。提供公設超過最低比例者容積率得酌提，提高部分≤上限20%。

  - id: procedure
    名稱: 審議與協議程序
    條號: FL003637§3～§7、§42、§44～§45、§50
    類型: note
    級別: 參考
    備註: >-
      須先取得目的事業主管機關（衛生主管機關）同意→備土地使用同意書＋變更計畫書圖
      →市府查核→公展及說明會→市都委會審議→報內政部核定→都委會通過後與市府簽訂
      協議書→取得開發許可後申領雜項執照→完成公設興闢移交及捐贈土地移轉登記完成→
      始得申領建造執照。違反協議書：廢止開發許可、限期變更回原分區、已捐贈土地與
      現金不予發還（三支箭效力，§45＋§50）。

  - id: ownership_consent
    名稱: 土地使用同意書＋目的事業主管機關核准（★同一條兩件事）
    條號: FL003637§3
    類型: note
    級別: 參考
    備註: >-
      §3原文含**兩件事**，初版清單只寫了前半（2026-08-07 補正）：
      ①「申請人應檢具土地使用同意書及變更都市計畫書圖，報請政府查核無誤後依都市
      計畫法第27條辦理」——全體土地所有權人之土地使用同意書；
      ②「**必要時應先經目的事業主管機關核准**」——申請人擬舉辦之事業依規定須經
      各該目的事業主管機關核准者（醫療案＝衛生主管機關），應先徵得同意後辦理。
      ②這半在醫療專用區案是**前置關鍵**，因為§2-1③的面積門檻排除條款正是以
      「目的事業主管機關同意興辦醫療照顧服務」為要件，兩者是同一份同意函。
      權屬部分：本案4筆地號皆推論私有、未列於公有土地名冊，實際所有權人待調閱謄本覆核。
    查證: 內政部主管法規共用系統 FL003637§3 原文（2026-08-07）
