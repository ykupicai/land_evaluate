# 獨立儲能設備（表前／電網級）申請變更編定為特定目的事業用地 — 嘉義縣
#
# 法源（皆已回官方資料庫核對，2026-07-31 布袋考試潭段306 案建立）：
#   ① 農業主管機關同意農業用地變更使用審查作業要點（FL014304，111.03.17 農企字第1110012296號令）
#      → 全文已下載存證：outputs/20260731_布袋考試潭段306/法源_農地變更要點全文_20260731.txt
#   ② 非都市土地變更編定執行要點（FL003207，110.07.15）§8① 特定目的事業用地
#   ③ 非都市土地使用管制規則（D0060013）§30（興辦事業計畫）、§30-1／§30-3（環境敏感地區）
#   ④ 再生能源發展條例（J0130032）— 儲能設備之法定定義
#
# ★ 使用方式：一律搭配 `_共通_農業用地變更` 一起跑（要點§2② 農牧用地變更為其他使用地
#   類別即須徵得農業主管機關同意，特農區／養殖漁業生產區之不同意事由會實質進來）
用途: 獨立儲能設備變更編定為特定目的事業用地（非都市土地農業用地）
法源版本: 農地變更要點 FL014304（111.03.17）＋ 非都市土地變更編定執行要點 FL003207（110.07.15）
法源查核日期: 2026-08-01
搭配清單: [_共通_農業用地變更]

# ── 為什麼要點§7-1「光電未達2公頃不同意」不適用（★換案沿用前先讀這段）──────────
#   §7-1 條文主語為「變更作**太陽光電設施**使用」。三項獨立依據支持儲能設備不在其列：
#     (a) §7 第六款把「共同升壓站**及儲能設備**」與太陽光電設施**並列**為不同類別；
#         若儲能已被涵蓋於「太陽光電設施」，該款無須另行列舉。
#     (b) 再生能源發展條例定義「儲能設備」＝儲存電能並穩定電力系統之設備（含儲能元件、
#         功率轉換及能源管理系統），與「再生能源發電設備」為**分列之定義**。
#     (c) 太陽光電要點（FL060265）§2 定義太陽光電發電設施＝太陽光電模組、變流器、
#         電力網設備及線路，**未含儲能設備**。
#   ⚠ 使用者（空間規劃專業）2026-07-31 確認：**經濟部已同意儲能設備得直接循農業用地
#     變更為特定目的事業用地；農地變更要點之太陽光電相關限制係針對光電板，
#     升壓站、儲能設備等其餘設施不在此限。** → 函文文號待補，補到後填入下方 id: pv_threshold_na。
#   ⚠ 但這**不表示沒有面積門檻風險**：若個案之儲能設備被主管機關認定為某光電案之
#     附屬設施而併同審查，仍可能回頭適用§7-1。**獨立儲能／光電附屬要在計畫書中講清楚。**
#
# ── 數值型必備條件（依基地面積實算，出簡報逐項核對）──────────────────────
#   隔離綠帶（一般農業區、變更作「其他使用」）：§10(二)3
#     「得配合土地規劃配置，其面積**不得少於申請事業面積之百分之三十**」
#     最小寬度：§9(二)＋§10末項 **至少 1.5 公尺**
#     配置區位：§9(一) **應與毗鄰農業用地相緊臨** → greenbelt_ratio.py 一律帶 --only-on 農業用地
#     ⚠ 特定農業區為§10(一)3（同 30%）；工業區／科學園區用途才是固定寬度（一般農業區20m）
#   隔離設施之認定：§11 可含**通路、水路、空地、廣場、平面停車場、開放球場、蓄水池及滯洪池**
#     → 低窪地案件之滯洪／調節池得計入綠帶面積，與防洪需求整合設計（前例 306-1 留調節池）
#   ⚠ §9(二)但書授權地方政府另定大於 1.5 公尺之規定 → **嘉義縣是否另有規定須函詢確認**

檢核項目:
  # ★★ 本清單最重要的一項：儲能設備未被執行要點列舉，是本類案件的核心程序風險
  - id: spl_route_enumeration
    名稱: 特定目的事業用地之受理限制與能源設施列舉
    條號: 非都市土地變更編定執行要點§8①、§8①第四款
    類型: inquiry
    機關: 嘉義縣政府地政處（受理）／經濟部能源署（目的事業主管機關）
    級別: △
    備註: >-
      §8① 逐字：「申請變更編定為特定目的事業用地，以各該使用區**無其他適當使用地可
      變更編定者為限**，且**以政府機關或公營事業機構興辦者為主**。」
      第四款列舉之能源設施為「發電廠、變電所、配電中心、輸配電鐵塔、油庫、輸油(氣)設施、
      液化石油氣分裝場、天然氣貯存槽、加油站、加氣站、加壓站、整壓站、配氣站及計量站
      **等設施**」——**未列舉儲能設備**（該要點最後修正 110.07.15，早於併網型儲能政策）。
      → 兩項須處理：①儲能設備須經主管機關納入「等設施」之概括解釋
      ②私人興辦者非§8①「為主」之情形，須在興辦事業計畫中強化
      「無其他適當使用地可變更編定」之論證。
      ★前例可援引：同段 306-1（匯盟能源，私人）2023-04-10 已核准變更為特定目的事業用地，
      係以**共同升壓站＝「變電所」**落入列舉而過關。儲能設備無此對應項目，
      故本案的解釋負擔高於該前例，不可直接類推「私人也過了」。

  - id: pv_threshold_na
    名稱: 要點§7-1 太陽光電未達2公頃不同意之不適用認定
    條號: 農地變更要點§7-1、§7①六、再生能源發展條例
    類型: inquiry
    機關: 經濟部能源署／嘉義縣政府農業處
    級別: 參考
    備註: >-
      本案為**獨立儲能設備**（非太陽光電設施），依§7①六與再生能源發展條例之分列定義，
      §7-1「農牧用地變更作太陽光電設施使用未達二公頃不同意」不適用。
      ★**本項無可引之函文文號**（使用者 2026-08-01 確認經濟部係以實務見解同意儲能循
      農業用地變更為特定目的事業用地，未發布可citable之令函）→ **論證一律回條文本身**：
      ①§7①六將「共同升壓站及儲能設備」與太陽光電設施**並列**為不同類別，若儲能已被
      涵蓋於「太陽光電設施」則該款無須另行列舉；②再生能源發展條例將「儲能設備」與
      「再生能源發電設備」**分別定義**；③太陽光電要點（FL060265）§2 之太陽光電發電設施
      定義為模組、變流器、電力網設備及線路，**未含儲能設備**。
      交付文字寫「請目的事業主管機關於評估意見中確認本點不適用」，
      **不要寫「檢附函文」**（無此文件，寫了會被要求補件）。
      ⚠ 若個案被認定為光電案之附屬設施併同審查，須改依§7-1 檢視但書
      ①零星夾雜（用 adjacent_landuse.py 實算緊鄰宗地）
      ②109.07.31 前台電併聯審查意見書或行政院核定「109年太陽光電6.5GW達標計畫」列管。

  - id: irreplaceability
    名稱: 區位、面積之必要性、合理性及無可替代性
    條號: 農地變更要點§3①九、§4、§5①六
    類型: inquiry
    機關: 經濟部能源署（目的事業主管機關）
    級別: ╳
    備註: >-
      **本案最重的論述負擔，且§5①六明定「目的事業主管機關未提出評估意見或未表示支持
      意見」即不同意變更使用**——這是唯一會因「沒拿到文件」而直接變成不同意的款。
      逆風：經濟部併網型儲能規範明示**優先輔導設置於工業區廠房設施、工業用地、
      科技園區、都市計畫工業區及其他既有特定目的事業用地**。落在農牧用地者
      必須正面回應「為何不能設在工業區」（併網點距離、饋線容量、台電變電所位置、
      土地取得可行性），並取得能源署具體支持意見。
      本案有利事實：西側 161 縣道 → 嘉22 → 台19 → **台電義竹變電所**之併網路徑，
      且同段 306-1 已為共同升壓站用地（併網基礎設施既成）。

  - id: irrigation_channel
    名稱: 農田水利灌溉／排水渠道距離
    條號: 農地變更要點§5①二
    類型: distance
    級別: △
    距離_m: 30
    圖層:
      - '2021全台農田水利灌排\農田\灌溉渠道.shp'
      - '2021全台農田水利灌排\農田\排水渠道.shp'
    編碼: big5
    陳舊警告_年: 8
    備註: >-
      農業部農田水利署灌排渠道（LineString、EPSG:3826、dbf 為 Big5）。
      ⚠ 資料夾名為「2021全台農田水利灌排」，但 `ymd` 欄顯示製作日為 **2018-04-30**，
      引用年度以 2018 為準，不可寫 2021。
      本項只給「30 公尺內有無」與最近距離；**渠道名稱、等級與主管工作站**要跑
      `make_extra_maps.py --theme 灌排水道`（有涉及才出圖，產
      `灌排水道涉及清單.csv`：類別／渠道名稱／等級／距基地_m／管理處／工作站）。
      涉及者即須於申請前取得該管農田水利署（工作站）之審查意見——§5①二 是
      **不同意變更事由**，非成本問題。

  - id: no_consent_grounds
    名稱: 農地變更要點第五點各款（不同意變更之七款）
    條號: 農地變更要點§5
    類型: inquiry
    機關: 嘉義縣政府農業處／農業部農田水利署
    級別: ╳
    備註: >-
      逐款檢核，其中對本案最實質者：
      §5①一 未依規定規劃設置隔離綠帶或設施（→ greenbelt_ratio.py 實算 30%／1.5m）
      **§5①二 使用具農業灌溉功能之系統作廢污水排放，或有妨礙上下游農業灌排水系統
      輸水能力之虞**——布袋沿海魚塭密集、灌排渠道綿密，**基地緊鄰水利用地者務必先取得
      農田水利署（嘉南農田水利署）審查意見**（安定案即卡此款）
      §5①三 申請範圍內夾雜未申請變更之農業用地且妨礙其農業經營
      §5①四 妨礙原有區域性農路通行（→ road_access.py 臨路與農路判定）
      §5①五 部分土地分割致坵塊零碎不利農業經營（本案 1 筆整宗申請，若整筆變更則不涉）
      §5①六 見 irreplaceability

  - id: adjacent_farmland
    名稱: 緊鄰宗地使用地組成（綠帶留設側與夾雜判定之依據）
    條號: 農地變更要點§9①、§5①三
    類型: inquiry
    機關: 本機實算（scripts/adjacent_landuse.py）
    級別: 參考
    備註: >-
      跑 `python scripts/adjacent_landuse.py --joined <shp>`：輸出緊鄰／30／60／100 公尺
      分級之使用地類別組成與建築用地筆數。用途有三：
      ①決定隔離綠帶應留設側（農業用地＝農牧、養殖、水利、林業、生態保護、國土保安六類；
        **交通用地（農路）與未登錄地不在其列，該側不必留設**）
      ②§5①三「夾雜妨礙農業經營」之事實基礎
      ③若日後改依§7-1 審查，其但書①「為自然地形或其他非農業用地所包圍、夾雜之零星
        農業用地」之實算依據。★本案東側 306-1 已編為**特定目的事業用地（非農業用地）**，
        對但書①之主張有利。
      副產物「緊鄰水利用地筆數」直接對應§5①二農業灌排風險。

  - id: first_level_env
    名稱: 第一級環境敏感地區（興辦事業計畫不得位於）
    條號: 非都市土地使用管制規則§30-1
    類型: inquiry
    機關: 嘉義縣政府（TCDGIS 環敏套疊分析）
    級別: ╳
    備註: >-
      §30-1：依§30 擬具之興辦事業計畫**不得位於區域計畫規定之第一級環境敏感地區**
      （五類例外詳該條）。以 TCDGIS 環境敏感地區套疊分析（53 項）之結果為準，
      並以本機圖資交叉核對——**安南案實例：平台 53 項全報無套疊，本機另查出 3 項真限制**
      （地下水管制區第二級、淹水潛勢兩項），故平台與本機兩份都要看。
      §30-2：範圍內夾雜第一級環敏之零星地得納入之條件另有規定。

  - id: subsidence
    名稱: 嚴重地層下陷地區（第二級環境敏感）
    條號: 非都市土地使用管制規則§30-3
    類型: overlay
    級別: △
    圖層: '環境敏感相關\第二級\2-03 嚴重地層下陷地區(941215update)\941215嘉義all_1.shp'
    陳舊警告_年: 20
    備註: >-
      §30-3：興辦事業計畫位於**第二級環境敏感地區**者，應**說明**如何防範及補救可能之
      不良影響（非禁止，屬說明義務）。
      ⚠ **圖資為民國94年12月15日公告版，已 20 年**。前例 306-1 之處理方式（可沿用）：
      該筆記載「屬嚴重地層下陷地區（**106-08-30 公告已廢止但仍列全國區域計畫敏感區位**）」
      → 即公告雖廢止，全國區域計畫仍列為敏感區位，實務上仍須逐項說明防範補救措施。
      **引用前務必回查最新公告狀態，不可逕以本圖資年度作結論。**
      前例並以航測學會函（111-09-13 航測會字第1119038690號）確認無涉第一級。

  - id: flood_potential
    名稱: 淹水潛勢（24hr 500mm）／低窪地填土
    條號: 非都市土地使用管制規則§30-3、出流管制辦法§2-1Ⅱ
    類型: overlay
    級別: △
    圖層: '環境敏感相關\第二級\淹水潛勢\{county}\q_24hr500.shp'
    陳舊警告_年: 12
    備註: >-
      ⚠ 淹水潛勢 shp **無 .prj**，讀取須 set_crs(3826)；`type` 欄為深度分級字串。
      ⚠ **平台面積與本機不一致時先想「平台圖層定義可能有門檻」**——西港案實例：
      平台計 2,711.74 ㎡＝本機**深度 ≥0.3m 的部分**，基地其實 100% 在潛勢範圍內，
      只是 16.4% 屬 0-0.3m 級。
      本案面積 <1 公頃 → 依出流管制辦法§2-1Ⅱ **免提出流管制計畫**（總表載明免辦依據給 ○）。
      ⚠ **但「免辦出流管制」不等於「不必談防洪」**：前例 306-1 之審查要求為
      「基地低於路面近 2 米，須提填土整地工程、合法土方來源證明、土方量（約 6,112 m³）、
      運土路線與交維計畫；北側留設調節池防洪」。本案為同一水池、同一地主之相鄰宗地，
      **低窪填土與滯洪應比照辦理**；滯洪池依要點§11 得計入隔離綠帶面積。

