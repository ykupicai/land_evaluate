      布袋考試潭段306 實測：**未觸及，最近 2,037 m**（2026-07-31）。
      ⚠ 若日後案件確實落在生產區內，§7①六「可優先推動漁業經營結合綠能之區位範圍內
      共同升壓站**及儲能設備**之所需用地」是儲能案的**專屬例外**，可主張。

