# 都市計畫農業區變更為住宅區 檢核（個案變更，非非都市土地案）
# ★2026-08-06 使用者提供關鍵修正：善化區「另訂有審議規範或處理原則」成立——
#   善化都市計畫（配合「變更善化主要計畫」）有地方専屬的農業區變更指導原則
#   （使用者口述四點，正式名稱/文號待確認），依FL003637§2優先適用，FL003637
#   未規定事項（面積門檻、禁止區位、水源保護區、隔離綠地、排水滯洪、建蔽容積、
#   協議書鏈等）仍補充適用。與醫療専用區案（FL003631専則）同一種法源疊法，
#   差別在善化這份是地方指導原則、非全國性法規，查不到pcode，只能問當地或市府。
#   ⚠ 這份指導原則的交通條件（15公尺路寬／100公尺連接）遠嚴於FL003637§13/§14
#   （30公尺連接寬度／8公尺聯外道路），送審規劃務必以善化専屬版為準，不可誤用
#   FL003637通用門檻低估風險。
#   （衍古有兩件同案型先例：善化圳西段、都會公園農5農6(富立)，皆未見引用此份
#   地方指導原則之逐條內容，可能因兩案面積遠超門檻、或指導原則另案未收錄——
#   結案時應補寫回衍古71層筆記）
用途: 都市計畫農業區變更住宅區
法源版本: 都市計畫農業區變更使用審議規範107.01.25修正
法源查核日期: 2026-08-06

檢核項目:
  - id: agri_authority_consent
    名稱: 農業主管機關同意（善化専屬指導原則①，優先於FL003637通用程序）
    條號: 變更善化主要計畫－農業區變更指導原則①（使用者2026-08-06提供，正式名稱/文號待確認）
    類型: note
    級別: 參考
    備註: 申請變更基地應取得臺南市農業主管機關同意，此為善化専屬前置要件，早於FL003637§3的一般程序（目的事業主管機關同意／土地使用同意書）。應及早洽詢臺南市農業局取得同意文件，作為後續程序啟動前提。

  - id: location_priority
    名稱: 區位優先條件（善化専屬指導原則②）
    條號: 變更善化主要計畫－農業區變更指導原則②（使用者2026-08-06提供，正式名稱/文號待確認）
    類型: note
    級別: 參考
    備註: >-
      申請變更基地應以鄰近已發展地區、或距離主要公共設施（鐵路車站/區公所/學校等）
      1,500公尺範圍內為優先，以使變更後住宅用地滿足居住需求並提升土地利用效益，
      避免零星變更。與FL003637§12Ⅱ④「已發展或規劃為發展區所包圍」的面積門檻
      例外精神類似但性質不同——這是善化対所有變更案的優先性條件，非僅面積不足
      時才適用的例外。基地與鐵路車站/區公所/學校的距離待實測核對。

  - id: min_area
    名稱: 最小面積門檻
    條號: FL003637§12Ⅰ
    類型: note
    級別: 參考
    備註: >-
      直轄市/省轄市/縣轄市計畫門檻3公頃；鄉街/鎮/特定區計畫門檻5公頃。本案64筆
      合計登記面積31,508.60㎡（3.1509公頃）——過3公頃門檻但不足5公頃門檻，究竟
      適用哪一檔取決於善化都市計畫核定當時的計畫層級（使用者初判屬市鎮計畫性質，
      確切級距待送審前向臺南市都發局正式確認）。若適用5公頃門檻，須靠§12Ⅱ四款
      例外（中央機關同意／自然地形阻隔／8m以上道路阻隔／已發展地區包圍）或§2-1
      五款排除條款之一才能成立。

  - id: access_road_shanhua
    名稱: 交通條件（善化専屬指導原則③，取代FL003637§13/§14通用門檻）
    條號: 變更善化主要計畫－農業區變更指導原則③（使用者2026-08-06提供，正式名稱/文號待確認）；FL003637§13（連接寬度≥30m）／§14（聯外道路≥8m）為一般門檻，善化専屬版更嚴，優先適用
    類型: note
    級別: 參考
    備註: >-
      善化専屬版要求「應連接都市計畫區內寬度15公尺以上計畫道路，連接部分不小於
      100公尺，且應完整連接」——遠嚴於FL003637通用門檻（連接寬度30公尺、聯外
      道路8公尺）。②c臨路評估（2026-08-06修正road_access.py分類關鍵字漏接
      「省道」「國道」等單字結尾路名之bug後重跑）確認基地東側**直接臨路，距離
      0公尺，緊鄰省道**，惟Ⓑ逐案場統計實算**鄰接路寬中位數13.74公尺**（依
      LUIMAP國土利用調查判讀，非官方測量寬度）——**略低於善化専屬版15公尺
      門檻**，須以官方道路資料或現場實測覆核，不可逕以省道通常較寬而假設過關；
      連接部分之長度是否達100公尺亦待實測（連接部分＝基地與省道邊界共同接觸
      的長度，非路寬本身）。

  - id: prohibited_zones
    名稱: 禁止開發區位
    條號: FL003637§15、§19
    類型: note
    級別: 參考
    備註: >-
      不得位於重要水庫集水區；海岸/山地管制區、重要軍事設施管制區、要塞堡壘地帶
      者應先徵詢主管機關意見。⓪b環敏NGIS 54圖層套疊0命中，屬初步篩選結果，
      NGIS涵蓋落差非0即代表真的無涉及，正式送審仍須函詢主管機關確認。

  - id: water_source_zone
    名稱: 自來水水質水量保護區
    條號: FL003637§16、§18
    類型: note
    級別: 參考
    備註: 未公告保護區者距豐水期水體1,000公尺內原則禁止開發；基地鄰近水系（如有）須查明是否屬保護區範圍。

  - id: greenbelt_setback
    名稱: 隔離綠地或退縮建築10公尺
    條號: FL003637§26
    類型: note
    級別: 參考
    備註: 範圍毗鄰外側土地除面臨具隔離功能之公共水域或永久性公共綠地外，應設置隔離綠地或退縮建築，距離須在10公尺以上。

  - id: drainage_detention
    名稱: 排水滯洪
    條號: FL003637§22-1
    類型: note
    級別: 參考
    備註: >-
      開發後25年重現期暴雨對外逕流量不得超出開發前，並以100年重現期暴雨強度提供
      滯洪設施；逕流量計算應經技師簽證。依出流管制辦法§2-1Ⅱ，須於核定前（非送審
      補件時）取得主管機關核定之出流管制規劃書（善化圳西段案前例：此文件是關鍵
      路徑，非計畫書寫得好就能加速）。

  - id: public_facility_ratio
    名稱: 公共設施與代用地比例（善化専屬指導原則④取代/加嚴FL003637§36部分）
    條號: 變更善化主要計畫－農業區變更指導原則④（使用者2026-08-06提供，正式名稱/文號待確認）；FL003637§34（公設+代用地≥40%）、§30（社區商業≤10%）補充適用
    類型: note
    級別: 參考
    備註: >-
      善化専屬版④A：公園/綠地/廣場/兒童遊樂場等公共設施用地不得低於申請變更
      面積**15%**（非FL003637§36通用的10%，明訂目的為彌補善化都市計畫區5項
      公共設施不足）。④B：FL003637應劃設之公設及公用設備用地及代用地，應優先
      配合善化重大建設所需，如與現有公園綠地整合擴大效益、或代用地配合社區
      照護／長照等發展需求配置——這是配置優先順序的額外規定，非取代FL003637
      §34（公設+代用地合計≥40%，代用地≥5%）本身，該項門檻仍補充適用。善化
      圳西段先例：實設公設32.70%＋代用地補足40%，委員仍反覆要求敘明代用地
      面積、區位及後續供作社會住宅之構想——公設比看起來不足時先確認有沒有
      代用地，不要誤判為不符規定；本案另須額外核對15%公園綠地類門檻與社區
      照護/長照配置可能性。

  - id: population_justification
    名稱: 人口與供需論證（審議實務死穴，非條文本身）
    條號: FL003637整體立法目的
    類型: note
    級別: 參考
    備註: >-
      衍古兩件善化同案型先例（圳西段、都會公園富立）皆顯示：委員會質疑「現況人口
      已超過/接近計畫人口、住宅區使用率已達高比例，為何還需要更多住宅區」，並要求
      補充鄰近都市計畫已釋出腹地之供需分析，避免供需失衡與蛙躍式發展。本案應及早
      準備善化都市計畫現況人口vs計畫人口、周邊已開發住宅區使用率之量化論述，不要
      等委員問。

  - id: building_intensity
    名稱: 建蔽率容積率上限
    條號: FL003637§39
    類型: note
    級別: 參考
    備註: 原始地形平均坡度≥15%者建蔽率≤40%、容積率≤100%；其餘（善化平地應屬此類）建蔽率≤50%、容積率≤200%。提供公設超過最低比例者容積率得酌提，提高部分≤上限20%。

  - id: procedure_agreement
    名稱: 審議與協議程序（協議書鏈是本規範的牙齒）
    條號: FL003637§3～§7、§42、§44～§45、§50
    類型: note
    級別: 參考
    備註: >-
      備土地使用同意書＋變更計畫書圖→市府查核→公展及說明會→市都委會審議→報
      內政部核定→都委會通過後與市府簽訂協議書→取得開發許可後申領雜項執照→
      完成公設興闢移交及捐贈土地移轉登記完成→始得申領建造執照。違反協議書：
      廢止開發許可、限期變更回原分區、已捐贈土地與現金不予發還（三支箭效力，
      §45＋§50）。都會公園富立案前例：都委會審議通過≠結案，可能卡在協議書
      履約（回饋用地移轉登記）多年未能發布實施，報價與排程須把這段納入。

  - id: ownership_consent
    名稱: 土地使用同意書
    條號: FL003637§3
    類型: note
    級別: 參考
    備註: 申請人應檢具全體土地所有權人之土地使用同意書；64筆權屬本機快照皆推論私有（未列於公有土地名冊），關鍵筆數建議以謄本或TCDGIS覆核。
