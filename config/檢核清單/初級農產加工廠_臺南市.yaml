# 初級農產加工廠（農糧產品加工室）容許使用檢核
# ★與本專案先前所有案子不同：本用途走「容許使用」（分區編定不變），非「變更編定」
#   → 農業主管機關同意農業用地變更使用審查作業要點§2(4) 僅管「非農業使用性質」之
#   容許使用；農糧產品加工室屬 M0020022 列名七類農業設施之一，性質仍屬「農業使用」，
#   不落入該要點的§2(4)，故該要點（含隔離綠帶30%規定）原則不適用本用途。
#   （2026-08-06 新化王公廟小段1085-1案首次建立，衍古知識庫查無直接前例）
#
# 法源：
#   ①申請農業用地作農業設施容許使用審查辦法（M0020022，農業部，現行114.12.31修正）
#     §3七大類之「農作產銷設施」／§13附表一「農糧產品加工室」細目
#   ②農產品初級加工場管理辦法（GL001127，農業部109.03.26發布）——設施登記／
#     產品標示合法化用，非土地容許使用依據；申請人資格與加工作業區200㎡上限見此
用途: 初級農產加工廠（農糧產品加工室）容許使用
法源版本: 申請農業用地作農業設施容許使用審查辦法 114.12.31修正；農產品初級加工場管理辦法 109.03.26發布
法源查核日期: 2026-08-06

檢核項目:
  - id: eligible_land_type
    名稱: 可申請用地別
    條號: M0020022§13附表一「農糧產品加工室」可申請用地別
    類型: attribute
    級別: ╳
    欄位: [使用分區, 使分, 使類]
    含值: 建築|工業|林業|生態保護|國土保安|風景|遊憩
    翻轉條件: >-
      本項為反向排除：只有非都市土地之「農牧用地、養殖用地」（工業區、河川區除外）
      或都市計畫農業區/保護區之農業用地才可申請；本清單暫以關鍵字排除明顯不合格用地，
      實際判定仍須人工核對「使類」欄是否為農牧用地或養殖用地。若含值命中，本項為 ╳
      （用地別不合格），若未命中不代表一定合格，仍需人工核對正面條件。
    備註: >-
      條文原文：「非都市土地各種使用分區之農牧用地、養殖用地(工業區、河川區除外)。
      都市計畫範圍之農業區、保護區之農業用地。」

  - id: sfa_caution
    名稱: 特定農業區農牧用地應儘量避免
    條號: M0020022§13附表一「農糧產品加工室」可申請用地別第3款
    類型: attribute
    級別: △
    欄位: [使用分區, 使分]
    含值: 特定農業
    翻轉條件: >-
      非絕對禁止（不同於農地變更審查要點§6之╳級）。條文：「申請坐落土地應儘量避免
      使用特定農業區農牧用地，無可避免使用特定農業區農牧用地者，應以毗鄰建築用地或
      特定農業區邊緣為原則。」→ 命中時務必查：①基地是否緊鄰建築用地
      ②基地是否位於特定農業區邊緣（緊鄰其他分區/都市土地）。兩者有一成立可大幅
      加強申請論述之必要性與無可替代性說明。
      ★**第三條可行路徑（2026-08-07 由新化案人工修正版補入，實務洽詢農業局所得）**：
      基地雖未緊鄰**已開闢**道路，**若能取得相鄰交通用地地號之土地通行同意書，即可
      作為「毗連道路」空間條件之佐證，供受理單位審認**（新化案＝南側1085-3交通用地）。
      → 產線查到基地緊鄰地籍上的「交通用地」但現況未闢建時，不要逕行結論「不符毗連
      道路」，應把「取得該地號通行同意書」列為翻轉條件之一。
    備註: >-
      本項判定為提醒／論述準備，非否准事由；仍須於經營計畫敘明無可替代性
      （具體要求見 nongliang_letter：設施須毗連道路或配置於土地邊緣）。

  - id: floor_area_cap
    名稱: 樓地板面積上限（三道門檻取最嚴）
    條號: M0020022§7（40%基地面積）＋§13附表一農糧產品加工室（990㎡）＋GL001127§3（加工作業區200㎡）
    類型: note
    級別: 參考
    備註: >-
      ①M0020022§7：農業設施總面積不得超過所坐落農業用地面積40%（農產運銷加工設施
      不在該條例外清單，須受40%限）。②附表一農糧產品加工室樓地板最大興建面積990㎡
      上限（含管理/冷藏/加工作業/包裝/出貨/倉儲/污染防治區）。③GL001127§3加工作業區
      （不含辦公/倉儲等附屬空間）另以200㎡為上限。三者取最嚴：以本案登記面積計算
      40%基地面積數字，實際設計樓地板不得超過該數字，亦不得超過990㎡與200㎡各自
      對應之子項上限。

  - id: agri_material_link
    名稱: 加工原料須連結農業生產經營事實
    條號: M0020022§13附表一農糧產品加工室第2款
    類型: note
    級別: 參考
    備註: 加工之農糧原料（含蠶蜂類）須連結申請人自身農業生產經營之事實，且為加工原料之一，不得純為外購原料代工。

  - id: applicant_eligibility
    名稱: 申請人資格
    條號: GL001127§2
    類型: note
    級別: 參考
    備註: >-
      農糧類：全民健保投保資格為農民健康保險被保險人，或已通過百大青年農民輔導
      認定；水產類：持有效漁業執照之漁民；林產類：森林所有人；或前述之農民團體
      （農會/漁會/農業合作社）。本清單無法自動判定，須向使用者確認申請人身分別。

  - id: no_deny_conditions
    名稱: 不予同意情形（M0020022§6）
    條號: M0020022§6
    類型: note
    級別: 參考
    備註: >-
      經營計畫顯不合理，或設施與農業經營必要性顯不相當／申請人其他農地或設施有閒置
      或違規使用情形／妨礙農田灌溉或排水功能／有影響農業產銷之虞者得不予同意／
      應補正未補正、不符分區使用規定、妨礙通行。開案應請申請人先自查有無上述情形。

  - id: existing_facility_check
    名稱: 受理機關與申辦文件（★臺南市已委任區公所，不是農業局）
    條號: M0020022§4、§5；臺南市政府公告 府農務字第1130169295B號
    類型: note
    級別: 參考
    備註: >-
      ★**2026-08-07 更正**：初版寫「向臺南市政府農業局申請」是**錯的**，會讓申請人
      跑錯機關。臺南市已公告委任區公所辦理：**農作產銷設施位於非都市土地特定農業區、
      每一申請人前後申請容許使用累積面積330平方公尺以下者，委任各區公所辦理審查
      及核發同意書**（府農務字第1130169295B號公告）。逾越該門檻或不符委任範圍者
      才回到臺南市政府農業局。
      → 判定受理機關的步驟：先算樓地板上限（見 floor_area_cap，本案198.4㎡）與
      申請人**前後累積**面積，再對330㎡門檻；落在門檻內＝區公所。
      申請文件（各3份）：申請書／申請人身分證影本／經營計畫／一個月內土地登記謄本
      及地籍圖謄本／設施配置圖（比例尺不得小於500分之1）／設施所在地位置略圖／
      土地使用同意書（非自有時）／其他主管機關規定文件。
      流程：提出申請 → 書面審核 → 現場會勘 → 核定 → 核發「農業用地作農業設施容許
      使用同意書」→ 另向臺南市政府農業局行銷科申請「農產品初級加工場登記」
      （GL001127§5，兩者是先後銜接的不同程序、不同受理單位）。
    查證: >-
      臺南市政府農業局「申請農業用地作農作產銷設施容許使用」官網明載「申請人應向
      土地所在區公所申請」並列有「委任區公所辦理農業設施容許使用案件審查及核發
      同意書公告」（2026-08-07 查證，委任事實確認）；該公告 PDF 連結已失效（HTTP 410），
      **文號與330㎡門檻引自新化案人工修正版簡報**（該案曾實際洽詢新化區公所）。
      日後承辦新案若需引為正式依據，請向區公所索取公告全文覆核。

  - id: nongliang_letter
    名稱: 特定農業區必要性之函釋要求（毗連道路或土地邊緣）
    條號: 農糧字第1021046207號函
    類型: note
    級別: 參考
    備註: >-
      ★2026-08-07 依新化案人工修正版補列。函釋內容：「農產運銷加工設施無可避免使用
      特定農業區農牧用地者，申請人應於經營計畫敘明該等設施無可避免使用特定農業區
      農牧用地之理由，由受理審查單位審認其合理性。並在不影響生產經營環境下，申請之
      設施坐落位置須符合**毗連道路或配置於坐落土地邊緣**。」
      → 這條把 sfa_caution（M0020022§13附表一第3款）的抽象要求落成**兩個可操作的
      配置條件**，是經營計畫要正面回應的具體標的：設施位置要嘛毗連道路、要嘛靠土地
      邊緣配置，不能擺在農地中央。
    查證: >-
      公開檢索未取得該函全文（2026-08-07）；內容照錄自新化案人工修正版簡報，
      與 M0020022§13附表一第3款「應以毗鄰建築用地或特定農業區邊緣為原則」方向一致。
      引為正式依據前建議向農糧署或受理區公所索取函文影本。

  - id: business_plan_items
    名稱: 經營計畫應敘明事項（10款）
    條號: M0020022§12
    類型: note
    級別: 參考
    備註: >-
      ★2026-08-07補列（新化案人工修正版整頁列出，屬可沿用的清單資產）。
      ①設施名稱 ②設置目的 ③生產計畫 ④興建設施之基地地號及興建面積
      ⑤現耕農業用地及經營概況 ⑥現有農機具名稱及其數量 ⑦設施建造方式
      ⑧引用水之來源及廢、污水處理計畫 ⑨對周邊農業環境之影響
      ⑩農業事業廢棄物處理及再利用計畫。
      → 交付評估簡報時可直接做成一頁核對表，並在其下另列「本案應補充事項」
      （★標記），把該案特有的論證負擔（面積匹配、通行同意書、無可避免使用特農區
      之理由等）掛在對應款次旁，讓申請人知道經營計畫要往哪裡加。

  - id: runoff_control
    名稱: 出流管制（加工場屬列名開發樣態，門檻1公頃）
    條號: 出流管制計畫書與規劃書審核監督及免辦認定辦法（J0110108）§2Ⅰ⑩
    類型: note
    級別: 參考
    備註: >-
      ★2026-08-07補列。§2Ⅰ⑩明列「農、林、漁、牧產品集貨場、運銷場所、休閒農場、
      **加工場**（含飼料製造）、冷凍（藏）庫及辦公廳舍等相關設施之開發」，面積達
      **1公頃**以上者為義務人。本用途典型基地遠小於1公頃（新化案496㎡），通常不
      觸發；但**分次、累積開發面積要納入計算**（§2Ⅱ②），同一申請人陸續擴充時要回頭
      重算。另§2-1（都市計畫區內新建建築0.2公頃）僅適用都市計畫區，非都市土地案不涉。
    查證: 全國法規資料庫 J0110108§2 全文（2026-08-07 下載原文逐字核對）
