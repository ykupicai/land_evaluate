# 都市計畫工業區變更為住宅區 — 嘉義縣（個案變更，都市土地）
# 2026-11-26 建（布袋見龍段876 評估案首建）
#
# 法源鏈：
#   母法＝都市計畫工業區檢討變更審議規範（FL003620，100.12.23 修正；都市計畫法§27-1Ⅱ）
#     內政部主管法規共用系統全文下載逐點核對（2026-11-26）；知識庫已建筆記與 XTN-43～XTN-53
#     ⚠ XTN-43～53 尚未轉正，依專案規定不填「規則編號」欄，只寫條號；轉正後再補編號。
#   程序＝都市計畫法§27Ⅰ③④（私人個案變更須先被認定）、§26（通盤檢討）
#   併行＝出流管制（WRA-002-1）、環評新市區建設（EIA-25）、地下水管制（WRA-005）、建築線（BTR-2）
#   ⚠ 建清單時已掃規則庫快取（386 條）；工業區變更住宅區無既有已轉正專屬規則。
#   ⚠ 嘉義縣／布袋都市計畫是否另有工業區變更之地方專屬規定（通檢書、自治條例），本清單**不知道**，
#     見 local_rules 項（FL003620 第十二點(二)：另有規定者得由都委會審決不適用本規範）。
#
# 用法：
#   check_zones --joined <基地.shp> --checklist 住宅區_工業區變更_都市計畫_嘉義縣
用途: 都市計畫工業區變更住宅區
法源版本: 都市計畫工業區檢討變更審議規範100.12.23修正
法源查核日期: 2026-11-26

檢核項目:
  - id: review_path
    名稱: 申請路徑——私人個案變更須先經認定符合都市計畫法§27Ⅰ③④
    條號: FL003620 第三點(二)2；都市計畫法§27Ⅰ③④、§26
    類型: inquiry
    機關: 嘉義縣政府（都市計畫主管機關）
    備註: >-
      私人申請工業區變更為住宅區屬個案變更，須「有具體可行之財務及實施計畫」並經認定符合
      都市計畫法§27Ⅰ③（適應國防或經濟發展之需要）或④（配合中央、直轄市或縣（市）興建之重大設施），
      才能依程序辦理。一般私人住宅開發是否能被如此認定，須洽縣府；不能認定時改循通盤檢討（§26）納入。
      另經通盤檢討認定屬「必要之工業區」者不得變更（第三點(一)2）。

  - id: registered_estate
    名稱: 是否屬工業主管機關編定之工業區（未解除不得變更）
    條號: FL003620 第五點(三)
    類型: inquiry
    機關: 經濟部產業發展署（原工業局）／嘉義縣政府經濟發展主管單位
    備註: >-
      依獎勵投資條例或促進產業升級條例編定為工業區者，未經工業主管機關公告解除前不得變更使用（╳ 級）。
      全國都市計畫服務只能看出分區類別，看不出是否為編定工業區，須函詢確認。

  - id: location
    名稱: 區位原則——不妨礙鄰近土地使用
    條號: FL003620 第五點(一)
    類型: note
    級別: △
    備註: >-
      須論證「因都市發展結構改變對社區生活環境發生不良影響」或「較適宜作為其他使用且不妨礙鄰近土地使用」。
      基地若位於仍在生產的工業區街廓內、周邊為農業區，住宅與工業使用相鄰，區位論述不易成立。
      實際周邊組成與距離見案件 周邊分區/周邊分區組成.json。

  - id: housing_quantity
    名稱: 總量管制——住宅區檢討基準
    條號: FL003620 第五點(二)1；都市計畫定期通盤檢討實施辦法（住宅區檢討基準）
    類型: inquiry
    機關: 嘉義縣政府（布袋都市計畫通盤檢討書）
    備註: 須查最近一次通盤檢討書之計畫人口與住宅區供需；住宅區已供過於求者不得再增（╳）。

  - id: owner_consent
    名稱: 全部土地所有權人同意＋與縣府簽協議書
    條號: FL003620 第六點本文
    類型: note
    級別: 參考
    備註: 主要計畫核定前須檢附全部土地所有權人土地使用變更同意書，並與縣府（或公所）簽定協議書納入計畫書。

  - id: donation_ratio
    名稱: 捐贈公設用地及可建築土地（住宅區 ≥37%，其中公設 ≥30%）
    條號: FL003620 第六點(一)、第八點、第九點
    類型: note
    級別: △
    備註: >-
      變更為住宅區，捐贈公設用地＋可建築土地合計不得低於變更工業區土地總面積 37%，其中公設用地不得低於 30%；
      捐贈之可建築土地須為完整可供建築之土地，經都委會同意得改捐代金（不得低於變更後第一次公告現值 1.4 倍）。
      小基地捐地後可建築土地所剩有限、且難切出完整可建築土地，列 △（實算見案件簡報）。

  - id: far_formula
    名稱: 變更後容積率公式與上限
    條號: FL003620 第七點
    類型: note
    級別: 參考
    備註: >-
      變更後容積率＝變更前工業區容積率×變更前面積／（變更前面積－變更後公設用地面積），
      且不得大於鄰近住宅區容積率；獎勵＋移轉容積合計 ≤ 基準容積 0.5 倍。須查布袋都市計畫土地使用分區管制要點之
      工業區與住宅區容積率。

  - id: factory_relocation
    名稱: 現況工廠——遷廠計畫書或註銷工廠登記、勞基法
    條號: FL003620 第四點(一)(二)、第十一點(四)(五)
    類型: inquiry
    機關: 嘉義縣政府（工業主管機關）；經濟部工廠登記資料
    備註: 現況有生產中合法工廠者，須檢具註銷工廠登記證明或核定之遷廠計畫書，並依勞基法辦理資遣等事項。

  - id: soil_groundwater
    名稱: 土壤及地下水污染評估調查
    條號: FL003620 第四點(五)、第十一點(六)
    類型: inquiry
    機關: 嘉義縣環境保護局
    備註: 申請書件須附土壤及地下水污染評估調查資料；有污染者處理方式須納入環評與都市計畫變更書件。

  - id: development_deadline
    名稱: 三年內開發建設，否則恢復工業區
    條號: FL003620 第六點(四)(五)
    類型: note
    級別: 參考
    備註: 區內全部公設建設費及樁位測定費由開發者負擔；細部計畫發布實施三年內未依協議開發者，一年內檢討恢復為工業區。

  - id: exemption_12
    名稱: 排除條款（得由都委會審決不適用本規範）
    條號: FL003620 第十二點
    類型: note
    級別: 參考
    備註: >-
      (一)政府區段徵收／市地重劃／都市更新 (二)國家重大建設或自治條例／通檢書另有規定 (三)書圖不符、發照錯誤、
      地形修測、計畫圖重製或基地畸零狹小 (四)現有聚落建築密集、未增加允許使用項目或變更後非住宅商業。
      私人一般住宅開發通常不符(一)(四)；(二)(三)須逐項查證。

  - id: local_rules
    名稱: 嘉義縣／布袋都市計畫地方專屬規定
    條號: FL003620 第十二點(二)
    類型: inquiry
    機關: 嘉義縣政府
    備註: 該都市計畫通檢書或縣自治條例對工業區變更另有規定者，得由都委會審決優先適用；須洽詢或查通檢書。

  - id: building_line
    名稱: 臨接計畫道路與建築線
    條號: 建築技術規則建築設計施工編§2
    規則編號: [BTR-2]
    類型: note
    級別: △
    備註: >-
      建築基地應與建築線相連接、連接部分至少 2 公尺。基地若未臨接計畫道路，變更住宅區後須在細部計畫劃設
      道路或以私設通路連接，並取得通行土地權利。實測距離見案件 周邊分區/臨路與現況.json。

  - id: outflow_control
    名稱: 出流管制計畫書（都市計畫區內新建建築物 ≥0.2 公頃）
    條號: 出流管制計畫書與規劃書審核監督及免辦認定辦法§2-1
    規則編號: [WRA-002-1]
    類型: note
    級別: △
    備註: 基地全部位於都市計畫區，新建建築物面積達 0.2 公頃以上應提出流管制計畫書；未達 1 公頃已辦雨水流出抑制或貯留設施者得免提。

  - id: eia_new_town
    名稱: 環評——新市區建設（三戶以上集合住宅或社區）
    條號: 開發行為應實施環境影響評估細目及範圍認定標準§25
    規則編號: [EIA-25]
    類型: note
    級別: 參考
    備註: >-
      三戶以上集合住宅或社區依區位設門檻（規則庫摘要列山坡地、特定農業區 1 公頃、非都市土地 10 公頃，
      都市計畫區內之門檻摘要未列，待回§25 原文核對）；另有毗連土地合計逾 1 公頃之累積條款。

  - id: groundwater_control
    名稱: 嚴重地層下陷／地下水管制區
    條號: 地下水管制辦法§4
    規則編號: [WRA-005]
    類型: note
    級別: △
    備註: >-
      NGIS 回報基地位於「嚴重地層下陷地區」（2-03，二級環敏）。依專案定案，該舊圖層已由地下水管制區取代，
      須以本機 環境敏感相關/其他/地下水管制區/ 核對管制級別（第一級原則禁止新鑿井）；開發用水應採自來水。
