# 門牌坐標資料來源註冊表（各縣市民政局開放資料，data.gov.tw）
#
# 用途：「與十戶以上之村莊或聚落最短水平距離應大於 N 公尺」這類條款的機械化判定。
#       由 scripts/settlement_check.py 讀取；下載後的 CSV 放 門牌坐標\<縣市>.csv（不進版控）。
#
# ★★ 交付口徑（官方資料說明原文，不得省略）：
#   「本坐標資料係各戶政事務所於電腦上系統內參照各相對門牌位置人工點位，非準確坐標位置，
#     僅供參考。門牌號不因坐標存在而作為建築物門牌存在之依據，若有疑義由所轄各戶政事務所
#     依權責審認。」
#   → 本資料只能作為**篩選與初判**；法定認定仍以主管機關（戶政事務所／區公所）為準。
#
# ★ 門牌 ≠ 戶：一個門牌可能是多戶公寓（低估），廟宇／工廠／倉庫／魚塭寮有門牌卻無人居住
#   （高估）。故輸出一律稱「門牌數」，不寫「戶數」；臨界值（8~12）必須現地或戶政查證。
#
# ★ 同一資料集常同時掛著多個年度版本（臺南 108~114 年七版）——下載器一律解析
#   resourceDescription 的「NNN年」取最大者，並把版本寫進 <縣市>.csv.版本.txt。
#   這是 BREED47（2016 舊版誤判）教訓的同型陷阱，勿手動挑「第一個 CSV」。

說明:
  資料集查詢法: >-
    data.gov.tw 搜「<縣市>門牌」；或用本專案的 twinkle-hub MCP：
    search_datasets(query="門牌", agency="<縣市>")。取得 dataset_id 後填到下表即可，
    下載網址由 https://data.gov.tw/api/v2/rest/dataset/<id> 自動解析，不必手抄。
  坐標系: TWD97 TM2（EPSG:3826）為主；若該縣市給經緯度，腳本自動轉換。

縣市:
  臺南市:
    dataset_id: 120044
    名稱: 臺南市門牌坐標資料-僅供參考
    已驗證: true          # 2026-07-30 實跑：114 年版 847,103 筆、37 區齊、坐標零缺漏
    更新頻率: 每年
    欄位:
      x: 橫座標[E 坐標]
      y: 縱座標[N 坐標]

  # 以下為目錄搜尋所得線索，**尚未實跑驗證**（欄位名各縣市不同，腳本會自動偵測；
