# 都市計畫圖官方圖例（依內政部「都市計畫圖圖例」附件三，2026-07-07 建）
#
# 來源：都市計畫/附件三、都市計畫圖圖例.pdf
# 重要：全台都市計畫土地使用分區.shp 的 `Color1` 欄位＝官方數值化 RGB 色
#       （PDF 明訂「R.G.B 值為數值化都市計畫圖繪製顏色基準」），
#       全台僅 26 種色、99.99% 完整、格式一律 "R,G,B"。
#       出圖上色 → 直接用 Color1 欄 data-defined（styles/都市計畫.qml），
#       不需逐分區建分類表（zone 欄有 2,502 種計畫個別命名變體）。
# 本檔用途：(1) 地圖圖例面板的權威分區→色對照 (2) 交叉檢核 shp Color1。
#
# 註記：少數 shp Color1 與 PDF 統一圖例略有出入（例：商業區 PDF=255,0,63、
#       shp 多為 255,0,0）。以 shp Color1 為每宗地實際繪製值（政府數值化原檔），
#       PDF 值為法定基準供圖例面板顯示。

shp_path: 都市計畫/全台都市計畫土地使用分區.shp
crs: EPSG:3826
color_field: Color1     # 每筆官方 RGB，"R,G,B"
zone_field: zone        # 分區/用地全名
zone_short_field: zone_s
zone_code_field: zone_c
plan_name_field: name_c # 計畫名（如 基隆市主要計畫）

# 一、擬定計畫圖例（分區/用地 → 官方 R,G,B）
zones:
  住宅區: [255, 255, 0]
  商業區: [255, 0, 63]
  工業區: [127, 63, 0]
  行政區: [0, 127, 255]
  文教區: [191, 127, 255]
  倉儲區: [76, 38, 0]
  農業區: [127, 255, 0]
  風景區: [0, 255, 0]
  保護區: [127, 255, 0]         # 統一圖例含綠色網點
  水岸發展區: [127, 255, 255]   # 統一圖例含網點
  宗教專用區: [127, 255, 0]
  保存區: [127, 255, 0]
  河川區: [127, 255, 255]
  學校用地: [191, 127, 255]     # 國小/國中/高中/高職/大專均同色
  社教用地: [191, 127, 255]
  公園用地: [0, 255, 0]         # 公園(綠地)、公園兼兒童遊樂場
  體育場用地: [0, 255, 0]
  廣場用地: [255, 0, 255]
  兒童遊樂場用地: [0, 255, 0]
  名勝古蹟紀念性建築用地: [0, 255, 0]
  批發市場用地: [255, 63, 0]
  零售市場用地: [255, 63, 0]
  市場用地: [255, 63, 0]
  高速公路用地: [255, 0, 255]
  機關用地: [0, 127, 255]
  變電所用地: [183, 183, 183]
  停車場用地: [255, 63, 0]
  加油站用地: [255, 0, 255]
  鐵路用地: [183, 183, 183]
  港埠用地: [127, 63, 0]
  民用航空站用地: [0, 127, 255]
  屠宰場用地: [183, 183, 183]
  垃圾處理廠用地: [183, 183, 183]
  火葬場用地: [255, 255, 127]
  殯儀館用地: [255, 255, 127]
  墳墓用地: [0, 255, 0]         # 統一圖例含框線紋
  污水處理廠用地: [183, 183, 183]
  煤氣廠用地: [183, 183, 183]
  園林道路用地: [0, 255, 0]
  海濱浴場用地: [127, 255, 255]
  河道用地: [127, 255, 255]
  溝渠用地: [127, 255, 255]     # 水利類，比照河道用地淡藍（2026-08-20 補；縣市圖台常見）
  道路用地: [255, 255, 255]     # shp 白色；人行步道用地同
  人行步道用地: [255, 255, 255]
  非都市土地: [183, 183, 183]   # 變更計畫圖例附註

# 二、變更計畫圖例（YAGNI：本工具暫不繪製變更斜斑線；如需再實作）
#   規則：以原分區色作邊框 + 框內以新分區色畫 45° 斜斑線，斜線上標新分區簡稱。

# 三、其他圖例（範圍線；出圖邊界用）
boundaries:
  行政區範圍: [0, 0, 0]
  主要計畫範圍: [0, 0, 0]
  細部計畫範圍: [0, 0, 0]
  都市計畫禁建範圍: [255, 0, 63]
  軍事禁建範圍: [255, 0, 63]
  軍事限建範圍: [255, 0, 63]
  都市更新地區範圍: [0, 0, 0]
  新訂都市計畫範圍: [0, 0, 0]
  附帶條件範圍: [0, 0, 0]
